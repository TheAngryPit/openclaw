name: Watch personal identity iOS proof

on:
  push:
    branches: [infra/watch-personal-ios-proof]
    paths: [.github/workflows/watch-personal-ios-proof.yml]

permissions:
  contents: read

jobs:
  identity:
    if: github.repository == 'TheAngryPit/openclaw'
    runs-on: xcode-27
    env:
      TARGET_SHA: decab39058b4d83851fe7000509ccb675faa03e6
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout exact public candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: decab39058b4d83851fe7000509ccb675faa03e6
          persist-credentials: false
      - name: Verify candidate and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          printf 'Candidate: %s\n' "$(git rev-parse HEAD)"
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          mkdir -p "$RUNNER_TEMP/identity-proof"
          xcodebuild -version
          swift --version
          df -k "$RUNNER_TEMP"
          shasum -a 256 package.json pnpm-lock.yaml pnpm-workspace.yaml \
            apps/macos/Package.resolved apps/shared/OpenClawWatchRTC/Cargo.lock \
            > "$RUNNER_TEMP/identity-proof/locks.sha256"
      - name: Prepare canonical Node dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: '24.22.1'
          install-bun: 'false'
          install-deps: 'true'
          frozen-lockfile: 'true'
          cache-mode: 'off'
          dependency-cache: 'false'
          restore-test-caches: 'false'
      - name: Prepare pinned Apple tools and Watch compiler
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/identity-tools"
          ./scripts/install-xcodegen.sh "$tools"
          ./scripts/install-swift-tools.sh "$tools"
          echo "$tools" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          toolchain="$(awk -F '"' '/^channel =/ {print $2; exit}' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src
          echo "OPENCLAW_WATCH_RTC_CACHE_DIR=$RUNNER_TEMP/identity-watch-rtc" >> "$GITHUB_ENV"
          df -k "$RUNNER_TEMP"
      - name: Generate project and select simulator
        shell: bash
        run: |
          set -euo pipefail
          pnpm ios:gen
          source scripts/lib/swift-toolchain.sh
          simulator="$(select_ios_test_simulator)"
          test -n "$simulator"
          echo "IOS_SIMULATOR_ID=$simulator" >> "$GITHUB_ENV"
          printf '%s\n' "$simulator" > "$RUNNER_TEMP/identity-proof/simulator-id.txt"
      - name: Run selected native identity tests
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/identity-proof"
          source scripts/lib/swift-toolchain.sh
          set +e
          run_apple_command_logged "$proof/xcodebuild.log" xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj -scheme OpenClaw \
            -configuration Debug -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:?}" \
            -derivedDataPath "$RUNNER_TEMP/identity-derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/identity-source-packages" \
            -packageCachePath "$RUNNER_TEMP/identity-package-cache" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -only-testing:OpenClawTests/NodeAppModelInvokeTests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= PROVISIONING_PROFILE= \
            -resultBundlePath "$proof/Identity.xcresult" test
          result=$?
          printf '%s\n' "$result" > "$proof/xcodebuild.exit"
          set -e
          shasum -a 256 -c "$proof/locks.sha256"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          exit "$result"
      - name: Inspect result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/identity-proof"
          if [[ -f "$proof/xcodebuild.exit" ]] && [[ "$(cat "$proof/xcodebuild.exit")" != 0 ]]; then
            cat "$proof/xcodebuild.log"
          fi
          test -d "$proof/Identity.xcresult"
          xcrun xcresulttool get test-results summary --path "$proof/Identity.xcresult" > "$proof/summary.json"
          xcrun xcresulttool get test-results tests --path "$proof/Identity.xcresult" > "$proof/tests.json"
          python3 - "$proof/summary.json" "$proof/tests.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          tests = json.load(open(sys.argv[2]))
          print(json.dumps(summary, sort_keys=True))
          print(json.dumps(tests, sort_keys=True))
          assert summary.get('result') == 'Passed', summary
          assert summary.get('totalTestCount', 0) > 0, summary
          assert summary.get('passedTests') == summary.get('totalTestCount'), summary
          assert summary.get('failedTests') == 0, summary
          assert summary.get('skippedTests') == 0, summary
          assert summary.get('expectedFailures') == 0, summary
          assert summary.get('testFailures') == [], summary
          assert 'NodeAppModelInvokeTests' in json.dumps(tests), 'Selected suite missing'
          PY
