          entry_sha256="$(sha256sum dist/entry.js | cut -d ' ' -f 1)"
          [[ "$entry_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'OPENCLAW_QA_EXPECTED_GATEWAY_ENTRY_SHA256=%s\n' "$entry_sha256" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const root = path.resolve('dist/control-ui');
          const index = fs.readFileSync(path.join(root, 'index.html'));
          const src = index.toString('utf8').match(/<script\b[^>]*\bsrc=["']([^"']+\.js(?:\?[^"']*)?)["']/i)?.[1];
          if (!src) throw new Error('Fresh UI build missing main script');
          const asset = path.resolve(root, decodeURIComponent(new URL(src, 'http://127.0.0.1/').pathname.replace(/^\/+/, '')));
          const rel = path.relative(root, asset);
          if (!rel || rel === '..' || rel.startsWith(`..${path.sep}`) || path.isAbsolute(rel)) throw new Error('UI main asset escaped build root');
          const hash = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const indexHash = hash(index), assetHash = hash(fs.readFileSync(asset));
          fs.appendFileSync(process.env.GITHUB_ENV, `OPENCLAW_QA_EXPECTED_UI_INDEX_SHA256=${indexHash}\nOPENCLAW_QA_EXPECTED_UI_MAIN_ASSET_SHA256=${assetHash}\n`);
          fs.appendFileSync(path.join(process.env.OPERATOR_PROOF_ROOT, 'receipt.txt'), `fresh_build_product_sha=${process.env.CANDIDATE_SHA}\nfresh_build_workflow_sha=${process.env.PROOF_WORKFLOW_SHA}\nui_index_sha256=${indexHash}\nui_main_asset_sha256=${assetHash}\n`);
          NODE
          printf 'gateway_entry_sha256=%s\n' "$entry_sha256" >> "$OPERATOR_PROOF_ROOT/receipt.txt"

      - name: Capture real-token named unnamed and changed-name behavior
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          for qa_case in named unnamed mutation; do
            cell="$OPERATOR_PROOF_ROOT/$OPERATOR_VARIANT-$qa_case"
            mkdir "$cell"
            OPENCLAW_QA_UI_VARIANT="$OPERATOR_VARIANT" \
            OPENCLAW_QA_CASE="$qa_case" \
            OPENCLAW_QA_UI_REPO_ROOT="$PWD" \
            OPENCLAW_QA_GATEWAY_REPO_ROOT="$PWD" \
            OPENCLAW_QA_EXPECTED_UI_COMMIT="$CANDIDATE_SHA" \
            OPENCLAW_QA_EXPECTED_GATEWAY_COMMIT="$CANDIDATE_SHA" \
            OPENCLAW_QA_ARTIFACT_DIR="$cell" \
            node ../qa-harness/artifacts/operator-token-capture-linux-20261005/run-operator-token-capture.mjs
          done

      - name: Require successful real-source receipts cleanup and desktop/mobile captures
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          for (const qaCase of ['named', 'unnamed', 'mutation']) {
            const variant = process.env.OPERATOR_VARIANT;
            const dir = path.join(process.env.OPERATOR_PROOF_ROOT, `${variant}-${qaCase}`);
            const r = JSON.parse(fs.readFileSync(path.join(dir, 'result.json'), 'utf8'));
            if (r.status !== 'passed' || r.uiVariant !== variant || r.qaCase !== qaCase ||
                r.sourceProvenance?.uiCommit !== process.env.CANDIDATE_SHA ||
                r.sourceProvenance?.gatewayCommit !== process.env.CANDIDATE_SHA ||
                r.sourceProvenance?.gatewayBuildIdentity?.entrySha256 !== process.env.OPENCLAW_QA_EXPECTED_GATEWAY_ENTRY_SHA256 ||
                r.sourceProvenance?.uiAssetDigests?.expected?.indexSha256 !== process.env.OPENCLAW_QA_EXPECTED_UI_INDEX_SHA256 ||
                r.sourceProvenance?.uiAssetDigests?.expected?.mainAssetSha256 !== process.env.OPENCLAW_QA_EXPECTED_UI_MAIN_ASSET_SHA256 ||
                r.cleanup?.browserClosed !== true || r.cleanup?.gatewayProcessGroupStopped !== true ||
                r.cleanup?.gatewayPortReleased !== true || r.tokenFragmentRemoved !== true ||
                r.communityInvitation?.cardAbsentInDesktopAndMobileScreenshots !== true) {
              throw new Error(`Incomplete actual operator proof: ${variant}-${qaCase}`);
            }
            for (const viewport of ['desktop', 'mobile']) {
              if (fs.statSync(path.join(dir, `${variant}-${qaCase}-owner-${viewport}.png`)).size === 0) {
                throw new Error('Empty owner screenshot');
              }
            }
          }
          NODE
          printf 'required_operator_receipts_and_media=present\n' >> "$OPERATOR_PROOF_ROOT/receipt.txt"

      - name: Upload only synthetic owner captures and bounded receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: identity-operator-proof-${{ inputs.operator_variant }}-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/operator-proof/*/*-owner-desktop.png
            ${{ runner.temp }}/operator-proof/*/*-owner-mobile.png
            ${{ runner.temp }}/operator-proof/*/result.json
            ${{ runner.temp }}/operator-proof/receipt.txt
          if-no-files-found: error
          retention-days: 7

  tailscale-paired-real-gateway-diagnostic:
    if: github.repository == 'TheAngryPit/openclaw' && inputs.proof_kind == 'tailscale-paired'
    name: Tailscale real-Gateway paired diagnostic (${{ matrix.label }})
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: base
            revision: 1e49231d063bad36e4b6b187727d957fbfc7fdfb
          - label: merge
            revision: 73cdbbc55705a90551a8342e3abfaf27f0672d7e
    env:
      DIAGNOSTIC_LABEL: ${{ matrix.label }}
      DIAGNOSTIC_REVISION: ${{ matrix.revision }}
      DIAGNOSTIC_WORKFLOW_SHA: ${{ github.workflow_sha }}
      EXPECTED_PACKAGE_MANAGER: pnpm@12.5.1+sha512.e3f305bc784a2bc89f5ad3b6138889470fae8d2af5f36b61216ec91c2c3d64089775f9de38aac331044ea40f245cb0d5666392dfdf65824e1907ef6a2c62de5f
      OPENCLAW_CAPTURE_UI_PROOF: "0"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false

      - name: Initialize external receipt and verify pristine checkout
        shell: bash
        run: |
          set -euo pipefail
          qa_root="$RUNNER_TEMP/tailscale-paired-qa-20261005/$DIAGNOSTIC_LABEL"
          mkdir -p "$qa_root/receipt" "$qa_root/diagnostics" "$qa_root/artifacts"
          printf 'OPENCLAW_QA_ROOT=%s\n' "$qa_root" >> "$GITHUB_ENV"
          printf 'OPENCLAW_UI_E2E_ARTIFACT_DIR=%s\n' "$qa_root/artifacts" >> "$GITHUB_ENV"
          printf 'OPENCLAW_UI_E2E_DIAGNOSTIC_DIR=%s\n' "$qa_root/diagnostics" >> "$GITHUB_ENV"
          status="$(git status --porcelain --untracked-files=all)"
          {
            printf 'label=%s\nrevision_expected=%s\nrevision_actual=' "$DIAGNOSTIC_LABEL" "$DIAGNOSTIC_REVISION"
            git rev-parse HEAD
            printf 'workflow_sha=%s\nsource_status_before=<%s>\n' "$DIAGNOSTIC_WORKFLOW_SHA" "$status"
          } > "$qa_root/receipt/checkout.txt"
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_REVISION"
          test -z "$status"

      - name: Setup pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Activate exact packageManager and install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node -p "require('./package.json').packageManager")"
          test "$package_manager" = "$EXPECTED_PACKAGE_MANAGER"
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          corepack enable
          corepack prepare "$package_manager" --activate
          test "$(node --version)" = v24.19.0
          test "$(pnpm --version)" = 12.5.1
          pnpm install --frozen-lockfile

      - name: Write the pinned include inventory outside the product checkout
        shell: bash
        run: |
          set -euo pipefail
          cat > "$OPENCLAW_QA_ROOT/receipt/include.json" <<'JSON'
          [
            "ui/src/e2e/chat-flow.catalog-bootstrap.e2e.test.ts",
            "ui/src/e2e/worker-initial-setup.real-gateway.e2e.test.ts",
            "ui/src/e2e/agent-file-lifecycle.real-gateway.e2e.test.ts",
            "ui/src/e2e/chat-composer-websearch-kill-switch.real-gateway.e2e.test.ts",
            "ui/src/e2e/chat-agent-avatar.real-gateway.e2e.test.ts",
            "ui/src/e2e/chat-stop-finished-run.real-gateway.e2e.test.ts",
            "ui/src/e2e/chat-thinking-metadata.real-gateway.e2e.test.ts",
            "ui/src/e2e/control-ui-auth-transports.e2e.test.ts",
            "ui/src/e2e/device-alias-rename.real-gateway.e2e.test.ts",
            "ui/src/e2e/logs-lifecycle.e2e.test.ts",
            "ui/src/e2e/model-picker-search.real-gateway.e2e.test.ts",
            "ui/src/e2e/profile-page.real-gateway.e2e.test.ts",
            "ui/src/e2e/session-progress-hovercard.real-gateway.e2e.test.ts"
          ]
          JSON
          printf 'OPENCLAW_VITEST_INCLUDE_FILE=%s\n' "$OPENCLAW_QA_ROOT/receipt/include.json" >> "$GITHUB_ENV"
          sha256sum "$OPENCLAW_QA_ROOT/receipt/include.json" > "$OPENCLAW_QA_ROOT/receipt/include.sha256"

      - name: Install the revision-pinned Playwright Chromium
        shell: bash
        run: node --import tsx scripts/ensure-playwright-chromium.mts --require-playwright-chromium

      - name: Build runtime and Control UI from the exact revision
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
        run: pnpm build

      - name: Capture source, toolchain, lock, and runner receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          qa_root="${OPENCLAW_QA_ROOT:-$RUNNER_TEMP/tailscale-paired-qa-20261005/$DIAGNOSTIC_LABEL}"
          mkdir -p "$qa_root/receipt"
          head_sha='<checkout-unavailable>'
          status='<checkout-unavailable>'
          if git rev-parse --git-dir >/dev/null 2>&1; then
            head_sha="$(git rev-parse HEAD)"
            status="$(git status --porcelain --untracked-files=all)"
          fi
          blob_of() {
            git rev-parse "HEAD:$1" 2>/dev/null || printf '<unavailable>\n'
          }
          package_manager='<unavailable>'
          if [[ -f package.json ]] && command -v node >/dev/null 2>&1; then
            package_manager="$(node -p "require('./package.json').packageManager" 2>/dev/null || printf '<unavailable>')"
          fi
          node_version='<unavailable>'
          if command -v node >/dev/null 2>&1; then node_version="$(node --version)"; fi
          pnpm_version='<unavailable>'
          if command -v pnpm >/dev/null 2>&1; then pnpm_version="$(pnpm --version 2>/dev/null || printf '<unavailable>')"; fi
          {
            printf 'label=%s\nrevision_expected=%s\nrevision_actual=%s\n' "$DIAGNOSTIC_LABEL" "$DIAGNOSTIC_REVISION" "$head_sha"
            printf 'workflow_sha=%s\nsource_status_before_test=<%s>\n' "$DIAGNOSTIC_WORKFLOW_SHA" "$status"
            printf 'workflow_blob=%s\n' "$(blob_of .github/workflows/ci.yml)"
            printf 'prebuilt_config_blob=%s\n' "$(blob_of test/vitest/vitest.ui-e2e-prebuilt.config.ts)"
            printf 'e2e_config_blob=%s\n' "$(blob_of test/vitest/vitest.ui-e2e.config.ts)"
            printf 'include_parser_blob=%s\n' "$(blob_of test/vitest/vitest.pattern-file.ts)"
            printf 'runner_script_blob=%s\n' "$(blob_of scripts/run-vitest.mjs)"
            printf 'chromium_installer_blob=%s\n' "$(blob_of scripts/ensure-playwright-chromium.mts)"
            printf 'lock_blob=%s\n' "$(blob_of pnpm-lock.yaml)"
            printf 'package_manager=%s\nnode=%s\npnpm=%s\n' "$package_manager" "$node_version" "$pnpm_version"
            printf 'playwright='; if command -v pnpm >/dev/null 2>&1 && pnpm --dir ui exec playwright --version; then :; else printf '<unavailable>\n'; fi
            printf 'os_release:\n'; cat /etc/os-release
            printf 'kernel='; uname -a
            printf 'logical_cpus='; getconf _NPROCESSORS_ONLN
            printf 'memory='; awk '/MemTotal/ {print $2 " kB"}' /proc/meminfo
            printf 'workspace_disk='; df -B1 --output=size,avail . | tail -n 1
            if [[ -f pnpm-lock.yaml ]]; then printf 'lock_sha256='; sha256sum pnpm-lock.yaml; else printf 'lock_sha256=<unavailable>\n'; fi
            include_file="${OPENCLAW_VITEST_INCLUDE_FILE:-$qa_root/receipt/include.json}"
            if [[ -f "$include_file" ]]; then
              printf 'include_sha256='; sha256sum "$include_file"
            else
              printf 'include_sha256=<not-created>\n'
            fi
          } > "$qa_root/receipt/pre-test.txt"
          if [[ "$head_sha" != '<checkout-unavailable>' ]]; then
            test "$head_sha" = "$DIAGNOSTIC_REVISION"
            test -z "$status"
          fi

      - name: Run the unchanged PREBUILT real-Gateway inventory
        id: run_real_gateway
        shell: bash
        run: |
          set -euo pipefail
          config=test/vitest/vitest.ui-e2e-prebuilt.config.ts
          test -f "$config"
          node scripts/run-vitest.mjs run \
            --config "$config" \
            --configLoader runner \
            --reporter verbose \
            --reporter github-actions \
            --reporter default \
            --reporter ./scripts/lib/vitest-resource-reporter.mts \
            --maxWorkers 2 \
            --exclude ui/src/e2e/desktop-resize.real-gateway.e2e.test.ts

      - name: Record final source state and test outcome
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.run_real_gateway.outcome || 'not-run' }}
        shell: bash
        run: |
          set -euo pipefail
          qa_root="${OPENCLAW_QA_ROOT:-$RUNNER_TEMP/tailscale-paired-qa-20261005/$DIAGNOSTIC_LABEL}"
          mkdir -p "$qa_root/receipt"
          head_sha='<checkout-unavailable>'
          status='<checkout-unavailable>'
          if git rev-parse --git-dir >/dev/null 2>&1; then
            head_sha="$(git rev-parse HEAD)"
            status="$(git status --porcelain --untracked-files=all)"
          fi
          {
            printf 'label=%s\nrevision_expected=%s\nrevision_actual=%s\n' "$DIAGNOSTIC_LABEL" "$DIAGNOSTIC_REVISION" "$head_sha"
            printf 'workflow_sha=%s\ntest_outcome=%s\nsource_status_after=<%s>\n' "$DIAGNOSTIC_WORKFLOW_SHA" "$TEST_OUTCOME" "$status"
          } > "$qa_root/receipt/final.txt"
          if [[ "$head_sha" != '<checkout-unavailable>' ]]; then
            test "$head_sha" = "$DIAGNOSTIC_REVISION"
            test -z "$status"
          fi

      - name: Upload bounded receipt and public failure summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tailscale-paired-qa-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tailscale-paired-qa-20261005/${{ matrix.label }}/receipt/**
            ${{ runner.temp }}/tailscale-paired-qa-20261005/${{ matrix.label }}/diagnostics/failure-*/failure.public.json
          if-no-files-found: ignore
          retention-days: 7

  codex-catalog-paired:
    name: PR130115 original default shard (${{ matrix.label }})
    if: ${{ github.repository == 'TheAngryPit/openclaw' && github.event_name == 'workflow_dispatch' && inputs.proof_kind == 'codex-catalog-paired' && inputs.candidate_sha == 'd58f658547ef92b124b6bf6f467379620de224b3' }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: baseline
            revision: cfc1f6b3f68256fd8b6889cdc68be61c9fdf096c
          - label: candidate
            revision: d58f658547ef92b124b6bf6f467379620de224b3
    env:
      INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      INPUT_PROOF_KIND: ${{ inputs.proof_kind }}
      QA_LABEL: ${{ matrix.label }}
      QA_REVISION: ${{ matrix.revision }}
      QA_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QA_RUN_ID: ${{ github.run_id }}
      QA_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Validate the exact paired request before checkout
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TheAngryPit/openclaw
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$INPUT_PROOF_KIND" = codex-catalog-paired
          test "$INPUT_CANDIDATE_SHA" = d58f658547ef92b124b6bf6f467379620de224b3

      - name: Checkout immutable source without persistent credentials
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: ${{ matrix.revision }}
          persist-credentials: false

      - name: Verify source and initialize external evidence
        id: initialize
        env:
          QA_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          qa_root="$RUNNER_TEMP/pr130115-paired-native/$QA_LABEL"
          mkdir -p "$qa_root"
          printf 'PR130115_QA_ROOT=%s\n' "$qa_root" >> "$GITHUB_ENV"
          {
            printf 'expected_revision=%s\nactual_revision=' "$QA_REVISION"
            git rev-parse HEAD
            printf 'workflow_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$QA_WORKFLOW_SHA" "$QA_RUN_ID" "$QA_RUN_ATTEMPT"
          } > "$qa_root/source.txt"
          git status --porcelain --untracked-files=all > "$qa_root/status-before.txt"
          test "$(git rev-parse HEAD)" = "$QA_REVISION"
          test ! -s "$qa_root/status-before.txt"
          test "$QA_RUNNER_ENVIRONMENT" = github-hosted
          shasum -a 256 package.json pnpm-lock.yaml apps/macos/Package.swift apps/macos/Package.resolved \
            scripts/test-macos-native.mts scripts/lib/swift-toolchain.sh .github/workflows/ci.yml \
            apps/macos/Sources/OpenClawDiscovery/TailscaleServeGatewayDiscovery.swift \
            apps/macos/Tests/OpenClawIPCTests/TailscaleServeGatewayDiscoveryTests.swift \
            apps/macos/Tests/OpenClawIPCTests/DashboardHTTPFixture.swift \
            apps/macos/Sources/OpenClaw/NodeMode/MacNodeModeCoordinator.swift \
            apps/macos/Tests/OpenClawIPCTests/MacNodeHostWorkerTests.swift > "$qa_root/source-sha256.txt"
          find -H /tmp -maxdepth 1 -type d -name 'oc-test-*' -print | LC_ALL=C sort > "$qa_root/native-resources-before.txt"

      - name: Setup the original CI Node version
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"

      - name: Select and record the authorized hosted toolchain
        id: toolchain
        env:
          QA_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          {
            sw_vers
            xcodebuild -version
            swift --version
            node --version
            printf 'logical_cpus='
            sysctl -n hw.logicalcpu
            printf 'memory_bytes='
            sysctl -n hw.memsize
            printf 'architecture=%s\nrunner_environment=%s\n' "$RUNNER_ARCH" "$QA_RUNNER_ENVIRONMENT"
          } > "$PR130115_QA_ROOT/toolchain.txt"
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          test "$(node --version)" = v24.21.0
          test "$(sysctl -n hw.logicalcpu)" -le 4
          cat "$PR130115_QA_ROOT/toolchain.txt"

      - name: Install the frozen renderer dependencies used by original CI
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node -p "require('./package.json').packageManager")"
          printf '%s\n' "$package_manager" > "$PR130115_QA_ROOT/package-manager.txt"
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          corepack enable
          corepack prepare "$package_manager" --activate
          pnpm --version >> "$PR130115_QA_ROOT/package-manager.txt"
          pnpm install --frozen-lockfile --prefer-offline --optional \
            --filter '@openclaw/mermaid-renderer...' \
            --config.ignore-scripts=false --config.engine-strict=false \
            --config.enable-pre-post-scripts=true --config.side-effects-cache=true \
            > "$PR130115_QA_ROOT/dependencies.log" 2>&1

      - name: Prepare exact-source Apple assets
        id: assets
        shell: bash
        run: node scripts/prepare-apple-mermaid.mjs > "$PR130115_QA_ROOT/assets.log" 2>&1

      - name: Build the original native tests once
        id: build
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'swift build --package-path apps/macos --build-system native --enable-code-coverage --disable-index-store -Xswiftc -gline-tables-only --build-tests' > "$PR130115_QA_ROOT/build-command.txt"
          swift build --package-path apps/macos --build-system native --enable-code-coverage \
            --disable-index-store -Xswiftc -gline-tables-only --build-tests \
            > "$PR130115_QA_ROOT/build.log" 2>&1

      - name: Capture the built test inventory
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          swift test list --package-path apps/macos --build-system native --enable-code-coverage \
            --disable-index-store -Xswiftc -gline-tables-only --skip-build \
            > "$PR130115_QA_ROOT/test-inventory.txt" 2> "$PR130115_QA_ROOT/test-inventory-stderr.txt"
          shasum -a 256 "$PR130115_QA_ROOT/test-inventory.txt" > "$PR130115_QA_ROOT/test-inventory.sha256"

      - name: Run the unchanged original default shard once
        id: native
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'node scripts/test-macos-native.mts default --package-path apps/macos --build-system native --enable-code-coverage --disable-index-store -Xswiftc -gline-tables-only --skip-build --experimental-maximum-parallelization-width 3 --skip "AppStateIsolationTests|ProfileChatPreferencesTests|QuickChatCatalogPresentationTests"' > "$PR130115_QA_ROOT/test-command.txt"
          exit_code=0
          node scripts/test-macos-native.mts default --package-path apps/macos --build-system native \
            --enable-code-coverage --disable-index-store -Xswiftc -gline-tables-only --skip-build \
            --experimental-maximum-parallelization-width 3 \
            --skip 'AppStateIsolationTests|ProfileChatPreferencesTests|QuickChatCatalogPresentationTests' \
            > "$PR130115_QA_ROOT/default.log" 2>&1 || exit_code=$?
          printf 'native_exit=%s\n' "$exit_code" > "$PR130115_QA_ROOT/native-exit.txt"
          tail -c 8192 "$PR130115_QA_ROOT/default.log"
          exit "$exit_code"

      - name: Record all outcomes, pristine source, counts, and launcher cleanup
        id: receipt
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          ASSETS_OUTCOME: ${{ steps.assets.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
