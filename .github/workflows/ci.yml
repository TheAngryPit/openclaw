          shasum -a 256 qa/maccli-real-distribution-qa-20261005/prepare.mjs apps/macos/Tests/OpenClawIPCTests/CLIInstallerRealDistributionProofTests.swift > "$qa_root/harness-digests.txt"
      - name: Install the declared package manager and frozen source dependencies
        working-directory: product
        shell: bash
