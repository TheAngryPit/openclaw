name: "PR #164825 stable-to-candidate profile upgrade QA"

on:
  workflow_dispatch:
    inputs:
      pr164825_stable_upgrade_qa:
        description: "Run the isolated secretless PR #164825 stable-to-candidate profile upgrade proof."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pr164825-stable-upgrade-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr164825-stable-upgrade-qa:
    name: Stable-to-candidate profile upgrade QA
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'TheAngryPit/openclaw' && github.ref == 'refs/heads/qa/pr164825-stable-upgrade-20261027' && inputs.pr164825_stable_upgrade_qa == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      PRODUCT_COMMIT: 24d1e9cf95bdbf8f1238435f27baa014b1374f99
    steps:
      - name: Checkout clean product snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: 24d1e9cf95bdbf8f1238435f27baa014b1374f99
          persist-credentials: false

      - name: Verify pinned product checkout
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$PRODUCT_COMMIT"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'Product source: %s\n' "$actual"
          printf '| Product source | %s |\n' "$actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare pinned product toolchain and dependencies
        uses: ./.github/actions/setup-node-env
        timeout-minutes: 15
        with:
          install-bun: "true"
          install-deps: "true"
          frozen-lockfile: "true"
          cache-mode: "off"

      - name: Resolve published stable driver once
        id: published_stable
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { classifyReleaseTrain, parseReleaseVersion } from "./scripts/lib/release-version.mjs";

          const version = JSON.parse(
            execFileSync("npm", ["view", "openclaw@latest", "version", "--json"], { encoding: "utf8" }),
          );
          const parsed = parseReleaseVersion(version);
          if (!parsed || classifyReleaseTrain(parsed) !== "stable") {
            throw new Error("npm latest must resolve to a stable OpenClaw version");
          }
          const lineEnd = String.fromCharCode(10);
          appendFileSync(process.env.GITHUB_OUTPUT, "version=" + version + lineEnd);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, "| Published stable baseline | " + version + " |" + lineEnd);
          NODE

      - name: Build the pinned product snapshot
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build:ci-artifacts

      - name: Package candidate and verify its source identity
        id: product_candidate
        timeout-minutes: 5
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$PRODUCT_COMMIT"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error title=Product source changed::The pinned product working tree changed during setup or build."
            git status --short
            exit 1
          fi
          package_dir=.artifacts/pr164825-stable-upgrade-product
          package="$package_dir/openclaw-candidate.tgz"
          node scripts/package-openclaw-for-docker.mjs --skip-build --allow-unreleased-changelog --output-dir "$package_dir" --output-name openclaw-candidate.tgz
          PRODUCT_COMMIT="$PRODUCT_COMMIT" PACKAGE_TGZ="$package" node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync, readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";

          const expectedCommit = process.env.PRODUCT_COMMIT;
          const packagePath = process.env.PACKAGE_TGZ;
          assert.equal(execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim(), expectedCommit);
          const build = JSON.parse(
            execFileSync("tar", ["-xOf", packagePath, "package/dist/build-info.json"], { encoding: "utf8" }),
          );
          const sourcePackage = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(build.commit, expectedCommit, "Packed build provenance does not match the pinned product commit");
          assert.equal(build.version, sourcePackage.version, "Packed version does not match the pinned product source");
          assert.equal(typeof build.buildId, "string");
          assert.notEqual(build.buildId.trim(), "");
          const sha256 = execFileSync("sha256sum", [packagePath], { encoding: "utf8" }).trim().split(" ")[0];
          assert.match(sha256, /^[0-9a-f]{64}$/u);
          const lineEnd = String.fromCharCode(10);
          appendFileSync(process.env.GITHUB_OUTPUT, "sha256=" + sha256 + lineEnd);
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "| Candidate package commit | " + build.commit + " |",
              "| Candidate build ID | " + build.buildId + " |",
              "| Candidate package SHA-256 | " + sha256 + " |",
            ].join(lineEnd) + lineEnd,
          );
          NODE

      - name: Verify mounted onboarding name reconciliation on the pinned product
        timeout-minutes: 5
        run: pnpm --dir ui test -- src/pages/custodian/custodian-page.test.ts -t 'preserves a newer same-profile (name|clear) when the onboarding save settles' --reporter=verbose

      - name: Checkout immutable QA harness revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          path: qa-source
          persist-credentials: false

      - name: Verify immutable QA harness checkout
        run: |
          set -euo pipefail
          actual="$(git -C qa-source rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          test -z "$(git -C qa-source status --porcelain --untracked-files=all)"
          printf 'QA harness source: %s\n' "$actual"
          printf '| QA harness source | %s |\n' "$actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Start 1125-second profile-upgrade cell budget
        run: echo "CELL_DEADLINE_EPOCH_SECONDS=$(( $(date +%s) + 1125 ))" >> "$GITHUB_ENV"

      - name: Run latest-stable to exact-candidate profile upgrade
        id: profile_upgrade
        timeout-minutes: 20
        working-directory: qa-source
        env:
          DRIVER_VERSION: ${{ steps.published_stable.outputs.version }}
          CANDIDATE_SHA256: ${{ steps.product_candidate.outputs.sha256 }}
          OPENCLAW_PUBLISHED_DRIVER_PROFILE_UPGRADE: "1"
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/.artifacts/pr164825-stable-upgrade-product/openclaw-candidate.tgz"
          artifacts="$GITHUB_WORKSPACE/qa-source/.artifacts/pr164825-stable-upgrade-qa"
          actual_sha256="$(sha256sum "$package" | cut -d ' ' -f 1)"
          if [ "$actual_sha256" != "$CANDIDATE_SHA256" ]; then
            echo "::error title=Candidate checksum mismatch::The profile-upgrade harness received different package bytes."
            exit 1
          fi
          mkdir -p "$artifacts"
          remaining=$((CELL_DEADLINE_EPOCH_SECONDS - $(date +%s)))
          if [ "$remaining" -le 0 ]; then
            echo "::error title=Profile-upgrade cell timed out::Candidate preparation exhausted the cell budget."
            echo "Profile-upgrade cell failed: candidate preparation exhausted the cell budget." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cell_exit=0
          timeout --signal=TERM --kill-after 15s "${remaining}s" bash scripts/e2e/published-driver-update-docker.sh "$package" "$artifacts" "$DRIVER_VERSION" || cell_exit=$?
          if [ "$cell_exit" -eq 124 ] || [ "$cell_exit" -eq 137 ]; then
            phase="$(cat "$artifacts/phase.txt" 2>/dev/null || printf 'prepare-container')"
            reason="Profile-upgrade cell timed out or was killed during ${phase} (exit ${cell_exit})."
            echo "::error title=Profile-upgrade cell stopped::${reason}"
            printf '%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit "$cell_exit"

      - name: Create sanitized synthetic QA receipts
        if: always()
        timeout-minutes: 2
        env:
          ARTIFACT_DIR: qa-source/.artifacts/pr164825-stable-upgrade-qa
          QA_COMMIT: ${{ github.sha }}
          PRODUCT_COMMIT: ${{ env.PRODUCT_COMMIT }}
          PRODUCT_PACKAGE_SHA256: ${{ steps.product_candidate.outputs.sha256 }}
          STABLE_VERSION: ${{ steps.published_stable.outputs.version }}
          PROFILE_UPGRADE_RESULT: ${{ steps.profile_upgrade.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/evidence"
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";

          const root = process.env.ARTIFACT_DIR;
          const readJson = (name) => {
            try {
              return JSON.parse(readFileSync(path.join(root, name), "utf8"));
            } catch {
              return undefined;
            }
          };
          const readCommandOutput = (name) => {
            try {
              const output = readFileSync(path.join(root, `${name}.stdout`), "utf8");
              const start = output.indexOf("{");
              return start < 0 ? undefined : JSON.parse(output.slice(start));
            } catch {
              return undefined;
            }
          };
          const sanitizedUiStderr = (name) => {
            try {
              const syntheticToken = "published-driver-synthetic-token";
              const encodedToken = encodeURIComponent(syntheticToken);
              const tokenAssignments = [
                `token=${syntheticToken}`,
                `token=${encodedToken}`,
                encodeURIComponent(`token=${syntheticToken}`),
                encodeURIComponent(`token=${encodedToken}`),
              ];
              let diagnostic = readFileSync(path.join(root, name), "utf8");
              for (const value of new Set([syntheticToken, encodedToken, ...tokenAssignments])) {
                diagnostic = diagnostic.replaceAll(value, "[redacted]");
              }
              diagnostic = diagnostic
                .replace(/([?#&]token=)[^&#\s"'<>]*/giu, "$1[redacted]")
                .replace(/token%3D[^&#\s"'<>]*/giu, "token%3D[redacted]");
              return diagnostic;
            } catch {
              return undefined;
            }
          };
          const text = (name) => {
            try {
              const value = readFileSync(path.join(root, name), "utf8").trim();
              return /^[a-z0-9-]+$/u.test(value) ? value : undefined;
            } catch {
              return undefined;
            }
          };
          const build = (value) =>
            value
              ? { version: value.version, commit: value.commit, buildId: value.buildId }
              : undefined;
          const settings = (value) =>
            value
              ? {
                  gateway: value.gateway,
                  pluginsEnabled: value.pluginsEnabled,
                  agentOwnership: value.agentOwnership,
                  heartbeatEvery: value.heartbeatEvery,
                  workspaces: value.workspaces,
                }
              : undefined;
          const profile = (value) =>
            value
              ? {
                  profileId: value.profileId,
                  displayName: value.displayName,
                  stableDisplayName: value.stableDisplayName,
                  candidateDisplayName: value.candidateDisplayName,
                  profileCount: value.profileCount,
                  candidateBuildId: value.candidateBuildId,
                  actions: value.actions,
                }
              : undefined;
          const inputs = readJson("inputs.json");
          const baseline = readJson("baseline-serving-identity.json");
          const beforeSettings = settings(readJson("settings-before-update.json"));
          const afterSettings = settings(readJson("settings-after-update.json"));
          const update = readCommandOutput("update");
          const recorded = readCommandOutput("recorded-run")?.lastRun;
          const summary = readJson("summary.json");
          const stableProfile = profile(readJson("stable-profile.json"));
          const migratedProfile = profile(readJson("candidate-profile-preserved.json"));
          const completedProfile = profile(readJson("candidate-profile-after-ui.json"));
          const commandSummaries = readdirSync(root)
            .filter((name) => /^[a-z0-9-]+-exit\.json$/u.test(name))
            .sort()
            .flatMap((name) => {
              const value = readJson(name);
              return value
                ? [
                    {
                      command: name.slice(0, -"-exit.json".length),
                      exitCode: value.exitCode,
                      status: value.status,
                      signal: value.signal,
                      receivedSignal: value.receivedSignal,
                      durationMs: value.durationMs,
                      processTreeState: value.processTreeState,
                      code: value.code,
                    },
                  ]
                : [];
            });
          const proof = {
            schemaVersion: 1,
            workflow: {
              repository: process.env.GITHUB_REPOSITORY,
              runId: process.env.RUN_ID,
              runAttempt: process.env.RUN_ATTEMPT,
              qaCommit: process.env.QA_COMMIT,
              result: process.env.PROFILE_UPGRADE_RESULT,
              lastPhase: text("phase.txt"),
            },
            product: {
              commit: process.env.PRODUCT_COMMIT,
              packageSha256: process.env.PRODUCT_PACKAGE_SHA256,
              candidate: build(summary?.candidate ?? inputs?.candidate),
            },
            baseline: {
              version: process.env.STABLE_VERSION,
              installed: build(baseline?.installed ?? inputs?.driverBuild),
              serving: build(baseline?.serving),
              verification: baseline?.verification,
            },
            nativeUpdate: {
              updateStatus: update?.status,
              resultBeforeVersion: update?.before?.version,
              resultAfterVersion: update?.after?.version,
              runId: update?.run?.runId ?? summary?.runId,
              runPhase: update?.run?.phase ?? summary?.phase,
              runStatus: update?.run?.status ?? recorded?.status,
              recordedRunId: recorded?.runId,
              recordedRunPhase: recorded?.phase,
              recordedRunStatus: recorded?.status,
              successful: summary?.phase === "finished" && summary?.readyz === 200,
            },
            profile: {
              stable: stableProfile,
              preservedAfterUpdate: migratedProfile,
              afterOnboarding: completedProfile,
              clearSkipSaveRevisitFlowCompleted: Boolean(
                completedProfile?.profileId &&
                  completedProfile.profileId === migratedProfile?.profileId &&
                  completedProfile.candidateDisplayName === "Candidate Onboarding Survivor" &&
                  JSON.stringify(completedProfile.actions) ===
                    JSON.stringify([
                      "candidate-ui-observed-stable-profile",
                      "visible-profile-clear-after-preservation-check",
                      "onboarding-skip",
                      "onboarding-revisit",
                      "onboarding-save",
                      "named-onboarding-revisit",
                    ]),
              ),
            },
            settings: {
              before: beforeSettings,
              after: afterSettings,
              preserved: Boolean(
                beforeSettings &&
                  afterSettings &&
                  JSON.stringify(beforeSettings) === JSON.stringify(afterSettings),
              ),
            },
            uiDiagnostics: {
              stableProfileUiStderr: sanitizedUiStderr("stable-profile-ui.stderr"),
              candidateProfileUiStderr: sanitizedUiStderr("candidate-profile-ui.stderr"),
            },
            commandSummaries,
          };
          writeFileSync(path.join(root, "evidence", "upgrade-proof.json"), `${JSON.stringify(proof, null, 2)}\n`);
          NODE

      - name: Preserve sanitized profile-upgrade evidence and screenshots
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr164825-profile-upgrade-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa-source/.artifacts/pr164825-stable-upgrade-qa/evidence/upgrade-proof.json
            qa-source/.artifacts/pr164825-stable-upgrade-qa/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Record profile-upgrade outcome
        if: always()
        env:
          PROFILE_UPGRADE_RESULT: ${{ steps.profile_upgrade.outcome }}
          STABLE_VERSION: ${{ steps.published_stable.outputs.version }}
          CANDIDATE_SHA256: ${{ steps.product_candidate.outputs.sha256 }}
        run: |
          {
            printf '| Profile-upgrade result | %s |\n' "$PROFILE_UPGRADE_RESULT"
            printf '| Published stable baseline | %s |\n' "$STABLE_VERSION"
            printf '| Candidate package SHA-256 | %s |\n' "$CANDIDATE_SHA256"
            printf '\nThe artifact includes a sanitized synthetic receipt and screenshots. Browser state remains in the disposable Docker runtime volume and is not uploaded.\n'
          } >> "$GITHUB_STEP_SUMMARY"
