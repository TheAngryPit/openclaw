name: PR130115 frozen catalog capability native proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog-controls:
    if: github.repository == 'TheAngryPit/openclaw' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qa/pr130115-capability-native-20261014'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      CI: "true"
      CANDIDATE_SHA: c6ceb5b726b1f5a5935ad6ddff9bb677089807d6
      BASE_SHA: a1f0422b670f9149000ef66f439f76b26e9aa11a
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify immutable source and hosted toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr130115-catalog-native"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$GITHUB_REF" = refs/heads/qa/pr130115-capability-native-20261014
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = 91697e13c82017546a92ddc5dbfd70709f3e1b81
          test "$(git show -s --format=%P HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = $'apps/macos/Sources/OpenClaw/NodeMode/MacNodeModeCoordinator.swift\napps/macos/Tests/OpenClawIPCTests/MacNodeHostWorkerTests.swift'
          test "$(git rev-parse HEAD:apps/macos/Sources/OpenClaw/NodeMode/MacNodeModeCoordinator.swift)" = 5b615913a6c3d93b2a5f30c6f3846ce1680045d8
          test "$(git rev-parse HEAD:apps/macos/Tests/OpenClawIPCTests/MacNodeHostWorkerTests.swift)" = e675402092ac9bf7fd5d41ccbad7a3593527f88e
          source scripts/lib/swift-toolchain.sh
          require_swift_toolchain
          {
            git rev-parse HEAD HEAD^{tree}
            printf 'workflow_sha=%s\nworkflow_ref=%s\nqa_sha=%s\nqa_ref=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_WORKFLOW_SHA" "$GITHUB_WORKFLOW_REF" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            sw_vers
            xcodebuild -version
            swift --version
          } > "$RUNNER_TEMP/pr130115-catalog-native/provenance.txt"
          shasum -a 256 package.json pnpm-lock.yaml apps/macos/Package.swift apps/macos/Package.resolved \
            scripts/test-macos-native.mts scripts/lib/swift-toolchain.sh scripts/lib/managed-child-process.mts \
            scripts/lib/failed-trailer.mts scripts/prepare-apple-mermaid.mjs \
            apps/macos/Sources/OpenClaw/NodeMode/MacNodeModeCoordinator.swift \
            apps/macos/Sources/OpenClaw/NodeMode/MacNodeSessionCatalogContract.swift \
            apps/macos/Tests/OpenClawIPCTests/MacNodeHostWorkerTests.swift \
            apps/macos/Tests/OpenClawIPCTests/MacNodeModeCoordinatorTests.swift > "$RUNNER_TEMP/pr130115-catalog-native/source-sha256.txt"
          find -H /tmp -maxdepth 1 -type d -name 'oc-test-*' -print | LC_ALL=C sort > "$RUNNER_TEMP/pr130115-catalog-native/resources-before.txt"
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          cache-mode: "off"
          install-bun: "false"
          install-deps: "false"
      - name: Prepare existing native dependencies and assets
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline --optional \
            --filter openclaw --filter '@openclaw/mermaid-renderer...' --filter '@openclaw/gateway-protocol...' \
            --config.ignore-scripts=false --config.engine-strict=false \
            --config.enable-pre-post-scripts=true --config.side-effects-cache=true
          node --input-type=module -e 'await import("@openclaw/fs-safe/root")'
          node scripts/prepare-apple-mermaid.mjs
          node scripts/check-native-state-schema-version.mjs
      - name: Build tests and require exactly three existing controls
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          native_args=(--package-path apps/macos --build-system native --enable-code-coverage --disable-index-store -Xswiftc -gline-tables-only)
          filter='MacNodeHostWorkerTests/.*local worker manifest omits session catalogs|MacNodeModeCoordinatorTests/.*local mode omits native session catalogs|MacNodeModeCoordinatorTests/.*remote mode advertises native session catalogs'
          run_apple_command_logged "$RUNNER_TEMP/pr130115-catalog-native/build.log" swift build "${native_args[@]}" --build-tests
          swift test list "${native_args[@]}" --skip-build > "$RUNNER_TEMP/pr130115-catalog-native/inventory.txt" 2> "$RUNNER_TEMP/pr130115-catalog-native/inventory-stderr.txt"
          grep -E "$filter" "$RUNNER_TEMP/pr130115-catalog-native/inventory.txt" > "$RUNNER_TEMP/pr130115-catalog-native/selected.txt"
          test "$(sort -u "$RUNNER_TEMP/pr130115-catalog-native/selected.txt" | wc -l | tr -d ' ')" = 3
          while IFS= read -r name; do
            test "$(grep -F -c "$name" "$RUNNER_TEMP/pr130115-catalog-native/selected.txt")" = 1
          done <<'CONTROLS'
          local worker manifest omits session catalogs
          local mode omits native session catalogs
          remote mode advertises native session catalogs
          CONTROLS
          run_apple_command_logged "$RUNNER_TEMP/pr130115-catalog-native/tests.log" \
            node scripts/test-macos-native.mts default "${native_args[@]}" \
            --skip-build --experimental-maximum-parallelization-width 3 --filter "$filter"
          log="$RUNNER_TEMP/pr130115-catalog-native/tests.log"
          if grep -Ei '(Test|Suite).* skipped|[1-9][0-9]* tests? skipped' "$log"; then exit 1; fi
          grep -E 'Test run with 3 tests?( in [1-9][0-9]* suites?)? passed' "$log"
          test "$(grep -E 'Test .* passed after' "$log" | grep -v 'Test run with' | wc -l | tr -d ' ')" = 3
          while IFS= read -r name; do
            grep -F "$name" "$log" | grep -E 'passed after'
          done <<'CONTROLS'
          local worker manifest omits session catalogs
          local mode omits native session catalogs
          remote mode advertises native session catalogs
          CONTROLS
      - name: Retain final identity, source state and launcher cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr130115-catalog-native"
          mkdir -p "$root"
          final_sha="$(git rev-parse HEAD)"
          printf 'final_source_sha=%s\n' "$final_sha" >> "$root/provenance.txt"
          git status --porcelain=v1 --untracked-files=all > "$root/source-after.txt"
          find -H /tmp -maxdepth 1 -type d -name 'oc-test-*' -print | LC_ALL=C sort > "$root/resources-after.txt"
          test -f "$root/resources-before.txt"
          comm -13 "$root/resources-before.txt" "$root/resources-after.txt" > "$root/resources-retained.txt"
          test "$final_sha" = "$CANDIDATE_SHA"
          test ! -s "$root/source-after.txt"
          test ! -s "$root/resources-retained.txt"
          shasum -a 256 --check "$root/source-sha256.txt" > "$root/source-check-after.txt"
      - name: Retain synthetic native receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr130115-catalog-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr130115-catalog-native
          if-no-files-found: error
          retention-days: 14
