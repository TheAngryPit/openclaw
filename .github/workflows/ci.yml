name: PR164825 secretless onboarding proof
run-name: PR164825 proof ${{ inputs.candidate_sha }}
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed PR164825 product commit
        required: true
        default: 626ef205e8a10e8fde43268835fab9db95a0c81b
        type: string
permissions:
  contents: read
concurrency:
  group: pr164825-secretless-${{ inputs.candidate_sha }}
  cancel-in-progress: false
jobs:
  onboarding-proof:
    if: github.repository == 'TheAngryPit/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        side: [baseline, candidate]
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      BASELINE_SHA: bcd41d1aae8d60336fbf5466f22eb665ee353e4f
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      COMPARISON_SIDE: ${{ matrix.side }}
      OPENCLAW_CAPTURE_UI_PROOF: "1"
      OPENCLAW_BUILD_PRIVATE_QA: "1"
      OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
    steps:
      - name: Validate immutable selection
        shell: bash
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = 626ef205e8a10e8fde43268835fab9db95a0c81b
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          if test "$COMPARISON_SIDE" = baseline; then
            printf 'PRODUCT_SHA=%s\n' "$BASELINE_SHA" >> "$GITHUB_ENV"
          else
            test "$COMPARISON_SIDE" = candidate
            printf 'PRODUCT_SHA=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_ENV"
          fi
      - name: Checkout separately owned QA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: ${{ github.workflow_sha }}
          path: qa
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout exact product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          persist-credentials: false
      - name: Verify source identity and receipt owner
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C ../qa rev-parse HEAD)" = "$WORKFLOW_SHA"
          test "$(git -C ../qa rev-parse HEAD^1)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          proof="$RUNNER_TEMP/pr164825-proof-$COMPARISON_SIDE"
          mkdir "$proof"
          printf 'OPENCLAW_UI_E2E_ARTIFACT_DIR=%s\n' "$proof" >> "$GITHUB_ENV"
          printf 'OPENCLAW_ONBOARDING_COMPARISON_SIDE=%s\n' "$COMPARISON_SIDE" >> "$GITHUB_ENV"
          printf 'product_sha=%s\nworkflow_sha=%s\nside=%s\ninstalled_upgrade=not_proven\n' "$PRODUCT_SHA" "$WORKFLOW_SHA" "$COMPARISON_SIDE" > "$proof/receipt.txt"
      - name: Setup supported pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install exact source tooling in disposable runner
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json","utf8")); if(p.packageManager.split("+")[0] !== "pnpm@12.9.0") throw new Error("Unexpected package manager");'
          npm install --global pnpm@12.9.0
          test "$(pnpm --version)" = 12.9.0
          pnpm install --frozen-lockfile
          node --import ./scripts/tsx.mjs scripts/ensure-playwright-chromium.mts --require-playwright-chromium
          printf 'node=%s\npnpm=%s\n' "$(node --version)" "$(pnpm --version)" >> "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"
      - name: Build unchanged exact product
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          sha256sum dist/entry.js dist/control-ui/index.html dist/control-ui/asset-manifest.json dist/build-info.json > "$OPENCLAW_UI_E2E_ARTIFACT_DIR/build-digests.txt"
      - name: Qualify candidate owning tests types and source-backed lint
        if: matrix.side == 'candidate'
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-changed.mjs --dry-run -- ui/src/pages/custodian/custodian-page.tsx ui/src/pages/custodian/custodian-page.test.ts ui/src/e2e/profile-page.real-gateway.e2e.test.ts src/state/user-profiles.test.ts src/gateway/server-methods/users.test.ts
          pnpm tsgo:ui
          node scripts/run-tsgo-core-test-shards.mjs --changed-paths-json '["ui/src/pages/custodian/custodian-page.test.ts","ui/src/e2e/profile-page.real-gateway.e2e.test.ts","ui/src/e2e/custodian-onboarding-locale.e2e.test.ts","src/state/user-profiles.test.ts","src/gateway/server-methods/users.test.ts"]'
          node scripts/run-oxlint.mjs --tsconfig tsconfig.ui.json ui/src/pages/custodian/custodian-page.tsx ui/src/pages/custodian/custodian-page.test.ts ui/src/pages/custodian/custodian-page.test-harness.ts ui/src/e2e/profile-page.real-gateway.e2e.test.ts ui/src/e2e/custodian-onboarding-locale.e2e.test.ts
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/state/user-profile-writes.ts src/state/user-profile-writes.worker.ts src/state/user-profiles.worker.ts src/state/user-profiles.test.ts src/gateway/server-methods/users.ts src/gateway/server-methods/users.test.ts
          node --import ./scripts/tsx.mjs scripts/run-stylelint.mts ui/src/styles/custodian.css ui/src/pages/custodian/custodian-page.tsx
          pnpm ui:i18n:verify
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui.config.ts --configLoader runner ui/src/pages/custodian/custodian-page.test.ts ui/src/pages/custodian/custodian-page-agent-create.test.ts --maxWorkers=1
          node scripts/run-vitest.mjs run src/state/user-profiles.test.ts src/gateway/server-methods/users.test.ts --maxWorkers=1
          printf 'owning_tests_types_lint=passed\n' >> "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"
      - name: Qualify unmodified candidate browser contracts
        if: matrix.side == 'candidate'
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e-prebuilt.config.ts --configLoader runner ui/src/e2e/profile-page.real-gateway.e2e.test.ts --maxWorkers=1
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e.config.ts --configLoader runner ui/src/e2e/custodian-onboarding-locale.e2e.test.ts --maxWorkers=1
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'canonical_browser_contracts=passed\n' >> "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"
      - name: Stage only separately hashed capture fixture
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          fixture=ui/src/e2e/onboarding-profile.capture.real-gateway.e2e.test.ts
          config=.artifacts/pr164825-secretless-qa-20261012/vitest.onboarding-proof.config.ts
          test ! -e "$fixture"
          test ! -e "$config"
          test -z "$(git ls-files -- "$fixture" "$config")"
          mkdir -p "$(dirname "$config")"
          cp ../qa/artifacts/pr164825-secretless-qa-20261012/onboarding-profile.capture.real-gateway.e2e.test.ts "$fixture"
          cp ../qa/artifacts/pr164825-secretless-qa-20261012/vitest.onboarding-proof.config.ts "$config"
          cmp "$fixture" ../qa/artifacts/pr164825-secretless-qa-20261012/onboarding-profile.capture.real-gateway.e2e.test.ts
          cmp "$config" ../qa/artifacts/pr164825-secretless-qa-20261012/vitest.onboarding-proof.config.ts
          sha256sum "$fixture" "$config" > "$OPENCLAW_UI_E2E_ARTIFACT_DIR/qa-digests.txt"
          test "$(git status --porcelain=v1 --untracked-files=all)" = "?? $fixture"
      - name: Exercise matched synthetic capture and candidate naming
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run --config .artifacts/pr164825-secretless-qa-20261012/vitest.onboarding-proof.config.ts --configLoader runner --reporter verbose --maxWorkers=1
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git status --porcelain=v1 --untracked-files=all)" = "?? ui/src/e2e/onboarding-profile.capture.real-gateway.e2e.test.ts"
          sha256sum --check "$OPENCLAW_UI_E2E_ARTIFACT_DIR/build-digests.txt"
          sha256sum --check "$OPENCLAW_UI_E2E_ARTIFACT_DIR/qa-digests.txt"
          test "$(find "$OPENCLAW_UI_E2E_ARTIFACT_DIR" -name "*-1280-onboarding.png" | wc -l)" = 1
          test "$(find "$OPENCLAW_UI_E2E_ARTIFACT_DIR" -name "*-390-onboarding.png" | wc -l)" = 1
          test "$(find "$OPENCLAW_UI_E2E_ARTIFACT_DIR" -name cleanup.json | wc -l)" = 1
          if test "$COMPARISON_SIDE" = candidate; then
            test "$(find "$OPENCLAW_UI_E2E_ARTIFACT_DIR" -name behavior.json | wc -l)" = 1
            test "$(find "$OPENCLAW_UI_E2E_ARTIFACT_DIR" -name '04-persisted-profile-mobile.png' | wc -l)" = 1
            test "$(find "$OPENCLAW_UI_E2E_ARTIFACT_DIR" -name '05-persisted-profile-desktop.png' | wc -l)" = 1
          fi
          printf 'matched_capture=passed\nsource_unchanged=true\n' >> "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"
      - name: Upload retained synthetic media and bounded receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr164825-${{ matrix.side }}-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/pr164825-proof-${{ matrix.side }}/**/*.png
            ${{ runner.temp }}/pr164825-proof-${{ matrix.side }}/**/cleanup.json
            ${{ runner.temp }}/pr164825-proof-${{ matrix.side }}/**/behavior.json
            ${{ runner.temp }}/pr164825-proof-${{ matrix.side }}/receipt.txt
            ${{ runner.temp }}/pr164825-proof-${{ matrix.side }}/build-digests.txt
            ${{ runner.temp }}/pr164825-proof-${{ matrix.side }}/qa-digests.txt
          if-no-files-found: error
          retention-days: 7
