name: CI
run-name: PR164607 current Solid Profile qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr164607-solid-proof-${{ github.sha }}
  cancel-in-progress: false

jobs:
  profile-proof:
    if: github.repository == 'TheAngryPit/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - variant: baseline
            product_sha: bcd41d1aae8d60336fbf5466f22eb665ee353e4f
          - variant: candidate
            product_sha: 64123ecc8813b534a01b7cc5b4b3f57744b2bba4
    defaults:
      run:
        shell: bash
        working-directory: product
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_VERSION: "24.21.0"
      OPENCLAW_CAPTURE_UI_PROOF: "1"
      OPENCLAW_PROFILE_QA_VARIANT: ${{ matrix.variant }}
      OPENCLAW_PROFILE_QA_PRODUCT_SHA: ${{ matrix.product_sha }}
      OPENCLAW_PROFILE_QA_HARNESS_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Checkout reviewed QA child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Checkout exact product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: ${{ matrix.product_sha }}
          path: product
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source and harness scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OPENCLAW_PROFILE_QA_PRODUCT_SHA"
          test "$(git -C .. rev-parse HEAD)" = "$OPENCLAW_PROFILE_QA_HARNESS_SHA"
          test "$(git -C .. rev-parse HEAD^1)" = 64123ecc8813b534a01b7cc5b4b3f57744b2bba4
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git -C .. diff --exit-code HEAD^1 HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)qa/pr164607-owner61-proof-20261012'
          test "$(git hash-object .github/actions/setup-node-env/action.yml)" = "$(git -C .. rev-parse HEAD:.github/actions/setup-node-env/action.yml)"
          test "$(git hash-object .github/actions/setup-pnpm-store-cache/action.yml)" = "$(git -C .. rev-parse HEAD:.github/actions/setup-pnpm-store-cache/action.yml)"
          printf 'OPENCLAW_UI_E2E_ARTIFACT_DIR=%s\nOPENCLAW_UI_E2E_DIAGNOSTIC_DIR=%s\n' "$RUNNER_TEMP/pr164607-$OPENCLAW_PROFILE_QA_VARIANT" "$RUNNER_TEMP/pr164607-$OPENCLAW_PROFILE_QA_VARIANT-diagnostics" >> "$GITHUB_ENV"
      - name: Select exact Node24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Setup source-owned Node and dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          cache-mode: "off"
          dependency-cache: "false"
          frozen-lockfile: "true"
      - name: Setup source-owned Chromium
        uses: ./.github/actions/setup-playwright-chromium
        with:
          cache-mode: "off"
      - name: Build current runtime and Control UI
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
        run: pnpm build
      - name: Qualify Profile owner and browser lifecycle
        run: bash "$GITHUB_WORKSPACE/qa/pr164607-owner61-proof-20261012/run-profile-proof.sh"
      - name: Retain actual public synthetic receipts and media
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr164607-solid-${{ matrix.variant }}-${{ matrix.product_sha }}
          path: |
            ${{ runner.temp }}/pr164607-${{ matrix.variant }}/**/*.png
            ${{ runner.temp }}/pr164607-${{ matrix.variant }}/**/*.json
            ${{ runner.temp }}/pr164607-${{ matrix.variant }}/*.txt
            ${{ runner.temp }}/pr164607-${{ matrix.variant }}-diagnostics/**/failure.public.json
          if-no-files-found: error
          retention-days: 7
