name: Temporary native identity proof
run-name: Identity proof ${{ inputs.proof_kind }} ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact published product commit to verify
        required: true
        type: string
      proof_kind:
        description: Existing Profile fixture, matched comparison, or exact-candidate repair proof
        required: true
        default: profile
        type: choice
        options:
          - profile
          - operator
          - profile-comparison
          - tailscale-paired
          - tailscale-current
          - onboarding-comparison
          - maccli-preflight
          - maccli-real
          - cloudflare-native
          - tailscale-native
          - codex-catalog-paired
          - codex-catalog-conflict-candidate
          - codex-catalog-mlx-diagnostic
          - tailscale-recovery
          - tailscale-runtime
          - tailscale-tracked-regression
      live_proof_mode:
        description: Real unauthenticated parking proof, or authorized test-tailnet recovery
        required: false
        default: parking
        type: choice
        options: [parking, full]
      operator_variant:
        description: Explicit provenance label for matched comparisons
        required: true
        default: candidate
        type: choice
        options:
          - baseline
          - candidate

permissions:
  contents: read

jobs:
  pr167880-tracked-regression:
    name: Tracked startup failure baseline and candidate regression
    if: ${{ github.repository == 'TheAngryPit/openclaw' && github.event_name == 'workflow_dispatch' && inputs.proof_kind == 'tailscale-tracked-regression' && inputs.candidate_sha == '59d29a7c1683dbb33f25e35c5196475e3a8b7b8d' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: pr167880-isolated-runtime
      cancel-in-progress: false
    steps:
      - name: Checkout frozen QA without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: tooling
      - name: Checkout exact public baseline without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: 59d29a7c1683dbb33f25e35c5196475e3a8b7b8d
          persist-credentials: false
          path: product
      - name: Verify runner and source then prove baseline red and candidate green
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$(git -C tooling rev-parse HEAD)" = "${{ github.workflow_sha }}"
          test "$(git -C product rev-parse HEAD)" = 59d29a7c1683dbb33f25e35c5196475e3a8b7b8d
          docker buildx build --file tooling/qa/pr167880-runtime-proof/Dockerfile \
            --build-context "product=$GITHUB_WORKSPACE/product" \
            --build-arg PRODUCT_SHA=59d29a7c1683dbb33f25e35c5196475e3a8b7b8d \
            --target tracked-startup-receipt --output "type=local,dest=$RUNNER_TEMP/pr167880-tracked-regression" \
            tooling/qa/pr167880-runtime-proof
          node -e 'const r=require(process.env.RUNNER_TEMP+"/pr167880-tracked-regression/tracked-startup-proof.json"); if(r.completed!==true || r.baselineExitOneInsteadOfZero!==true || r.candidatePassed!==true || r.candidateTestsPassed!==7) process.exit(1);'
      - name: Upload only the closed regression receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr167880-tracked-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr167880-tracked-regression/
          if-no-files-found: error
          retention-days: 7
  pr167880-runtime-proof:
    name: Installed Gateway and real Tailscale runtime proof
    if: ${{ github.repository == 'TheAngryPit/openclaw' && github.event_name == 'workflow_dispatch' && inputs.proof_kind == 'tailscale-runtime' && inputs.candidate_sha == '1bca324a01203b4509564b4c1b663c3516e80e55' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: pr167880-isolated-runtime
      cancel-in-progress: false
    env:
      QA_PRODUCT_SHA: 1bca324a01203b4509564b4c1b663c3516e80e55
      QA_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QA_PREFIX: pr167880-${{ github.run_id }}-${{ github.run_attempt }}
      QA_PROOF_MODE: ${{ inputs.live_proof_mode }}
      QA_TAILSCALE_VERSION: 1.104.1
      QA_TAILSCALE_SHA256: 108d1d96ecf410d305571e173516f27038f870919a9b89c914a167c6d33a4528
    steps:
      - name: Verify disposable standard hosted runner and exact request
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = TheAngryPit/openclaw
          test "$(ps -p 1 -o comm= | xargs)" = systemd
          test "${{ inputs.candidate_sha }}" = "$QA_PRODUCT_SHA"
          case "$QA_PROOF_MODE" in parking|full) ;; *) exit 2 ;; esac
          printf 'QA_ROOT=%s/pr167880-runtime-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          docker version --format '{{.Server.Version}}'
      - name: Admit full proof only with explicitly provided test inputs
        if: ${{ inputs.live_proof_mode == 'full' }}
        shell: bash
        env:
          TS_QA_AUTHKEY: ${{ secrets.TS_QA_AUTHKEY }}
          TS_QA_EXPECTED_DNS_SUFFIX: ${{ vars.TS_QA_EXPECTED_DNS_SUFFIX }}
          TS_QA_TAG: ${{ vars.TS_QA_TAG }}
        run: |
          set -euo pipefail
          test -n "$TS_QA_AUTHKEY"
          test -n "$TS_QA_EXPECTED_DNS_SUFFIX"
          test -n "$TS_QA_TAG"
          echo 'Explicit test-tailnet inputs present; values are not printed.'
      - name: Checkout immutable QA tooling without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: tooling
      - name: Checkout immutable public candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: 1bca324a01203b4509564b4c1b663c3516e80e55
          persist-credentials: false
          path: product
      - name: Verify source pins and obtain checksum-pinned real Tailscale
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C tooling rev-parse HEAD)" = "$QA_WORKFLOW_SHA"
          test "$(git -C product rev-parse HEAD)" = "$QA_PRODUCT_SHA"
          mkdir -p "$QA_ROOT/public" "$QA_ROOT/private/tailscale"
          archive="$QA_ROOT/private/tailscale.tgz"
          curl --fail --silent --show-error --location \
            "https://pkgs.tailscale.com/stable/tailscale_${QA_TAILSCALE_VERSION}_amd64.tgz" -o "$archive"
          printf '%s  %s\n' "$QA_TAILSCALE_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" --strip-components=1 -C "$QA_ROOT/private/tailscale"
          test -x "$QA_ROOT/private/tailscale/tailscale"
          test -x "$QA_ROOT/private/tailscale/tailscaled"
      - name: Build installable candidate and isolated runtime images without test credentials
        shell: bash
        run: |
          set -euo pipefail
          dockerfile="$GITHUB_WORKSPACE/tooling/qa/pr167880-runtime-proof/Dockerfile"
          common=(--file "$dockerfile" --build-context "product=$GITHUB_WORKSPACE/product" \
            --build-context "tailscale=$QA_ROOT/private/tailscale" --build-arg "PRODUCT_SHA=$QA_PRODUCT_SHA")
          docker buildx build "${common[@]}" --target gateway-runtime --load \
            --tag "$QA_PREFIX-gateway" tooling/qa/pr167880-runtime-proof
          docker buildx build "${common[@]}" --target tailscale-runtime --load \
            --tag "$QA_PREFIX-tailscale" tooling/qa/pr167880-runtime-proof
          gateway_image="$(docker image inspect "$QA_PREFIX-gateway" --format '{{.Id}}')"
          tailscale_image="$(docker image inspect "$QA_PREFIX-tailscale" --format '{{.Id}}')"
          printf 'QA_GATEWAY_IMAGE=%s\nQA_TAILSCALE_IMAGE=%s\n' "$gateway_image" "$tailscale_image" >> "$GITHUB_ENV"
      - name: Observe real NeedsLogin and listener-free supervised parking
        shell: bash
        run: node tooling/qa/pr167880-runtime-proof/runtime-proof.mjs parking
      - name: Authenticate only the disposable Tailscale sidecar
        if: ${{ inputs.live_proof_mode == 'full' }}
        shell: bash
        env:
          TS_QA_AUTHKEY: ${{ secrets.TS_QA_AUTHKEY }}
          TS_QA_TAG: ${{ vars.TS_QA_TAG }}
        run: |
          set -euo pipefail
          auth_dir="$QA_ROOT/private/auth"
          test -d "$auth_dir"
          python3 -I -S - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['QA_ROOT']) / 'private' / 'auth'
          target = root / 'key'
          descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w') as stream:
              stream.write(os.environ['TS_QA_AUTHKEY'])
          PY
          trap 'sudo rm -f -- "$auth_dir/key"' EXIT
          sudo chown 1000:1000 "$auth_dir/key"
          chmod 0711 "$auth_dir"
          docker exec --user 1000:1000 "$QA_PREFIX-tailscale" /usr/local/bin/tailscale up \
            --auth-key=file:/run/qa-auth/key --advertise-tags="$TS_QA_TAG" \
            --operator=node --hostname="$QA_PREFIX" --accept-dns=false --accept-routes=false \
            --ssh=false --timeout=90s > "$QA_ROOT/private/authentication.log" 2>&1
      - name: Verify real restoration, owned Serve claim and Gateway readiness
        if: ${{ inputs.live_proof_mode == 'full' }}
        shell: bash
        env:
          TS_QA_EXPECTED_DNS_SUFFIX: ${{ vars.TS_QA_EXPECTED_DNS_SUFFIX }}
          TS_QA_TAG: ${{ vars.TS_QA_TAG }}
        run: node tooling/qa/pr167880-runtime-proof/runtime-proof.mjs recovery
      - name: Verify joined graceful cancellation of a fresh real prerequisite wait
        shell: bash
        run: node tooling/qa/pr167880-runtime-proof/runtime-proof.mjs cancel
      - name: Cleanup only task-owned units, containers and test node
        if: always()
        shell: bash
        run: |
          if [ -f tooling/qa/pr167880-runtime-proof/runtime-proof.mjs ]; then
            node tooling/qa/pr167880-runtime-proof/runtime-proof.mjs cleanup
          fi
      - name: Produce fail-closed allowlisted operational receipts
        if: always()
        shell: bash
        run: |
          if [ -f tooling/qa/pr167880-runtime-proof/runtime-proof.mjs ]; then
            node tooling/qa/pr167880-runtime-proof/runtime-proof.mjs summarize
          fi
      - name: Upload only inspected receipt fields, never raw diagnostics or daemon state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr167880-runtime-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr167880-runtime-${{ github.run_id }}-${{ github.run_attempt }}/public/
          if-no-files-found: warn
          retention-days: 7
  pr167072-paired-recovery-qa:
    name: Tailscale prerequisite recovery paired proof
    if: ${{ github.repository == 'TheAngryPit/openclaw' && github.event_name == 'workflow_dispatch' && inputs.proof_kind == 'tailscale-recovery' && inputs.candidate_sha == 'e670b178f9dbdde25a074913d9c97fa9b8b533b6' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      QA_RUNNER: ubuntu-24.04
      QA_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QA_BASELINE_REPOSITORY: openclaw/openclaw
      QA_BASELINE_SHA: e670b178f9dbdde25a074913d9c97fa9b8b533b6
      QA_PRODUCT_DIR: qa-product
      QA_TEST_MANIFEST: artifacts/pr167072-recovery-qa-20261009/testcase-identities.json
      QA_OUTPUT_DIR: artifacts/pr167072-recovery-qa-20261009/run-output
      QA_NODE_VERSION: 24.19.0
      QA_PNPM_PACKAGE_MANAGER: pnpm@12.5.1+sha512.e3f305bc784a2bc89f5ad3b6138889470fae8d2af5f36b61216ec91c2c3d64089775f9de38aac331044ea40f245cb0d5666392dfdf65824e1907ef6a2c62de5f
    steps:
      - name: Verify public hosted runner boundary
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = TheAngryPit/openclaw
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
      - name: Checkout exact public QA workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Verify exact QA inputs before executing product code
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$QA_WORKFLOW_SHA"
          mkdir -p "$QA_OUTPUT_DIR"
          node "$GITHUB_WORKSPACE/artifacts/pr167072-recovery-qa-20261009/verify-testcase-identities.mjs"
      - name: Fetch immutable public canonical baseline without credentials
        shell: bash
        run: |
          mkdir -p "$QA_PRODUCT_DIR"
          git -C "$QA_PRODUCT_DIR" init
          git -C "$QA_PRODUCT_DIR" fetch --no-tags --depth=1 "https://github.com/$QA_BASELINE_REPOSITORY.git" "$QA_BASELINE_SHA"
          git -C "$QA_PRODUCT_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$QA_PRODUCT_DIR" rev-parse HEAD)" = "$QA_BASELINE_SHA"
      - name: Ensure canonical changed-check ripgrep dependency
        uses: ./qa-product/.github/actions/setup-ripgrep
      - name: Install one common frozen dependency lock
        working-directory: qa-product
        shell: bash
        run: |
          corepack enable
          corepack prepare "$QA_PNPM_PACKAGE_MANAGER" --activate
          test "v$QA_NODE_VERSION" = "$(node --version)"
          test "12.5.1" = "$(corepack pnpm --version)"
          corepack pnpm install --frozen-lockfile
      - name: Record observed toolchain
        working-directory: qa-product
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"),cp=require("node:child_process");const r={runner:process.env.QA_RUNNER,image:process.env.ImageOS,imageVersion:process.env.ImageVersion,node:process.version,pnpm:cp.execFileSync("corepack",["pnpm","--version"],{encoding:"utf8"}).trim(),vitest:cp.execFileSync("corepack",["pnpm","exec","vitest","--version"],{encoding:"utf8"}).trim(),packageManager:process.env.QA_PNPM_PACKAGE_MANAGER,workflowSha:process.env.QA_WORKFLOW_SHA,runId:process.env.GITHUB_RUN_ID};fs.writeFileSync(process.env.GITHUB_WORKSPACE+"/"+process.env.QA_OUTPUT_DIR+"/toolchain.json",JSON.stringify(r,null,2)+"\n");console.log(JSON.stringify(r));'
      - name: Compare intermediate baseline and exact candidate overlays
        shell: bash
        run: node "$GITHUB_WORKSPACE/artifacts/pr167072-recovery-qa-20261009/paired-regression.mjs" run
      - name: Verify exact overlay reversal and clean source
        if: always()
        shell: bash
        run: |
          if [ -d "$QA_PRODUCT_DIR/.git" ]; then
            node "$GITHUB_WORKSPACE/artifacts/pr167072-recovery-qa-20261009/paired-regression.mjs" cleanup
          else
            echo "CLEANUP_NOT_APPLICABLE: no product checkout"
          fi
      - name: Verify immutable QA tooling after product execution
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$QA_WORKFLOW_SHA"
          git diff --quiet "$QA_WORKFLOW_SHA" --
          git diff --cached --quiet "$QA_WORKFLOW_SHA" --
          printf 'workflow_sha=%s\ntracked_qa_tooling=pristine\n' "$QA_WORKFLOW_SHA" > "$QA_OUTPUT_DIR/qa-tooling-receipt.txt"
      - name: Upload structured receipts and bounded diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue167072-recovery-qa-${{ github.run_id }}
          path: artifacts/pr167072-recovery-qa-20261009/run-output/
          if-no-files-found: warn
          retention-days: 7
  tailscale-native:
    name: Tailscale authentication native proof (iOS simulator and macOS URLSession)
    if: ${{ github.repository == 'TheAngryPit/openclaw' && github.event_name == 'workflow_dispatch' && inputs.proof_kind == 'tailscale-native' }}
    runs-on: xcode-27
    timeout-minutes: 150
    concurrency:
      group: tailscale-native-163765
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      EXPECTED_SOURCE_SHA: 706c6fccf7596f67f0504664bb3a74d7833dad65
      INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      QA_TOOLING_DIR: ${{ github.workspace }}/apps/ios/build/tailscale-qa-tools-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Validate the exact request and public hosted macOS runner
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/tailscale-native-163765-$GITHUB_RUN_ID"
          DERIVED_DATA="$RUNNER_TEMP/tailscale-native-derived-$GITHUB_RUN_ID"
          IOS_RESULT_BUNDLE="$RUNNER_TEMP/tailscale-native-ios-$GITHUB_RUN_ID.xcresult"
          OPENCLAWKIT_SCRATCH="$RUNNER_TEMP/tailscale-native-openclawkit-$GITHUB_RUN_ID"
          mkdir -p "$EVIDENCE_DIR"
          {
            printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR"
            printf 'DERIVED_DATA=%s\n' "$DERIVED_DATA"
            printf 'IOS_RESULT_BUNDLE=%s\n' "$IOS_RESULT_BUNDLE"
            printf 'OPENCLAWKIT_SCRATCH=%s\n' "$OPENCLAWKIT_SCRATCH"
          } >> "$GITHUB_ENV"
          [[ "$GITHUB_REPOSITORY" == "TheAngryPit/openclaw" ]]
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]
          [[ "$RUNNER_OS" == "macOS" ]]
          [[ "$(uname -m)" == "arm64" ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INPUT_CANDIDATE_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          {
            printf 'source_repository=TheAngryPit/openclaw\n'
            printf 'source_sha_expected=%s\n' "$EXPECTED_SOURCE_SHA"
            printf 'candidate_sha_input=%s\n' "$INPUT_CANDIDATE_SHA"
            printf 'workflow_repository=%s\nworkflow_sha=%s\nworkflow_ref=%s\n' "$GITHUB_REPOSITORY" "$WORKFLOW_SHA" "$WORKFLOW_REF"
            printf 'run_id=%s\nrun_attempt=%s\nrunner_label=xcode-27\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'runner_environment=%s\nrunner_os=%s\nrunner_arch=%s\n' "$RUNNER_ENVIRONMENT" "$RUNNER_OS" "$(uname -m)"
            printf 'runner_image_os=%s\nrunner_image_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf 'macos_version=%s\n' "$(sw_vers -productVersion)"
            printf 'runner_disk=%s\n' "$(df -h "$RUNNER_TEMP" | tail -n 1)"
            printf 'checkout_action=actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1\n'
            printf 'artifact_action=actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a\n'
          } > "$EVIDENCE_DIR/provenance.txt"

      - name: Checkout the immutable public product source
        id: checkout-source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheAngryPit/openclaw
          ref: 706c6fccf7596f67f0504664bb3a74d7833dad65
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Checkout the exact QA workflow revision for diagnostic provenance
        id: checkout-workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: apps/ios/build/tailscale-qa-tools-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          sparse-checkout: |
            qa/tailscale-event-diagnostic-20261006
          sparse-checkout-cone-mode: true

      - name: Verify diagnostic patch provenance
        id: verify-diagnostic-patch
        run: |
          set -euo pipefail
          workflow_source_sha="$(git -C "$QA_TOOLING_DIR" rev-parse HEAD)"
          [[ "$workflow_source_sha" == "$WORKFLOW_SHA" ]]
          patch_path="$QA_TOOLING_DIR/qa/tailscale-event-diagnostic-20261006/tooling/launcher-event-stream-diagnostic.patch"
          test -f "$patch_path"
          cp "$patch_path" "$EVIDENCE_DIR/launcher-event-stream-diagnostic.patch"
          patch_sha256="$(shasum -a 256 "$EVIDENCE_DIR/launcher-event-stream-diagnostic.patch" | awk '{ print $1 }')"
          [[ "$patch_sha256" == "69c6190ff796f4f8159aff76ce557153f6549c0a2dd2c74fd72c4786ba77ce42" ]]
          printf 'diagnostic_workflow_source_sha=%s\ndiagnostic_patch_sha256=%s\n' \
            "$workflow_source_sha" "$patch_sha256" >> "$EVIDENCE_DIR/provenance.txt"

      - name: Verify source identity and clean checkout
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SOURCE_SHA" ]]
          git diff --quiet "$EXPECTED_SOURCE_SHA" --
          git diff --cached --quiet "$EXPECTED_SOURCE_SHA" --
          git status --porcelain --untracked-files=all > "$EVIDENCE_DIR/source-status-before.txt"
          [[ ! -s "$EVIDENCE_DIR/source-status-before.txt" ]]
          printf 'source_sha_actual=%s\nsource_status_before=clean\n' "$actual_sha" >> "$EVIDENCE_DIR/provenance.txt"

      - name: Install the source-pinned Node environment and frozen dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          cache-mode: "off"
          install-bun: "false"
          install-deps: "true"
          frozen-lockfile: "true"

      - name: Select and record the pinned Apple toolchain and one simulator
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
          require_swift_toolchain
          xcode_output="$(xcodebuild -version)"
          xcode_version="$(awk 'NR == 1 { print $2 }' <<< "$xcode_output")"
          xcode_build="$(awk 'NR == 2 { print $3 }' <<< "$xcode_output")"
          [[ "$xcode_version" == "27.0" ]]
          [[ "$xcode_build" == "27A266a" ]]

          node_version="$(node --version)"
          pnpm_version="$(pnpm --version)"
          package_manager="$(node -p 'require("./package.json").packageManager')"
          pnpm_expected="${package_manager#pnpm@}"
          pnpm_expected="${pnpm_expected%%+*}"
          [[ "$node_version" == "v24.21.0" ]]
          [[ "$package_manager" == pnpm@* ]]
          [[ "$pnpm_version" == "$pnpm_expected" ]]

          xcodegen_root="$RUNNER_TEMP/tailscale-native-xcodegen"
          scripts/install-xcodegen.sh "$xcodegen_root/bin"
          scripts/install-swift-tools.sh "$xcodegen_root/bin"
          export PATH="$xcodegen_root/bin:$PATH"
          echo "$xcodegen_root/bin" >> "$GITHUB_PATH"
          [[ "$(xcodegen --version)" == "Version: 2.46.0" ]]
          [[ "$(swiftformat --version)" == "0.63.0" ]]
          [[ "$(swiftlint version)" == "0.65.1" ]]

          simslim_dir="$RUNNER_TEMP/tailscale-native-simslim"
          scripts/install-simslim.sh "$simslim_dir"
          [[ "$("$simslim_dir/simslim" --version)" == "simslim 0.10.0" ]]

          simulator_id="$(select_ios_test_simulator)"
          [[ "$simulator_id" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$simulator_id" -b
          OPENCLAW_CI_SIMSLIM_BINARY="$simslim_dir/simslim" scripts/ios-simulator-prepare.sh "$simulator_id"
          simulator_device="$(IOS_SIMULATOR_ID="$simulator_id" xcrun simctl list devices available --json | IOS_SIMULATOR_ID="$simulator_id" node --input-type=module -e 'let s=""; for await (const c of process.stdin) s += c; const data=JSON.parse(s); const d=Object.values(data.devices).flat().find(x => x.udid === process.env.IOS_SIMULATOR_ID); if (!d) process.exit(2); process.stdout.write(`${d.name} (${d.state})`);')"

          {
            printf 'xcode_version=%s\nxcode_build=%s\n' "$xcode_version" "$xcode_build"
            printf 'xcode_output=%s\n' "${xcode_output//$'\n'/;}"
            printf 'swift_version=%s\n' "$(swift --version | tr '\n' ';')"
            printf 'node_version=%s\npnpm_version=%s\npnpm_package_manager=%s\n' "$node_version" "$pnpm_version" "$package_manager"
            printf 'xcodegen_version=%s\nsimslim_version=%s\n' "$(xcodegen --version)" "$("$simslim_dir/simslim" --version)"
            printf 'swiftformat_version=%s\nswiftlint_version=%s\n' "$(swiftformat --version)" "$(swiftlint version)"
            printf 'simulator_id=%s\nsimulator_device=%s\n' "$simulator_id" "$simulator_device"
            printf 'pnpm_lock_sha256=%s\n' "$(shasum -a 256 pnpm-lock.yaml | awk '{ print $1 }')"
            printf 'ios_project_spec_sha256=%s\n' "$(shasum -a 256 apps/ios/project.yml | awk '{ print $1 }')"
          } >> "$EVIDENCE_DIR/provenance.txt"

      - name: Install locked Apple Mermaid build inputs
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --optional
          --filter '@openclaw/mermaid-renderer...'
          --filter '@openclaw/gateway-protocol...'
          --config.ignore-scripts=false
          --config.engine-strict=false
          --config.enable-pre-post-scripts=true
          --config.side-effects-cache=true

      - name: Generate and verify the real Apple Mermaid resources before native builds
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          run_apple_command_logged "$EVIDENCE_DIR/mermaid-preparation.log" node scripts/prepare-apple-mermaid.mjs
          resources="apps/shared/OpenClawKit/Sources/OpenClawChatUI/Resources/Mermaid"
          test -s "$resources/index.html"
          test -s "$resources/native.js"
          test -s "$resources/NOTICE.txt"
          find "$resources" -type f -print0 | sort -z | xargs -0 shasum -a 256 > "$EVIDENCE_DIR/mermaid-resources.sha256"
          [[ -s "$EVIDENCE_DIR/mermaid-resources.sha256" ]]
          resource_count="$(wc -l < "$EVIDENCE_DIR/mermaid-resources.sha256" | tr -d '[:space:]')"
          [[ "$resource_count" -ge 3 ]]
          printf 'mermaid_resources_file_count=%s\n' "$resource_count" >> "$EVIDENCE_DIR/provenance.txt"

      - name: Generate the iOS Xcode project from the pinned source
        id: ios-preparation-gate
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          run_apple_command_logged "$EVIDENCE_DIR/ios-project-generation.log" pnpm ios:gen
          test -d apps/ios/OpenClaw.xcodeproj
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          git diff --quiet "$EXPECTED_SOURCE_SHA" --
          git diff --cached --quiet "$EXPECTED_SOURCE_SHA" --
          git status --porcelain --untracked-files=all > "$EVIDENCE_DIR/source-status-after-generation.txt"
          [[ ! -s "$EVIDENCE_DIR/source-status-after-generation.txt" ]]

      - name: Install the source-pinned Watch Rust toolchain
        id: watch-toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src
          rustup run "$watch_toolchain" rustc -vV > "$EVIDENCE_DIR/watch-rust-toolchain.txt"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          printf 'watch_rust_toolchain=%s\n' "$watch_toolchain" >> "$EVIDENCE_DIR/provenance.txt"

      - name: Apply the reviewed observational launcher overlay
        id: native-diagnostic-overlay
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          git diff --quiet "$EXPECTED_SOURCE_SHA" --
          git diff --cached --quiet "$EXPECTED_SOURCE_SHA" --
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          base_launcher_sha256="$(shasum -a 256 scripts/test-macos-native.mts | awk '{ print $1 }')"
          [[ "$base_launcher_sha256" == "dacb9fad271e9ed0438dbf8d58a9c80e072f55533eff863db0f572a2684c065f" ]]
          patch_path="$EVIDENCE_DIR/launcher-event-stream-diagnostic.patch"
          patch_sha256="$(shasum -a 256 "$patch_path" | awk '{ print $1 }')"
          [[ "$patch_sha256" == "69c6190ff796f4f8159aff76ce557153f6549c0a2dd2c74fd72c4786ba77ce42" ]]
          git apply --check "$patch_path"
          git apply "$patch_path"
          [[ "$(git diff --name-only)" == "scripts/test-macos-native.mts" ]]
          git diff --cached --quiet
          [[ "$(git status --porcelain --untracked-files=all)" == " M scripts/test-macos-native.mts" ]]
          git diff --binary --no-ext-diff -- scripts/test-macos-native.mts \
            > "$EVIDENCE_DIR/launcher-overlay.applied.patch"
          launcher_sha256="$(shasum -a 256 scripts/test-macos-native.mts | awk '{ print $1 }')"
          overlay_diff_sha256="$(shasum -a 256 "$EVIDENCE_DIR/launcher-overlay.applied.patch" | awk '{ print $1 }')"
          {
            printf 'diagnostic_overlay_base_source_sha=%s\n' "$EXPECTED_SOURCE_SHA"
            printf 'diagnostic_overlay_base_launcher_sha256=%s\n' "$base_launcher_sha256"
            printf 'diagnostic_overlay_patch_sha256=%s\n' "$patch_sha256"
            printf 'diagnostic_overlay_launcher_sha256=%s\n' "$launcher_sha256"
            printf 'diagnostic_overlay_diff_sha256=%s\n' "$overlay_diff_sha256"
          } >> "$EVIDENCE_DIR/provenance.txt"
          {
            printf 'DIAGNOSTIC_OVERLAY_APPLIED=true\n'
            printf 'DIAGNOSTIC_OVERLAY_LAUNCHER_SHA256=%s\n' "$launcher_sha256"
            printf 'DIAGNOSTIC_OVERLAY_DIFF_SHA256=%s\n' "$overlay_diff_sha256"
          } >> "$GITHUB_ENV"

      - name: Build the native OpenClawKit test product once
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          run_apple_command_logged "$EVIDENCE_DIR/openclawkit-build.log" swift build \
            --package-path apps/shared/OpenClawKit \
            --scratch-path "$OPENCLAWKIT_SCRATCH" \
            --disable-index-store \
            -Xswiftc -gline-tables-only \
            --build-tests

      - name: Run the synthetic native URLSession device-auth suite in the isolated macOS launcher
        id: native-urlsession-test
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          export OPENCLAW_SWIFT_TESTING_EVENT_DIAGNOSTIC_DIR="$EVIDENCE_DIR"
          swift test --help > "$EVIDENCE_DIR/swift-test-help.txt"
          swift test --help-hidden > "$EVIDENCE_DIR/swift-test-hidden-help.txt"
          grep -Fq -- '--disable-xctest' "$EVIDENCE_DIR/swift-test-help.txt"
          grep -Fq -- '--enable-swift-testing' "$EVIDENCE_DIR/swift-test-help.txt"
          grep -Fq -- '--test-product' "$EVIDENCE_DIR/swift-test-hidden-help.txt"
          run_apple_command_logged "$EVIDENCE_DIR/openclawkit-selected-product-list.log" swift test \
            --package-path apps/shared/OpenClawKit \
            --scratch-path "$OPENCLAWKIT_SCRATCH" \
            --skip-build \
            --test-product OpenClawKitTests \
            list
          grep -Fq 'GatewayNativeTransportDeviceAuthTests' "$EVIDENCE_DIR/openclawkit-selected-product-list.log"
          printf 'selected_swift_test_product=OpenClawKitTests\n' >> "$EVIDENCE_DIR/provenance.txt"
          run_apple_command_logged "$EVIDENCE_DIR/openclawkit-test.log" node scripts/test-macos-native.mts default \
            --package-path apps/shared/OpenClawKit \
            --scratch-path "$OPENCLAWKIT_SCRATCH" \
            --disable-index-store \
            -Xswiftc -gline-tables-only \
            --skip-build \
            --no-parallel \
            --disable-xctest \
            --enable-swift-testing \
            --test-product OpenClawKitTests \
            --filter GatewayNativeTransportDeviceAuthTests \
            --xunit-output="$EVIDENCE_DIR/openclawkit-native-tests.xml"

      - name: Require actual passing Swift test identities and a positive count
        if: ${{ always() && steps.native-urlsession-test.outcome != 'skipped' && steps.native-urlsession-test.outcome != 'cancelled' }}
        run: |
          set -euo pipefail
          python3 - "$EVIDENCE_DIR/openclawkit-native-tests" "$EVIDENCE_DIR/openclawkit-native-summary.json" <<'PY'
          import glob
          import json
          import sys
          import xml.etree.ElementTree as ET

          prefix, summary_path = sys.argv[1:]
          reports = sorted(glob.glob(prefix + "*.xml"))
          if not reports:
              raise SystemExit("SwiftPM produced no structured xUnit report")

          identities = []
          failures = []
          skipped = []
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  identity = f"{case.attrib.get('classname', '')}/{case.attrib.get('name', '')}".strip("/")
                  if "GatewayNativeTransportDeviceAuthTests" not in identity:
                      raise SystemExit(f"Unexpected native test identity in filtered report: {identity}")
                  identities.append(identity)
                  for child in case:
                      tag = child.tag.rsplit("}", 1)[-1]
                      if tag in {"failure", "error"}:
                          failures.append(identity)
                      elif tag == "skipped":
                          skipped.append(identity)

          if not identities:
              raise SystemExit("SwiftPM xUnit report contains zero executed native test cases")
          if len(identities) != 7 or len(set(identities)) != 7:
              raise SystemExit("Pinned GatewayNativeTransportDeviceAuthTests must execute all seven distinct cases")
          if failures or skipped:
              raise SystemExit(f"Native test failures={failures}; skipped={skipped}")

          result = {
              "suite": "GatewayNativeTransportDeviceAuthTests",
              "totalTestCount": len(identities),
              "passedTests": len(identities),
              "failedTests": 0,
              "skippedTests": 0,
              "testIdentities": sorted(identities),
              "xunitReports": reports,
          }
          with open(summary_path, "w", encoding="utf-8") as stream:
              json.dump(result, stream, indent=2, sort_keys=True)
              stream.write("\n")
          print(json.dumps(result, sort_keys=True))
          PY
          cat "$EVIDENCE_DIR/openclawkit-native-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the three selected iOS test suites once
        id: ios-build
        if: ${{ always() && !cancelled() && steps.ios-preparation-gate.outcome == 'success' && steps.watch-toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          run_apple_command_logged "$EVIDENCE_DIR/ios-build.log" xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:?}" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            -only-testing:OpenClawTests/PersonalGatewayAuthenticationTests \
            -only-testing:OpenClawTests/GatewayConnectionControllerTests \
            -only-testing:OpenClawTests/GatewaySettingsStoreTests \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE= \
            PROVISIONING_PROFILE_SPECIFIER= \
            build-for-testing

      - name: Run the selected iOS suites serially on the recorded simulator
        id: ios-test
        if: ${{ always() && !cancelled() && steps.ios-preparation-gate.outcome == 'success' && steps.ios-build.outcome == 'success' }}
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          run_apple_command_logged "$EVIDENCE_DIR/ios-test.log" xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:?}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$IOS_RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:OpenClawTests/PersonalGatewayAuthenticationTests \
            -only-testing:OpenClawTests/GatewayConnectionControllerTests \
            -only-testing:OpenClawTests/GatewaySettingsStoreTests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE= \
            PROVISIONING_PROFILE_SPECIFIER= \
            test-without-building

      - name: Require all three iOS suites to pass with structured positive counts
        if: ${{ always() && steps.ios-test.outcome != 'skipped' && steps.ios-test.outcome != 'cancelled' }}
        run: |
          set -euo pipefail
          if [[ ! -d "$IOS_RESULT_BUNDLE" ]]; then
            echo "Missing xcresult bundle: $IOS_RESULT_BUNDLE" >&2
            exit 1
          fi
          xcrun xcresulttool get test-results summary --path "$IOS_RESULT_BUNDLE" --compact \
            > "$EVIDENCE_DIR/ios-xcresult-summary.json"
          xcrun xcresulttool get test-results tests --path "$IOS_RESULT_BUNDLE" \
            > "$EVIDENCE_DIR/ios-xcresult-tests.json"
          python3 - "$EVIDENCE_DIR/ios-xcresult-summary.json" "$EVIDENCE_DIR/ios-xcresult-tests.json" "$EVIDENCE_DIR/ios-suite-summary.json" "$IOS_SIMULATOR_ID" <<'PY'
          import json
          import sys

          summary_path, tests_path, output_path, simulator_id = sys.argv[1:]
          expected = [
              "PersonalGatewayAuthenticationTests",
              "GatewayConnectionControllerTests",
              "GatewaySettingsStoreTests",
          ]
          with open(summary_path, encoding="utf-8") as stream:
              summary = json.load(stream)
          with open(tests_path, encoding="utf-8") as stream:
              tests = json.load(stream)

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def descendants(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.get("children", []):
                      yield from descendants(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from descendants(child)

          require(summary.get("result") == "Passed", "xcresult summary is not Passed")
          total = summary.get("totalTestCount")
          require(isinstance(total, int) and total > 0, "xcresult reports no executed tests")
          require(summary.get("passedTests") == total, "not every executed iOS test passed")
          require(summary.get("failedTests") == 0, "xcresult reports failed tests")
          require(summary.get("skippedTests") == 0, "xcresult reports skipped tests")
          require(summary.get("expectedFailures") == 0, "xcresult reports expected failures")
          require(summary.get("testFailures", []) == [], "xcresult contains test failure details")

          all_nodes = list(descendants(tests.get("testNodes", [])))
          bundles = [node for node in all_nodes if node.get("nodeType") == "Unit test bundle"]
          require(len(bundles) == 1 and bundles[0].get("name") == "OpenClawTests",
                  "xcresult does not contain exactly the OpenClawTests bundle")
          cases = [node for node in descendants(bundles[0].get("children", []))
                   if node.get("nodeType") == "Test Case"]
          require(len(cases) == total, "xcresult case identities do not match its executed test count")
          counts = {suite: 0 for suite in expected}
          identities = []
          for case in cases:
              identity = str(case.get("nodeIdentifier", ""))
              matches = [suite for suite in expected if suite in identity]
              require(len(matches) == 1, f"unexpected selected-test identity: {identity}")
              require(case.get("result") == "Passed", f"test did not pass: {identity}")
              counts[matches[0]] += 1
              identities.append({"identity": identity, "result": case.get("result")})
          for suite, count in counts.items():
              require(count > 0, f"xcresult contains no executed tests for {suite}")

          configurations = summary.get("devicesAndConfigurations", [])
          require(len(configurations) == 1, "xcresult contains an unexpected device/configuration count")
          device = configurations[0].get("device", {})
          require(device.get("deviceId") == simulator_id, "xcresult used an unexpected simulator")
          result = {
              "result": summary["result"],
              "simulatorId": simulator_id,
              "totalTestCount": total,
              "passedTests": summary["passedTests"],
              "failedTests": summary["failedTests"],
              "skippedTests": summary["skippedTests"],
              "suiteCounts": counts,
              "testIdentities": sorted(identities, key=lambda item: item["identity"]),
          }
          with open(output_path, "w", encoding="utf-8") as stream:
              json.dump(result, stream, indent=2, sort_keys=True)
              stream.write("\n")
          print(json.dumps(result, sort_keys=True))
          PY
          cat "$EVIDENCE_DIR/ios-suite-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify exact source and record final input hashes
        if: ${{ always() && steps.checkout-source.outcome == 'success' }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SOURCE_SHA" ]]
          git diff --cached --quiet "$EXPECTED_SOURCE_SHA" --
          git status --porcelain --untracked-files=all > "$EVIDENCE_DIR/source-status-final.txt"
          if [[ "${DIAGNOSTIC_OVERLAY_APPLIED:-false}" == "true" ]]; then
            [[ "$(git status --porcelain --untracked-files=all)" == " M scripts/test-macos-native.mts" ]]
            [[ "$(git diff --name-only)" == "scripts/test-macos-native.mts" ]]
            git diff --binary --no-ext-diff -- scripts/test-macos-native.mts \
              > "$EVIDENCE_DIR/launcher-overlay.final.patch"
            final_launcher_sha256="$(shasum -a 256 scripts/test-macos-native.mts | awk '{ print $1 }')"
            final_overlay_diff_sha256="$(shasum -a 256 "$EVIDENCE_DIR/launcher-overlay.final.patch" | awk '{ print $1 }')"
            [[ "$final_launcher_sha256" == "$DIAGNOSTIC_OVERLAY_LAUNCHER_SHA256" ]]
            [[ "$final_overlay_diff_sha256" == "$DIAGNOSTIC_OVERLAY_DIFF_SHA256" ]]
            cmp -s "$EVIDENCE_DIR/launcher-overlay.applied.patch" "$EVIDENCE_DIR/launcher-overlay.final.patch"
            source_status_after=diagnostic-overlay-only
            printf 'diagnostic_overlay_final_launcher_sha256=%s\n' "$final_launcher_sha256" >> "$EVIDENCE_DIR/provenance.txt"
            printf 'diagnostic_overlay_final_diff_sha256=%s\n' "$final_overlay_diff_sha256" >> "$EVIDENCE_DIR/provenance.txt"
          else
            git diff --quiet "$EXPECTED_SOURCE_SHA" --
            [[ ! -s "$EVIDENCE_DIR/source-status-final.txt" ]]
            source_status_after=clean-no-overlay
          fi
          {
            echo "source_sha_after=$actual_sha"
            echo "source_status_after=$source_status_after"
            printf 'native_macos_test_outcome=%s\n' '${{ steps.native-urlsession-test.outcome }}'
            printf 'ios_build_outcome=%s\nios_test_outcome=%s\n' \
              '${{ steps.ios-build.outcome }}' '${{ steps.ios-test.outcome }}'
          } >> "$EVIDENCE_DIR/provenance.txt"
          shasum -a 256 \
            .github/actions/setup-node-env/action.yml \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            apps/ios/project.yml \
            apps/ios/Tests/PersonalGatewayAuthenticationTests.swift \
            apps/ios/Tests/GatewayConnectionControllerTests.swift \
            apps/ios/Tests/GatewaySettingsStoreTests.swift \
            apps/shared/OpenClawKit/Package.swift \
            apps/shared/OpenClawKit/Tests/OpenClawKitTests/GatewayNativeTransportDeviceAuthTests.swift \
            apps/shared/OpenClawKit/Tests/OpenClawKitTests/NativeGatewayWebSocketFixture.swift \
            scripts/prepare-apple-mermaid.mjs \
            scripts/lib/swift-toolchain.sh \
            scripts/test-macos-native.mts \
            scripts/install-xcodegen.sh \
            scripts/install-simslim.sh \
            scripts/ios-simulator-prepare.sh \
            > "$EVIDENCE_DIR/source-inputs.sha256"
          resolved_count=0
          while IFS= read -r -d '' resolved_file; do
            shasum -a 256 "$resolved_file" >> "$EVIDENCE_DIR/source-inputs.sha256"
            resolved_count=$((resolved_count + 1))
          done < <(find apps/ios apps/shared apps/swabble -type f -name Package.resolved -print0 | sort -z)
          printf 'swift_package_resolved_file_count=%s\n' "$resolved_count" >> "$EVIDENCE_DIR/provenance.txt"

      - name: Upload bounded native proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tailscale-native-706c6fcc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tailscale-native-163765-${{ github.run_id }}
            ${{ runner.temp }}/tailscale-native-ios-${{ github.run_id }}.xcresult
          if-no-files-found: warn
          retention-days: 7
  cloudflare-native:
    name: Cloudflare native auth and dashboard QA (iOS simulator)
    if: ${{ github.repository == 'TheAngryPit/openclaw' && github.event_name == 'workflow_dispatch' && inputs.proof_kind == 'cloudflare-native' }}
    runs-on: xcode-27
    timeout-minutes: 150
    concurrency:
      group: cloudflare-pr158051-native-completion
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      EXPECTED_SOURCE_SHA: 3c07fe17649715937b822ea0e1ed9cabd8c7c5ad
      EXPECTED_XCTEST_ID: SettingsHubVisualProofTests/testIngressAuthorizedDashboardEntryPointsLoadTheSelectedGatewayPage()
      SELECTED_TEST: OpenClawTests/SettingsHubVisualProofTests/testIngressAuthorizedDashboardEntryPointsLoadTheSelectedGatewayPage
      QA_TOOLING_DIR: ${{ github.workspace }}/apps/ios/build/cloudflare-qa-tools-${{ github.run_id }}-${{ github.run_attempt }}
      QA_VERIFIER_PATH: ${{ github.workspace }}/apps/ios/build/cloudflare-qa-tools-${{ github.run_id }}-${{ github.run_attempt }}/qa/cloudflare-native-completion-20261006/verify-cloudflare-native-xcresult.py
      RESTART_RESULT_ROOT: ${{ github.workspace }}/apps/ios/build/LifecycleTestResults
    steps:
      - name: Checkout immutable public fork source
        id: checkout-source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheAngryPit/openclaw
          ref: 3c07fe17649715937b822ea0e1ed9cabd8c7c5ad
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Checkout the exact workflow revision for QA verifier provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: apps/ios/build/cloudflare-qa-tools-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          sparse-checkout: |
            qa/cloudflare-native-completion-20261006
          sparse-checkout-cone-mode: true

      - name: Verify target and start evidence receipt
        run: |
          set -euo pipefail
          [[ "$INPUT_CANDIDATE_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]
          [[ "$(uname -m)" == "arm64" ]]
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SOURCE_SHA" ]]
          git diff --quiet "$EXPECTED_SOURCE_SHA" --
          git diff --cached --quiet "$EXPECTED_SOURCE_SHA" --
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          EVIDENCE_DIR="$RUNNER_TEMP/openclaw-cloudflare-pr158051-evidence"
          RESULT_BUNDLE="$RUNNER_TEMP/openclaw-cloudflare-pr158051.xcresult"
          SUITE_RESULT_BUNDLE="$RUNNER_TEMP/openclaw-cloudflare-pr158051-suites.xcresult"
          RESTART_LOG="$EVIDENCE_DIR/access-restart.log"
          [[ ! -e "$EVIDENCE_DIR" && ! -e "$RESULT_BUNDLE" && ! -e "$SUITE_RESULT_BUNDLE" ]]
          qa_workflow_sha="$(git -C "$QA_TOOLING_DIR" rev-parse --verify HEAD)"
          [[ "$qa_workflow_sha" == "$GITHUB_WORKFLOW_SHA" ]]
          git -C "$QA_TOOLING_DIR" status --porcelain --untracked-files=all > "$RUNNER_TEMP/cloudflare-qa-tool-status.txt"
          [[ ! -s "$RUNNER_TEMP/cloudflare-qa-tool-status.txt" ]]
          test -f "$QA_VERIFIER_PATH"
          qa_verifier_sha256="$(shasum -a 256 "$QA_VERIFIER_PATH" | awk '{ print $1 }')"
          printf 'EVIDENCE_DIR=%s\nRESULT_BUNDLE=%s\nSUITE_RESULT_BUNDLE=%s\nRESTART_LOG=%s\n' \
            "$EVIDENCE_DIR" "$RESULT_BUNDLE" "$SUITE_RESULT_BUNDLE" "$RESTART_LOG" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"
          cp "$QA_VERIFIER_PATH" "$EVIDENCE_DIR/verify-cloudflare-native-xcresult.py"
          {
            echo "source_repository=TheAngryPit/openclaw"
            echo "source_sha=$actual_sha"
            echo "workflow_repository=$GITHUB_REPOSITORY"
            echo "workflow_sha=$GITHUB_WORKFLOW_SHA"
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_label=xcode-27"
            echo "runner_environment=${RUNNER_ENVIRONMENT:-unknown}"
            echo "runner_arch=$(uname -m)"
            echo "runner_image_os=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo "runner_disk=$(df -h "$RUNNER_TEMP" | tail -n 1)"
            echo "selected_test=$SELECTED_TEST"
            echo "qa_verifier_workflow_sha=$qa_workflow_sha"
            echo "qa_verifier_sha256=$qa_verifier_sha256"
            echo "qa_verifier_checkout_credentials_persisted=false"
            echo "source_checkout_credentials_persisted=false"
            echo "workflow_permissions=contents:read"
            echo "checkout_action=actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
            echo "artifact_action=actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
          } > "$EVIDENCE_DIR/preflight.txt"

      - name: Install pinned Node and pnpm; install locked JS dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          cache-mode: "off"
          install-bun: "false"
          install-deps: "true"
          frozen-lockfile: "true"

      - name: Install pinned Xcode tools and select one simulator
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
          require_swift_toolchain
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          [[ "$xcode_version" == 27.* ]]

          swift_tools_dir="$RUNNER_TEMP/openclaw-pr158051-swift-tools"
          scripts/install-xcodegen.sh "$swift_tools_dir"
          scripts/install-swift-tools.sh "$swift_tools_dir"
          export PATH="$swift_tools_dir:$PATH"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"
          [[ "$(xcodegen --version)" == "Version: 2.46.0" ]]
          [[ "$(swiftformat --version)" == "0.63.0" ]]
          [[ "$(swiftlint version)" == "0.65.1" ]]

          node_version="$(node --version)"
          pnpm_version="$(pnpm --version)"
          package_manager="$(node -p 'require("./package.json").packageManager')"
          pnpm_expected="${package_manager#pnpm@}"
          pnpm_expected="${pnpm_expected%%+*}"
          [[ "$node_version" == "v24.21.0" ]]
          [[ "$package_manager" == pnpm@* ]]
          [[ "$pnpm_version" == "$pnpm_expected" ]]

          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          [[ -n "$watch_toolchain" ]]
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          simulator_id="$(select_ios_test_simulator)"
          [[ "$simulator_id" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          simslim_dir="$RUNNER_TEMP/openclaw-pr158051-simslim"
          scripts/install-simslim.sh "$simslim_dir"
          xcrun simctl bootstatus "$simulator_id" -b
          OPENCLAW_CI_SIMSLIM_BINARY="$simslim_dir/simslim" scripts/ios-simulator-prepare.sh "$simulator_id"

          {
            echo "xcode_version=$(xcodebuild -version | tr '\n' ';')"
            echo "swift_version=$(swift --version | tr '\n' ';')"
            echo "node_version=$node_version"
            echo "pnpm_version=$pnpm_version"
            echo "pnpm_package_manager=$package_manager"
            echo "xcodegen_version=$(xcodegen --version)"
            echo "swiftformat_version=$(swiftformat --version)"
            echo "swiftlint_version=$(swiftlint version)"
            echo "rust_toolchain=$watch_toolchain"
            echo "rustc_version=$(rustup run "$watch_toolchain" rustc --version)"
            echo "simslim_version=$("$simslim_dir/simslim" --version)"
            echo "simulator_id=$simulator_id"
            echo "simulator_device=$(IOS_SIMULATOR_ID="$simulator_id" xcrun simctl list devices available --json | IOS_SIMULATOR_ID="$simulator_id" node --input-type=module -e 'let s=""; for await (const c of process.stdin) s += c; const data=JSON.parse(s); const d=Object.values(data.devices).flat().find(x => x.udid === process.env.IOS_SIMULATOR_ID); if (!d) process.exit(2); process.stdout.write(`${d.name} (${d.state})`);')"
            echo "pnpm_lock_sha256=$(shasum -a 256 pnpm-lock.yaml | awk '{ print $1 }')"
            echo "ios_project_spec_sha256=$(shasum -a 256 apps/ios/project.yml | awk '{ print $1 }')"
            echo "watch_rust_lock_sha256=$(shasum -a 256 apps/shared/OpenClawWatchRTC/Cargo.lock | awk '{ print $1 }')"
          } >> "$EVIDENCE_DIR/preflight.txt"
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            shasum -a 256 "$file" >> "$EVIDENCE_DIR/preflight.txt"
          done < <(find apps/ios apps/shared apps/swabble -name Package.resolved -type f | sort)
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            shasum -a 256 "$file" >> "$EVIDENCE_DIR/preflight.txt"
          done <<'FILES'
          .github/actions/setup-node-env/action.yml
          apps/ios/Tests/SettingsHubTests.swift
          apps/ios/Tests/CloudflareAccessClientTests.swift
          apps/ios/Tests/CloudflareAccessBrowserPresenterTests.swift
          apps/ios/Tests/CloudflareAccessTransferTests.swift
          apps/ios/Tests/CloudflareAccessSessionStoreTests.swift
          apps/ios/Tests/GatewayAccessDeviceAuthBindingTests.swift
          apps/ios/Tests/GatewayIngressControllerTests.swift
          apps/ios/Tests/GatewayIngressActivationTests.swift
          apps/ios/Tests/GatewayIngressWireTests.swift
          apps/ios/Tests/GatewayIngressLoginPreparationTests.swift
          apps/ios/Tests/GatewayAccessRestartTests.swift
          apps/ios/Sources/Gateway/CloudflareAccessClient.swift
          apps/ios/Sources/Gateway/CloudflareAccessBrowserPresenter.swift
          apps/ios/Sources/Gateway/CloudflareAccessTransfer.swift
          apps/ios/Sources/Gateway/CloudflareAccessSessionStore.swift
          apps/ios/Sources/Gateway/GatewayAccessDeviceAuthBinding.swift
          apps/ios/Sources/Gateway/GatewayIngressController.swift
          apps/ios/Sources/Settings/SettingsHubScreen.swift
          apps/ios/project.yml
          scripts/ios-configure-signing.sh
          scripts/ios-access-restart-proof.py
          scripts/ios-simulator-prepare.sh
          scripts/ios-team-id.sh
          scripts/ios-write-swift-filelist.mts
          scripts/ios-write-version-xcconfig.sh
          scripts/install-simslim.sh
          scripts/install-swift-tools.sh
          scripts/install-xcodegen.sh
          scripts/lib/swift-toolchain.sh
          FILES
          {
            echo "## Cloudflare PR 158051 native proof preflight"
            echo
            echo "- Source: TheAngryPit/openclaw@$EXPECTED_SOURCE_SHA"
            echo "- Workflow: $GITHUB_REPOSITORY@$GITHUB_WORKFLOW_SHA"
            echo "- Xcode: $xcode_version; simulator: $simulator_id"
            echo "- Selected XCTest: $SELECTED_TEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Apple Mermaid build inputs
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --optional
          --filter '@openclaw/mermaid-renderer...'
          --filter '@openclaw/gateway-protocol...'
          --config.ignore-scripts=false
          --config.engine-strict=false
          --config.enable-pre-post-scripts=true
          --config.side-effects-cache=true

      - name: Generate Xcode project from the pinned source
        run: |
          set -euo pipefail
          pnpm ios:gen 2>&1 | tee "$EVIDENCE_DIR/project-generation.log"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          git diff --quiet "$EXPECTED_SOURCE_SHA" --
          git diff --cached --quiet "$EXPECTED_SOURCE_SHA" --
          git status --porcelain --untracked-files=all > "$EVIDENCE_DIR/source-after-generation.txt"
          [[ ! -s "$EVIDENCE_DIR/source-after-generation.txt" ]]

      - name: Apply the reviewed synthetic navigation observation overlay
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          git diff --quiet "$EXPECTED_SOURCE_SHA" --
          git diff --cached --quiet "$EXPECTED_SOURCE_SHA" --
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          target=apps/ios/Tests/SettingsHubTests.swift
          patch_path="$QA_TOOLING_DIR/qa/cloudflare-native-completion-20261006/navigation-observation.patch"
          [[ "$(shasum -a 256 "$target" | awk '{ print $1 }')" == e04f2523419e67ee34ba8dc814ec4fa53cabf5a3eca230597de07fc245a37451 ]]
          [[ "$(shasum -a 256 "$patch_path" | awk '{ print $1 }')" == 653d63c938eeca147ba599872aba55f11f767b481c6f1602b27bbddfaada7043 ]]
          git apply --check "$patch_path"
          git apply "$patch_path"
          [[ "$(git status --porcelain --untracked-files=all)" == " M $target" ]]
          git diff --cached --quiet
          [[ "$(shasum -a 256 "$target" | awk '{ print $1 }')" == defa9ec3476c0bfb3f6246cdc0c2b8a940c01600b055a5bf46ea06765f4e960e ]]
          git diff --binary --no-ext-diff -- "$target" > "$EVIDENCE_DIR/navigation-overlay.applied.patch"
          cp "$patch_path" "$EVIDENCE_DIR/navigation-observation.patch"
          {
            echo 'proof_kind=cloudflare-navigation-instrumented'
            echo 'instrumentation_is_product_repair=false'
            echo 'instrumented_pass_proves_original_timing=false'
            echo 'navigation_overlay_base_sha256=e04f2523419e67ee34ba8dc814ec4fa53cabf5a3eca230597de07fc245a37451'
            echo 'navigation_overlay_patch_sha256=653d63c938eeca147ba599872aba55f11f767b481c6f1602b27bbddfaada7043'
            echo 'navigation_overlay_target_sha256=defa9ec3476c0bfb3f6246cdc0c2b8a940c01600b055a5bf46ea06765f4e960e'
          } >> "$EVIDENCE_DIR/preflight.txt"
          echo 'CF_NAVIGATION_OVERLAY_APPLIED=true' >> "$GITHUB_ENV"

      - name: Build selected Cloudflare and ingress test products
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          selectors=(
            OpenClawTests/SettingsHubVisualProofTests/testIngressAuthorizedDashboardEntryPointsLoadTheSelectedGatewayPage
            OpenClawTests/CloudflareAccessClientTests
            OpenClawTests/CloudflareAccessBrowserPresenterTests
            OpenClawTests/CloudflareAccessTransferTests
            OpenClawTests/CloudflareAccessSessionStoreTests
            OpenClawTests/GatewayAccessDeviceAuthBindingTests
            OpenClawTests/GatewayIngressControllerTests
            OpenClawTests/GatewayIngressLoginPreparationTests
            OpenClawTests/SettingsHubVisualProofTests/testOlderDashboardShowsNativeGatewayUpgradeBanner
            OpenClawTests/GatewayAccessRestartTests/testAcknowledgedSignOutSurvivesProcessRestart
          )
          args=()
          for selector in "${selectors[@]}"; do args+=("-only-testing:$selector"); done
          run_apple_command_logged "$EVIDENCE_DIR/build.log" xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:?}" \
            -parallel-testing-enabled NO \
            "${args[@]}" \
            -showBuildTimingSummary \
            build-for-testing

      - name: Run exactly the ingress-authorized dashboard entrypoint test
        id: native-test
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          run_apple_command_logged "$EVIDENCE_DIR/test.log" xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:?}" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:"$SELECTED_TEST" \
            test-without-building

      - name: Require one passing selected XCTest in xcresult
        if: ${{ always() && steps.native-test.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          if [[ ! -d "$RESULT_BUNDLE" ]]; then
            echo "Missing xcresult bundle for the selected XCTest: $RESULT_BUNDLE" >&2
            exit 1
          fi
          xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" --compact \
            > "$EVIDENCE_DIR/xcresult-summary.json"
          xcrun xcresulttool get test-results tests --path "$RESULT_BUNDLE" \
            > "$EVIDENCE_DIR/xcresult-tests.json"
          xcrun xcresulttool get test-results test-details --path "$RESULT_BUNDLE" --test-id "$EXPECTED_XCTEST_ID" \
            > "$EVIDENCE_DIR/xcresult-selected-test.json"
          python3 - "$EVIDENCE_DIR/xcresult-summary.json" "$EVIDENCE_DIR/xcresult-tests.json" "$EVIDENCE_DIR/xcresult-selected-test.json" "$EXPECTED_XCTEST_ID" "$IOS_SIMULATOR_ID" <<'PY'
          import json
          import sys

          summary_path, tests_path, details_path, expected_id, simulator_id = sys.argv[1:]
          with open(summary_path, encoding="utf-8") as stream:
              summary = json.load(stream)
          with open(tests_path, encoding="utf-8") as stream:
              tests = json.load(stream)
          with open(details_path, encoding="utf-8") as stream:
              details = json.load(stream)

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def descendants(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.get("children", []):
                      yield from descendants(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from descendants(child)

          require(summary.get("result") == "Passed", "xcresult summary is not Passed")
          require(summary.get("totalTestCount") == 1, "xcresult must report exactly one executed test")
          require(summary.get("passedTests") == 1, "xcresult must report exactly one passing test")
          require(summary.get("failedTests") == 0, "xcresult reports a failed test")
          require(summary.get("skippedTests") == 0, "xcresult reports a skipped test")
          require(summary.get("expectedFailures") == 0, "xcresult reports an expected failure")
          require(summary.get("testFailures") == [], "xcresult contains test failures")

          all_nodes = list(descendants(tests.get("testNodes", [])))
          bundles = [node for node in all_nodes if node.get("nodeType") == "Unit test bundle"]
          require(len(bundles) == 1 and bundles[0].get("name") == "OpenClawTests",
                  "xcresult does not contain exactly the OpenClawTests bundle")
          bundle_nodes = list(descendants(bundles[0].get("children", [])))
          cases = [node for node in bundle_nodes if node.get("nodeType") == "Test Case"]
          require(len(cases) == 1, "xcresult must contain exactly one test case")
          require(cases[0].get("nodeIdentifier") == expected_id and cases[0].get("result") == "Passed",
                  "xcresult test case identity or outcome does not match the selected test")
          require(details.get("testIdentifier") == expected_id and details.get("testResult") == "Passed",
                  "xcresult selected-test details do not confirm the expected pass")

          summary_runs = summary.get("devicesAndConfigurations", [])
          require(len(summary_runs) == 1 and summary_runs[0].get("device", {}).get("deviceId") == simulator_id,
                  "xcresult used an unexpected simulator or test configuration")
          configuration = summary_runs[0].get("testPlanConfiguration", {}).get("configurationId")
          require(isinstance(configuration, str) and configuration,
                  "xcresult summary is missing the selected test configuration")
          for document in (tests, details):
              devices = document.get("devices", [])
              configurations = document.get("testPlanConfigurations", [])
              require(len(devices) == 1 and devices[0].get("deviceId") == simulator_id,
                      "xcresult test records used an unexpected simulator")
              require(len(configurations) == 1 and configurations[0].get("configurationId") == configuration,
                      "xcresult test records used an unexpected configuration")
          print(json.dumps({
              "result": summary["result"],
              "totalTestCount": summary["totalTestCount"],
              "passedTests": summary["passedTests"],
              "failedTests": summary["failedTests"],
              "skippedTests": summary["skippedTests"],
              "expectedTest": expected_id,
              "simulatorId": simulator_id,
          }, sort_keys=True))
          PY
          cat "$EVIDENCE_DIR/xcresult-summary.json" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact selected-test xcresult gate: **passed** ($EXPECTED_XCTEST_ID)." >> "$GITHUB_STEP_SUMMARY"

      - name: Run Cloudflare auth, ingress lifecycle, and older-dashboard suites
        id: cloudflare-suites
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          selectors=(
            OpenClawTests/CloudflareAccessClientTests
            OpenClawTests/CloudflareAccessBrowserPresenterTests
            OpenClawTests/CloudflareAccessTransferTests
            OpenClawTests/CloudflareAccessSessionStoreTests
            OpenClawTests/GatewayAccessDeviceAuthBindingTests
            OpenClawTests/GatewayIngressControllerTests
            OpenClawTests/GatewayIngressLoginPreparationTests
            OpenClawTests/SettingsHubVisualProofTests/testOlderDashboardShowsNativeGatewayUpgradeBanner
          )
          args=()
          for selector in "${selectors[@]}"; do args+=("-only-testing:$selector"); done
          run_apple_command_logged "$EVIDENCE_DIR/test-cloudflare-suites.log" xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:?}" \
            -resultBundlePath "$SUITE_RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            "${args[@]}" \
            test-without-building

      - name: Require expected suites, identities, and zero skips
        id: cloudflare-suite-verification
        if: ${{ always() && steps.cloudflare-suites.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          python3 "$QA_VERIFIER_PATH" \
            --result-bundle "$SUITE_RESULT_BUNDLE" \
            --simulator "$IOS_SIMULATOR_ID" \
            --source-root "$GITHUB_WORKSPACE" \
            > "$EVIDENCE_DIR/cloudflare-suites-verification.json"
          cat "$EVIDENCE_DIR/cloudflare-suites-verification.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify acknowledged sign-out across two actual app processes
        id: access-restart
        if: ${{ steps.cloudflare-suites.outcome == 'success' && steps.cloudflare-suite-verification.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "$RESTART_RESULT_ROOT"
          shopt -s nullglob
          existing=("$RESTART_RESULT_ROOT"/AccessRestart-*.xcresult)
          [[ ${#existing[@]} -eq 0 ]]
          python3 scripts/ios-access-restart-proof.py "$IOS_SIMULATOR_ID" 2>&1 | tee "$RESTART_LOG"
          grep -Eq "^ACCESS_RESTART passed source=${EXPECTED_SOURCE_SHA} seed_pid=[1-9][0-9]* verify_pid=[1-9][0-9]* app_sha256=[0-9a-f]{64} test_sha256=[0-9a-f]{64}$" "$RESTART_LOG"
          results=("$RESTART_RESULT_ROOT"/AccessRestart-*.xcresult)
          [[ ${#results[@]} -eq 1 && -d "${results[0]}" ]]
          cat "$RESTART_LOG" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify source remains pristine after build
        if: ${{ always() && steps.checkout-source.outcome == 'success' }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SOURCE_SHA" ]]
          qa_workflow_sha="$(git -C "$QA_TOOLING_DIR" rev-parse --verify HEAD)"
          [[ "$qa_workflow_sha" == "$GITHUB_WORKFLOW_SHA" ]]
          qa_verifier_sha256="$(shasum -a 256 "$QA_VERIFIER_PATH" | awk '{ print $1 }')"
          grep -Fqx "qa_verifier_sha256=$qa_verifier_sha256" "$EVIDENCE_DIR/preflight.txt"
          git -C "$QA_TOOLING_DIR" status --porcelain --untracked-files=all > "$EVIDENCE_DIR/qa-tooling-final-status.txt"
          [[ ! -s "$EVIDENCE_DIR/qa-tooling-final-status.txt" ]]
          if [[ "${CF_NAVIGATION_OVERLAY_APPLIED:-false}" == true ]]; then
            target=apps/ios/Tests/SettingsHubTests.swift
            [[ "$(git status --porcelain --untracked-files=all)" == " M $target" ]]
            git diff --cached --quiet "$EXPECTED_SOURCE_SHA" --
            [[ "$(shasum -a 256 "$target" | awk '{ print $1 }')" == defa9ec3476c0bfb3f6246cdc0c2b8a940c01600b055a5bf46ea06765f4e960e ]]
            git diff --binary --no-ext-diff -- "$target" > "$EVIDENCE_DIR/navigation-overlay.final.patch"
            cmp -s "$EVIDENCE_DIR/navigation-overlay.applied.patch" "$EVIDENCE_DIR/navigation-overlay.final.patch"
            patch_path="$QA_TOOLING_DIR/qa/cloudflare-native-completion-20261006/navigation-observation.patch"
            [[ "$(shasum -a 256 "$patch_path" | awk '{ print $1 }')" == 653d63c938eeca147ba599872aba55f11f767b481c6f1602b27bbddfaada7043 ]]
            git apply --reverse --check "$patch_path"
            git apply --reverse "$patch_path"
            [[ "$(shasum -a 256 "$target" | awk '{ print $1 }')" == e04f2523419e67ee34ba8dc814ec4fa53cabf5a3eca230597de07fc245a37451 ]]
            echo 'navigation_overlay_cleanup=verified-original-source-restored' >> "$EVIDENCE_DIR/preflight.txt"
          fi
          git diff --quiet "$EXPECTED_SOURCE_SHA" --
          git diff --cached --quiet "$EXPECTED_SOURCE_SHA" --
          mkdir -p "$EVIDENCE_DIR"
          git status --porcelain --untracked-files=all > "$EVIDENCE_DIR/source-final-status.txt"
          [[ ! -s "$EVIDENCE_DIR/source-final-status.txt" ]]
          echo "source_post_build_sha=$actual_sha" >> "$EVIDENCE_DIR/preflight.txt"

      - name: Upload source, toolchain, logs, and xcresult evidence
        if: ${{ always() }}
