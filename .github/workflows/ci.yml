        run: |
          set -euo pipefail
          python3 -I -S - "$PR130115_QA_ROOT/default.log" "$PR130115_QA_ROOT/lifecycle.jsonl" <<'PY'
          import json
          import pathlib
          import sys
          schema = {
              "shutdown.capture": {"transport", "active"},
              "factory.returned": {"current"},
              "transport.published": set(),
              "close.enter": {"already"},
              "close.already-closing-return": set(),
              "process.await-completed": set(),
              "helper.gone-sample": {"gone"},
          }
          records = []
          prefix = "[pr130115-mlx-trace] "
          with pathlib.Path(sys.argv[1]).open(encoding="utf-8", errors="strict") as stream:
              for line in stream:
                  if prefix not in line:
                      continue
                  payload = line.split(prefix, 1)[1].strip()
                  if len(payload) > 256:
                      raise SystemExit("Trace record exceeds the fixed payload bound")
                  record = json.loads(payload)
                  event = record.get("event") if isinstance(record, dict) else None
                  if event not in schema or set(record) != {"event"} | schema[event]:
                      raise SystemExit("Unexpected trace shape")
                  if any(type(record[field]) is not bool for field in schema[event]):
                      raise SystemExit("Trace contains a non-boolean field")
                  records.append(record)
                  if len(records) > 64:
                      raise SystemExit("Trace exceeds 64 records; interpretation is incomplete")
          if sum(record["event"] == "helper.gone-sample" for record in records) != 1:
              raise SystemExit("Expected one unchanged helper-gone sample")
          if not any(record["event"] == "shutdown.capture" for record in records):
              raise SystemExit("Missing shutdown capture")
          factories = [record for record in records if record["event"] == "factory.returned"]
          captures = [record for record in records if record["event"] == "shutdown.capture"]
          closes = [record for record in records if record["event"] == "close.enter"]
          if len(factories) != 1 or len(captures) < 2 or not closes:
              raise SystemExit("Missing or ambiguous core lifecycle records")
          published = sum(record["event"] == "transport.published" for record in records)
          completed = sum(record["event"] == "process.await-completed" for record in records)
          already_returns = sum(record["event"] == "close.already-closing-return" for record in records)
          if published != int(factories[0]["current"]):
              raise SystemExit("Publication trace is incomplete or ambiguous")
          if completed != sum(not record["already"] for record in closes):
              raise SystemExit("Process completion trace is incomplete or ambiguous")
          if already_returns != sum(record["already"] for record in closes):
              raise SystemExit("Concurrent-close trace is incomplete or ambiguous")
          pathlib.Path(sys.argv[2]).write_text(
              "".join(json.dumps(record, sort_keys=True) + "\n" for record in records),
              encoding="utf-8",
          )
          print(f"Validated {len(records)} synthetic records; a passing trace remains inconclusive")
          PY

      - name: Record all outcomes, pristine source, counts, and launcher cleanup
        id: receipt
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          ASSETS_OUTCOME: ${{ steps.assets.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          OVERLAY_OUTCOME: ${{ steps.overlay.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          TRACE_OUTCOME: ${{ steps.trace.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          qa_root="${PR130115_QA_ROOT:-$RUNNER_TEMP/pr130115-mlx-diagnostic/$QA_LABEL}"
          mkdir -p "$qa_root"
          printf '%s\n' \
            "checkout=$CHECKOUT_OUTCOME" "initialize=$INITIALIZE_OUTCOME" "node=$NODE_OUTCOME" \
            "toolchain=$TOOLCHAIN_OUTCOME" "dependencies=$DEPENDENCIES_OUTCOME" "assets=$ASSETS_OUTCOME" \
            "build=$BUILD_OUTCOME" "inventory=$INVENTORY_OUTCOME" "native=$NATIVE_OUTCOME" \
            "overlay=$OVERLAY_OUTCOME" "restore=$RESTORE_OUTCOME" "trace=$TRACE_OUTCOME" > "$qa_root/outcomes.txt"
          git status --porcelain --untracked-files=all > "$qa_root/status-after.txt" 2>&1 || true
          git diff --binary > "$qa_root/tracked-diff-after.patch" 2>&1 || true
          find -H /tmp -maxdepth 1 -type d -name 'oc-test-*' -print | LC_ALL=C sort > "$qa_root/native-resources-after.txt"
          if [[ -f "$qa_root/native-resources-before.txt" ]]; then
            comm -13 "$qa_root/native-resources-before.txt" "$qa_root/native-resources-after.txt" > "$qa_root/native-resources-retained.txt"
          fi
          if [[ -f "$qa_root/default.log" ]]; then
            LC_ALL=C grep -E 'Test run with [0-9]+ tests|Test run with [0-9]+ test|Executed [0-9]+ tests|recorded an issue|failed after|Swift exited 0 without valid test completion|retained resources|delete-keychain failed' \
              "$qa_root/default.log" > "$qa_root/result-lines.txt" || true
          fi
          if [[ -f "$qa_root/source-sha256.txt" ]]; then
            shasum -a 256 --check "$qa_root/source-sha256.txt" > "$qa_root/source-check-after.txt" 2>&1
          fi
          test "$OVERLAY_OUTCOME" = success
          test "$RESTORE_OUTCOME" = success
          test "$TRACE_OUTCOME" = success
          test "$NATIVE_OUTCOME" = success
          test ! -s "$qa_root/status-after.txt"
          test -f "$qa_root/native-resources-retained.txt"
          test ! -s "$qa_root/native-resources-retained.txt"

      - name: Upload paired evidence even when a phase fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr130115-mlx-diagnostic-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr130115-mlx-diagnostic/${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
