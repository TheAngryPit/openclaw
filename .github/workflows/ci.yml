name: PR 158051 Terminal survivor proof
run-name: Terminal survivors ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen test-only product commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  terminal-survivors:
    if: ${{ github.repository == 'TheAngryPit/openclaw' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qa/pr158051-terminal-hooks-proof-20261012' && inputs.candidate_sha == '0dd36bb2b48e09650723414a5626ab96327b5ad6' }}
    runs-on: xcode-27
    timeout-minutes: 150
    concurrency:
      group: pr158051-terminal-survivors-20261012
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      EXPECTED_SOURCE_SHA: 0dd36bb2b48e09650723414a5626ab96327b5ad6
      INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      QA_TOOLING_DIR: ${{ github.workspace }}/apps/ios/build/terminal-qa-tools-${{ github.run_id }}-${{ github.run_attempt }}
      SELECTED_TEST: OpenClawTests/TerminalHubScreenTests

    steps:
      - name: Verify the unique request and hosted runner
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/pr158051-terminal-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          DERIVED_DATA="$RUNNER_TEMP/pr158051-terminal-derived-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          RESULT_BUNDLE="$RUNNER_TEMP/pr158051-terminal-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.xcresult"
          printf 'EVIDENCE_DIR=%s\nDERIVED_DATA=%s\nRESULT_BUNDLE=%s\n' "$EVIDENCE_DIR" "$DERIVED_DATA" "$RESULT_BUNDLE" >> "$GITHUB_ENV"
          [[ "$GITHUB_REPOSITORY" == "TheAngryPit/openclaw" ]]
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/qa/pr158051-terminal-hooks-proof-20261012" ]]
          [[ "$INPUT_CANDIDATE_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" && "$RUNNER_OS" == "macOS" ]]
          [[ "$(uname -m)" == "arm64" ]]
          [[ ! -e "$EVIDENCE_DIR" && ! -e "$DERIVED_DATA" && ! -e "$RESULT_BUNDLE" ]]
          mkdir -p "$EVIDENCE_DIR"
          {
            printf 'source_sha=%s\nworkflow_sha=%s\nworkflow_ref=%s\n' "$EXPECTED_SOURCE_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_WORKFLOW_REF"
            printf 'run_id=%s\nrun_attempt=%s\nrunner_environment=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_ENVIRONMENT"
            printf 'runner_label=xcode-27\nrunner_os=%s\nrunner_arch=%s\n' "$RUNNER_OS" "$(uname -m)"
            printf 'runner_image_os=%s\nrunner_image_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf 'selected_test=%s\n' "$SELECTED_TEST"
          } > "$EVIDENCE_DIR/provenance.txt"

      - name: Checkout the frozen product without persisted credentials
        id: checkout-source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: 0dd36bb2b48e09650723414a5626ab96327b5ad6
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Checkout the exact QA inventory separately
        id: checkout-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: apps/ios/build/terminal-qa-tools-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          sparse-checkout: |
            qa/pr158051-terminal-survivors-20261012
          sparse-checkout-cone-mode: true

      - name: Verify product and inventory provenance
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$(git -C "$QA_TOOLING_DIR" rev-parse HEAD)" == "$GITHUB_WORKFLOW_SHA" ]]
          [[ "$(git -C "$QA_TOOLING_DIR" rev-parse HEAD^)" == "$EXPECTED_SOURCE_SHA" ]]
          git diff --quiet "$EXPECTED_SOURCE_SHA" --
          git diff --cached --quiet "$EXPECTED_SOURCE_SHA" --
          git status --porcelain --untracked-files=all > "$EVIDENCE_DIR/source-before.txt"
          [[ ! -s "$EVIDENCE_DIR/source-before.txt" ]]
          cp "$QA_TOOLING_DIR/qa/pr158051-terminal-survivors-20261012/expected.json" "$EVIDENCE_DIR/expected.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = pathlib.Path(os.environ["EVIDENCE_DIR"])
          manifest = json.loads((evidence / "expected.json").read_text())
          assert manifest["sourceSha"] == os.environ["EXPECTED_SOURCE_SHA"]
          assert manifest["sourceParent"] == "28bc2cf00eb237ffafa0237c2bbe95e2167a74d9"
          assert len(manifest["cases"]) == 16 and len(set(manifest["cases"])) == 16
          source = (root / "apps/ios/Tests/TerminalHubScreenTests.swift").read_text()
          pattern = r"@Test func " + chr(96) + r"([^" + chr(96) + r"]+)" + chr(96) + r"\(\)"
          declared = re.findall(pattern, source)
          assert {"TerminalHubScreenTests/" + name + "()" for name in declared} == set(manifest["cases"])
          inputs = {}
          for entry in manifest["inputs"]:
              path = entry["path"]
              actual = hashlib.sha256((root / path).read_bytes()).hexdigest()
              assert actual == entry["sha256"], "Source hash mismatch: " + path
              blob = subprocess.check_output(["git", "rev-parse", "HEAD:" + path], text=True).strip()
              assert blob == entry["blob"], "Source blob mismatch: " + path
              inputs[path] = actual
          (evidence / "source-inputs-before.json").write_text(json.dumps(inputs, indent=2, sort_keys=True) + "\n")
          PY
          shasum -a 256 "$EVIDENCE_DIR/expected.json" >> "$EVIDENCE_DIR/provenance.txt"

      - name: Setup the source-pinned Node and pnpm environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          cache-mode: "off"
          install-bun: "false"
          install-deps: "false"

      - name: Install the canonical native asset dependencies
        run: >-
          pnpm install --frozen-lockfile --prefer-offline --optional
          --filter '@openclaw/mermaid-renderer...'
          --filter '@openclaw/gateway-protocol...'
          --config.ignore-scripts=false
          --config.engine-strict=false
          --config.enable-pre-post-scripts=true
          --config.side-effects-cache=true

      - name: Select pinned Apple tools and one simulator
        id: simulator
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
          require_swift_toolchain
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          [[ "$xcode_version" == 27.* ]]
          swift_tools_dir="$RUNNER_TEMP/pr158051-terminal-swift-tools"
          scripts/install-xcodegen.sh "$swift_tools_dir"
          scripts/install-swift-tools.sh "$swift_tools_dir"
          export PATH="$swift_tools_dir:$HOME/.cargo/bin:$PATH"
          echo "$swift_tools_dir" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          [[ "$(xcodegen --version)" == "Version: 2.46.0" ]]
          [[ "$(swiftformat --version)" == "0.63.0" ]]
          [[ "$(swiftlint version)" == "0.65.1" ]]
          [[ "$(node --version)" == "v24.21.0" ]]
          package_manager="$(node -p 'require("./package.json").packageManager')"
          pnpm_expected="${package_manager#pnpm@}"
          pnpm_expected="${pnpm_expected%%+*}"
          [[ "$(pnpm --version)" == "$pnpm_expected" ]]
          watch_toolchain="$(awk -F '"' '/^channel =/ { print $2; exit }' apps/shared/OpenClawWatchRTC/rust-toolchain.toml)"
          test -n "$watch_toolchain"
          rustup toolchain install "$watch_toolchain" --profile minimal --component rust-src
          simulator_id="$(select_ios_test_simulator)"
          [[ "$simulator_id" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$simulator_id" -b
          simslim_dir="$RUNNER_TEMP/pr158051-terminal-simslim"
          scripts/install-simslim.sh "$simslim_dir"
          [[ "$("$simslim_dir/simslim" --version)" == "simslim 0.10.0" ]]
          OPENCLAW_CI_SIMSLIM_BINARY="$simslim_dir/simslim" scripts/ios-simulator-prepare.sh "$simulator_id"
          {
            xcodebuild -version
            swift --version
            printf 'node=%s\npnpm=%s\npackage_manager=%s\n' "$(node --version)" "$(pnpm --version)" "$package_manager"
            printf 'xcodegen=%s\nswiftformat=%s\nswiftlint=%s\n' "$(xcodegen --version)" "$(swiftformat --version)" "$(swiftlint version)"
            printf 'watch_rust_toolchain=%s\nsimslim=%s\nsimulator_id=%s\n' "$watch_toolchain" "$("$simslim_dir/simslim" --version)" "$simulator_id"
            xcrun simctl list devices available --json
          } > "$EVIDENCE_DIR/toolchain.txt"

      - name: Generate the canonical native inputs and real test product
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          run_apple_command_logged "$EVIDENCE_DIR/protocol.log" node scripts/prepare-native-protocol.mjs --language swift
          test -s apps/shared/OpenClawKit/.build/protocol/GatewayModels.swift
          shasum -a 256 apps/shared/OpenClawKit/.build/protocol/GatewayModels.swift > "$EVIDENCE_DIR/protocol.sha256"
          run_apple_command_logged "$EVIDENCE_DIR/mermaid.log" node scripts/prepare-apple-mermaid.mjs
          resources=apps/shared/OpenClawKit/Sources/OpenClawChatUI/Resources/Mermaid
          test -s "$resources/index.html"
          test -s "$resources/native.js"
          test -s "$resources/NOTICE.txt"
          find "$resources" -type f -print0 | sort -z | xargs -0 shasum -a 256 > "$EVIDENCE_DIR/mermaid.sha256"
          run_apple_command_logged "$EVIDENCE_DIR/project-generation.log" pnpm ios:gen
          test -d apps/ios/OpenClaw.xcodeproj
          git diff --quiet "$EXPECTED_SOURCE_SHA" --
          git diff --cached --quiet "$EXPECTED_SOURCE_SHA" --
          git status --porcelain --untracked-files=all > "$EVIDENCE_DIR/source-after-generation.txt"
          [[ ! -s "$EVIDENCE_DIR/source-after-generation.txt" ]]

      - name: Build the actual app-hosted Terminal test product
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          run_apple_command_logged "$EVIDENCE_DIR/build.log" python3 scripts/ci-xcodebuild.py \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:?}" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            -only-testing:"$SELECTED_TEST" \
            -showBuildTimingSummary \
            build-for-testing

      - name: Execute all sixteen Terminal survivors once
        id: terminal-test
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          started=$SECONDS
          run_apple_command_logged "$EVIDENCE_DIR/test.log" xcodebuild \
            -project apps/ios/OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID:?}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:"$SELECTED_TEST" \
            test-without-building
          printf 'test_command_wall_seconds=%s\n' "$((SECONDS-started))" >> "$EVIDENCE_DIR/provenance.txt"

      - name: Require every expected runtime identity to pass with zero skips
        id: terminal-verification
        if: ${{ always() && steps.terminal-test.outcome != 'skipped' && steps.terminal-test.outcome != 'cancelled' }}
        run: |
          set -euo pipefail
          test -d "$RESULT_BUNDLE"
          xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" --compact > "$EVIDENCE_DIR/xcresult-summary.json"
          xcrun xcresulttool get test-results tests --path "$RESULT_BUNDLE" > "$EVIDENCE_DIR/xcresult-tests.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          evidence = pathlib.Path(os.environ["EVIDENCE_DIR"])
          manifest = json.loads((evidence / "expected.json").read_text())
          summary = json.loads((evidence / "xcresult-summary.json").read_text())
          tests = json.loads((evidence / "xcresult-tests.json").read_text())
          assert summary.get("result") == "Passed"
          assert summary.get("totalTestCount") == 16 and summary.get("passedTests") == 16
          assert summary.get("failedTests") == 0 and summary.get("skippedTests") == 0
          assert summary.get("expectedFailures") == 0 and summary.get("testFailures") == []
          nodes = []
          pending = list(tests.get("testNodes", []))
          while pending:
              node = pending.pop()
              nodes.append(node)
              pending.extend(node.get("children", []))
          bundles = [node for node in nodes if node.get("nodeType") == "Unit test bundle"]
          assert len(bundles) == 1 and bundles[0].get("name") == manifest["bundle"]
          cases = [node for node in nodes if node.get("nodeType") == "Test Case"]
          identifiers = [node.get("nodeIdentifier") for node in cases]
          assert len(cases) == 16 and len(set(identifiers)) == 16
          assert set(identifiers) == set(manifest["cases"]), "Runtime survivor identities differ from frozen inventory"
          assert all(node.get("result") == "Passed" for node in cases)
          runs = summary.get("devicesAndConfigurations", [])
          simulator = os.environ["IOS_SIMULATOR_ID"]
          assert len(runs) == 1 and runs[0].get("device", {}).get("deviceId") == simulator
          configuration = runs[0].get("testPlanConfiguration", {}).get("configurationId")
          assert isinstance(configuration, str) and configuration
          assert len(tests.get("devices", [])) == 1 and tests["devices"][0].get("deviceId") == simulator
          assert len(tests.get("testPlanConfigurations", [])) == 1
          assert tests["testPlanConfigurations"][0].get("configurationId") == configuration
          for index, identifier in enumerate(sorted(identifiers)):
              raw = subprocess.check_output([
                  "xcrun", "xcresulttool", "get", "test-results", "test-details",
                  "--path", os.environ["RESULT_BUNDLE"], "--test-id", identifier,
              ], text=True)
              (evidence / f"case-{index:02d}.json").write_text(raw)
              details = json.loads(raw)
              assert details.get("testIdentifier") == identifier and details.get("testResult") == "Passed"
          receipt = {
              "result": "Passed", "sourceSha": manifest["sourceSha"],
              "workflowSha": os.environ["GITHUB_WORKFLOW_SHA"],
              "totalTestCount": 16, "passedTests": 16, "failedTests": 0,
              "skippedTests": 0, "expectedFailures": 0, "simulatorId": simulator,
              "configurationId": configuration, "identifiers": sorted(identifiers),
          }
          (evidence / "terminal-verification.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          PY
          cat "$EVIDENCE_DIR/terminal-verification.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify final source and tooling state and stop the hosted simulator
        if: ${{ always() && steps.checkout-source.outcome == 'success' && steps.checkout-tooling.outcome == 'success' }}
        run: |
          set -euo pipefail
          trap 'if [[ -n "${IOS_SIMULATOR_ID:-}" ]]; then xcrun simctl shutdown "$IOS_SIMULATOR_ID"; fi' EXIT
          mkdir -p "$EVIDENCE_DIR"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$(git -C "$QA_TOOLING_DIR" rev-parse HEAD)" == "$GITHUB_WORKFLOW_SHA" ]]
          git diff --quiet "$EXPECTED_SOURCE_SHA" --
          git diff --cached --quiet "$EXPECTED_SOURCE_SHA" --
          git status --porcelain --untracked-files=all > "$EVIDENCE_DIR/source-final-status.txt"
          git -C "$QA_TOOLING_DIR" status --porcelain --untracked-files=all > "$EVIDENCE_DIR/tooling-final-status.txt"
          [[ ! -s "$EVIDENCE_DIR/source-final-status.txt" && ! -s "$EVIDENCE_DIR/tooling-final-status.txt" ]]
          cmp "$QA_TOOLING_DIR/qa/pr158051-terminal-survivors-20261012/expected.json" "$EVIDENCE_DIR/expected.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence = pathlib.Path(os.environ["EVIDENCE_DIR"])
          manifest = json.loads((evidence / "expected.json").read_text())
          actual = {entry["path"]: hashlib.sha256((root / entry["path"]).read_bytes()).hexdigest() for entry in manifest["inputs"]}
          assert actual == {entry["path"]: entry["sha256"] for entry in manifest["inputs"]}
          (evidence / "source-inputs-final.json").write_text(json.dumps(actual, indent=2, sort_keys=True) + "\n")
          PY
          printf 'source_final_sha=%s\nsource_cleanup=clean\ntooling_cleanup=clean\n' "$EXPECTED_SOURCE_SHA" >> "$EVIDENCE_DIR/provenance.txt"

      - name: Upload the synthetic test logs, structured receipts and actual xcresult
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr158051-terminal-survivors-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr158051-terminal-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/pr158051-terminal-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
          if-no-files-found: error
          retention-days: 7
