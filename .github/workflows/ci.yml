          git status --porcelain --untracked-files=all >> "$MACCLI_QA_RECEIPT_DIR/provenance.txt"
      - name: Upload bounded synthetic native receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maccli-real-${{ matrix.label }}-${{ github.run_id }}
          path: ${{ runner.temp }}/maccli-real-qa-20261005/${{ matrix.label }}/*
