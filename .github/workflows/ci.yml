name: PR 140131 frozen native selection proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-selection:
    if: github.repository == 'TheAngryPit/openclaw' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qa/pr140131-native-selection-20261014'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      CI: "true"
      CANDIDATE_SHA: 76ee71b184badc806bcacc270f4764a00324ea7b
      NODE_VERSION: "24.21.0"
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: 76ee71b184badc806bcacc270f4764a00324ea7b
          persist-credentials: false
          fetch-depth: 2
      - name: Check product and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$GITHUB_REF" = refs/heads/qa/pr140131-native-selection-20261014
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = 2bb9018a35e3ac19712313f0d90b7be3832eb766
          test "$(git show -s --format=%P HEAD)" = '2ceab7b040d7212483c437a98a5275bd2a396574 a0436bfd284102ce43aee317a9ecf5276add7cf8'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          source scripts/lib/swift-toolchain.sh
          require_swift_toolchain
          mkdir -p "$RUNNER_TEMP/pr140131-native"
          {
            git rev-parse HEAD
            git status --short
            sw_vers
            xcodebuild -version
            swift --version
            git rev-parse HEAD:apps/macos/Sources/OpenClaw/CLIInstaller.swift
            git rev-parse HEAD:apps/macos/Tests/OpenClawIPCTests/CLIInstallerSelectionTests.swift
            git rev-parse HEAD:apps/macos/Tests/OpenClawIPCTests/CLIInstallerTests.swift
            git rev-parse HEAD:apps/macos/Tests/OpenClawIPCTests/CommandResolverTests.swift
            git rev-parse HEAD:scripts/test-macos-native.mts
            git rev-parse HEAD:scripts/lib/swift-toolchain.sh
            git rev-parse HEAD:apps/macos/Package.swift
            git rev-parse HEAD:pnpm-lock.yaml
          } > "$RUNNER_TEMP/pr140131-native/provenance.txt"
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          cache-mode: "off"
          install-bun: "false"
          install-deps: "false"
      - name: Prepare canonical native asset dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prefer-offline --optional \
            --filter '@openclaw/mermaid-renderer...' \
            --filter '@openclaw/gateway-protocol...' \
            --config.ignore-scripts=false \
            --config.engine-strict=false \
            --config.enable-pre-post-scripts=true \
            --config.side-effects-cache=true
          node scripts/prepare-apple-mermaid.mjs
          node scripts/check-native-state-schema-version.mjs
      - name: Build and exercise existing native owners
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          native_args=(--package-path apps/macos --build-system native --enable-code-coverage --disable-index-store -Xswiftc -gline-tables-only)
          run_apple_command_logged "$RUNNER_TEMP/pr140131-native/build.log" swift build "${native_args[@]}" --build-tests
          logical_cpu="$(sysctl -n hw.logicalcpu)"
          [[ "$logical_cpu" =~ ^[1-9][0-9]*$ ]]
          test_width=$(( logical_cpu < 12 ? logical_cpu : 12 ))
          run_apple_command_logged "$RUNNER_TEMP/pr140131-native/tests.log" \
            node scripts/test-macos-native.mts default "${native_args[@]}" \
            --skip-build --experimental-maximum-parallelization-width "$test_width" \
            --filter 'CLIInstallerSelectionTests|CLIInstallerTests|CommandResolverTests'
          test_log="$RUNNER_TEMP/pr140131-native/tests.log"
          if grep -Ei '(Test|Suite).* skipped|[1-9][0-9]* tests? skipped' "$test_log"; then exit 1; fi
          grep -E 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed' "$test_log"
          test "$(grep -E 'Test .* passed after' "$test_log" | grep -v 'Test run with' | wc -l | tr -d ' ')" = 56
          while IFS='|' read -r test_name case_count; do
            grep -E "$test_name.*with $case_count test cases passed" "$test_log"
          done <<'CASE_INVENTORY'
          managed update selects its CLI only after successful verification|2
          service update preserves selection when canonical verification cannot select its CLI|3
          stale managed update preserves a runtime advanced by the CLI|2
          matching external CLI with an unusable Node runtime needs repair|2
          successful CLI setup starts the local gateway and waits for readiness|2
          local service resolution selects the profile at the CLI root|3
          CASE_INVENTORY
      - name: Retain and require clean final source state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr140131-native"
          printf 'workflow_sha=%s\nworkflow_ref=%s\nqa_sha=%s\nqa_ref=%s\nrun_id=%s\nrun_attempt=%s\nrepository=%s\n' "$GITHUB_WORKFLOW_SHA" "$GITHUB_WORKFLOW_REF" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REPOSITORY" >> "$RUNNER_TEMP/pr140131-native/provenance.txt"
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            printf '%s\n' 'Source checkout unavailable' > "$RUNNER_TEMP/pr140131-native/source-after.txt"
            exit 1
          fi
          final_source_sha="$(git rev-parse HEAD)"
          printf 'final_source_sha=%s\n' "$final_source_sha" >> "$RUNNER_TEMP/pr140131-native/provenance.txt"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/pr140131-native/source-after.txt"
          test "$final_source_sha" = "$CANDIDATE_SHA"
          cat "$RUNNER_TEMP/pr140131-native/source-after.txt"
          test ! -s "$RUNNER_TEMP/pr140131-native/source-after.txt"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain proof logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr140131-native-selection-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr140131-native/provenance.txt
            ${{ runner.temp }}/pr140131-native/build.log
            ${{ runner.temp }}/pr140131-native/tests.log
            ${{ runner.temp }}/pr140131-native/source-after.txt
          if-no-files-found: error
