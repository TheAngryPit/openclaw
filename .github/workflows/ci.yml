name: CI
run-name: PR164607 current Solid Profile qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full product candidate commit to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr164607-solid-proof-${{ github.workflow }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  profile-proof:
    if: github.repository == 'TheAngryPit/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - variant: baseline
            product_sha: d79ab6195d8d0566b285008bcc30c01a6ce368e2
          - variant: candidate
            product_sha: ${{ inputs.candidate_sha }}
    defaults:
      run:
        shell: bash
        working-directory: product
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NODE_VERSION: "24.22.1"
      PNPM_CONFIG_FROZEN_LOCKFILE: "true"
      OPENCLAW_CAPTURE_UI_PROOF: "1"
      OPENCLAW_PROFILE_QA_VARIANT: ${{ matrix.variant }}
      OPENCLAW_PROFILE_QA_PRODUCT_SHA: ${{ matrix.product_sha }}
      OPENCLAW_PROFILE_QA_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      OPENCLAW_PROFILE_QA_BASELINE_SHA: d79ab6195d8d0566b285008bcc30c01a6ce368e2
      OPENCLAW_PROFILE_QA_OLD_QA_SHA: ceba1804295df7407fbd42241163d70dcda35d11
      OPENCLAW_PROFILE_QA_PREP_SHA: 189c1b7746bfa885911def0c98bb25348f6dc72f
      OPENCLAW_PROFILE_QA_PREVIOUS_QA_SHA: 98db122db4cf368d5b6f2d4780a21444fa5783ac
      OPENCLAW_PROFILE_QA_HARNESS_SHA: ${{ github.sha }}
    steps:
      - name: Checkout reviewed QA integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 4
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: ${{ matrix.product_sha }}
          path: product
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source and overlay ancestry
        run: |
          set -euo pipefail
          [[ "$OPENCLAW_PROFILE_QA_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPENCLAW_PROFILE_QA_PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$OPENCLAW_PROFILE_QA_BASELINE_SHA" = d79ab6195d8d0566b285008bcc30c01a6ce368e2
          test "$OPENCLAW_PROFILE_QA_OLD_QA_SHA" = ceba1804295df7407fbd42241163d70dcda35d11
          test "$OPENCLAW_PROFILE_QA_PREP_SHA" = 189c1b7746bfa885911def0c98bb25348f6dc72f
          test "$OPENCLAW_PROFILE_QA_PREVIOUS_QA_SHA" = 98db122db4cf368d5b6f2d4780a21444fa5783ac
          test "$OPENCLAW_PROFILE_QA_HARNESS_SHA" = "$(git -C .. rev-parse HEAD)"
          test "$OPENCLAW_PROFILE_QA_PRODUCT_SHA" = "$(git rev-parse HEAD)"
          test "$OPENCLAW_PROFILE_QA_CANDIDATE_SHA" = "$(git -C .. rev-parse HEAD^1)"
          test "$OPENCLAW_PROFILE_QA_PREVIOUS_QA_SHA" = "$(git -C .. rev-parse HEAD^2)"
          test "$OPENCLAW_PROFILE_QA_OLD_QA_SHA" = "$(git -C .. rev-parse "$OPENCLAW_PROFILE_QA_PREP_SHA^1")"
          git -C .. merge-base --is-ancestor "$OPENCLAW_PROFILE_QA_PREP_SHA" "$OPENCLAW_PROFILE_QA_PREVIOUS_QA_SHA"
          git -C .. merge-base --is-ancestor "$OPENCLAW_PROFILE_QA_OLD_QA_SHA" "$OPENCLAW_PROFILE_QA_PREVIOUS_QA_SHA"
          git -C .. diff --exit-code "$OPENCLAW_PROFILE_QA_OLD_QA_SHA" "$OPENCLAW_PROFILE_QA_PREP_SHA" -- . ':(exclude).github/workflows/ci.yml' ':(exclude)qa/pr164607-owner61-proof-20261012'
          git -C .. diff --exit-code "$OPENCLAW_PROFILE_QA_CANDIDATE_SHA" HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)qa/pr164607-owner61-proof-20261012'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object .github/actions/setup-node-env/action.yml)" = "$(git rev-parse HEAD:.github/actions/setup-node-env/action.yml)"
          test "$(git hash-object .github/actions/setup-pnpm-store-cache/action.yml)" = "$(git rev-parse HEAD:.github/actions/setup-pnpm-store-cache/action.yml)"
          printf 'OPENCLAW_UI_E2E_ARTIFACT_DIR=%s\nOPENCLAW_UI_E2E_DIAGNOSTIC_DIR=%s\n' "$RUNNER_TEMP/pr164607-$OPENCLAW_PROFILE_QA_VARIANT" "$RUNNER_TEMP/pr164607-$OPENCLAW_PROFILE_QA_VARIANT-diagnostics" >> "$GITHUB_ENV"
      - name: Select exact Node 24.22.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Setup source-owned Node and dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.1"
          install-bun: "false"
          install-deps: "false"
          cache-mode: "off"
          dependency-cache: "false"
          frozen-lockfile: "true"
      - name: Verify candidate-pinned package manager and browser package
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = "$NODE_VERSION"
          package_manager="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')"
          [[ "$package_manager" =~ ^pnpm@[0-9]+\.[0-9]+\.[0-9]+\+sha512\.[0-9a-f]{128}$ ]]
          package_manager_version="${package_manager#pnpm@}"
          package_manager_version="${package_manager_version%%+*}"
          test "$(corepack pnpm --version)" = "$package_manager_version"
          test "$(pnpm --version)" = "$package_manager_version"
          playwright_version="$(node -p 'require("./ui/package.json").devDependencies.playwright')"
          printf 'OPENCLAW_PROFILE_QA_PACKAGE_MANAGER=%s\nOPENCLAW_PROFILE_QA_PNPM_VERSION=%s\nOPENCLAW_PROFILE_QA_PLAYWRIGHT_VERSION=%s\n' "$package_manager" "$package_manager_version" "$playwright_version" >> "$GITHUB_ENV"
      - name: Install exact product dependencies through source owner
        working-directory: product
        env:
          DEPENDENCY_CACHE: "false"
          DEPENDENCY_CACHE_HIT: "false"
          FROZEN_LOCKFILE: "true"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OPENCLAW_PROFILE_QA_PRODUCT_SHA"
          test "$(node -p 'process.versions.node')" = "$NODE_VERSION"
          test "$(pnpm --version)" = "$OPENCLAW_PROFILE_QA_PNPM_VERSION"
          bash .github/actions/setup-node-env/install-dependencies.sh
          test -s node_modules/tsx/package.json
          test "$(node -p 'require("./ui/node_modules/playwright/package.json").version')" = "$OPENCLAW_PROFILE_QA_PLAYWRIGHT_VERSION"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Setup exact product Chromium through source owner
        working-directory: product
        run: node --import tsx scripts/ensure-playwright-chromium.mts --require-playwright-chromium
      - name: Build current runtime and Control UI
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
        run: pnpm build
      - name: Qualify Profile owner and browser lifecycle
        run: bash "$GITHUB_WORKSPACE/qa/pr164607-owner61-proof-20261012/run-profile-proof.sh"
      - name: Retain actual public synthetic receipts and media
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr164607-solid-${{ matrix.variant }}-${{ matrix.product_sha }}
          path: |
            ${{ runner.temp }}/pr164607-${{ matrix.variant }}/**/*.png
            ${{ runner.temp }}/pr164607-${{ matrix.variant }}/**/*.json
            ${{ runner.temp }}/pr164607-${{ matrix.variant }}/*.txt
            ${{ runner.temp }}/pr164607-${{ matrix.variant }}-diagnostics/**/failure.public.json
          if-no-files-found: error
          retention-days: 7
