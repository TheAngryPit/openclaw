          node scripts/prepare-apple-mermaid.mjs
          test -d apps/shared/OpenClawKit/Sources/OpenClawChatUI/Resources/Mermaid
          shasum -a 256 scripts/prepare-apple-mermaid.mjs >> "$MACCLI_QA_RECEIPT_DIR/harness-digests.txt"
          git diff --exit-code

      - name: Prepare official release provenance for native setup
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          node qa/maccli-real-distribution-qa-20261005/prepare.mjs manifest --repo-root "$PWD" --receipt-dir "$MACCLI_QA_RECEIPT_DIR" --sidecar-root "$GITHUB_WORKSPACE/harness/qa/maccli-real-distribution-qa-20261005" --product-sha "$PRODUCT_SHA"
      - name: Compile exact native owners and sidecar without app launch
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path apps/macos --build-system native --build-tests --jobs 2 --disable-index-store -Xswiftc -gline-tables-only
      - name: Run canonical native launcher and classify real outcomes
        working-directory: product
