name: Temporary native identity UI proof
run-name: Identity UI proof ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact published product commit to verify
        required: true
        type: string
      proof_kind:
        description: Existing Profile fixture or isolated matched comparison
        required: true
        default: profile
        type: choice
        options:
          - profile
          - operator
          - profile-comparison
          - tailscale-paired
          - tailscale-current
      operator_variant:
        description: Explicit provenance label for matched comparisons
        required: true
        default: candidate
        type: choice
        options:
          - baseline
          - candidate

permissions:
  contents: read

jobs:
  profile-proof:
    if: github.repository == 'TheAngryPit/openclaw' && inputs.proof_kind == 'profile'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
      OPENCLAW_BUILD_PRIVATE_QA: "1"
      OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
      OPENCLAW_CAPTURE_UI_PROOF: "1"
    steps:
      - name: Validate pinned candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact product commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Verify source identity
        shell: bash
        env:
          OPENCLAW_UI_E2E_ARTIFACT_DIR: ${{ runner.temp }}/profile-proof
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: ${{ runner.temp }}/profile-diagnostics
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          printf 'OPENCLAW_UI_E2E_ARTIFACT_DIR=%s\nOPENCLAW_UI_E2E_DIAGNOSTIC_DIR=%s\n' "$OPENCLAW_UI_E2E_ARTIFACT_DIR" "$OPENCLAW_UI_E2E_DIAGNOSTIC_DIR" >> "$GITHUB_ENV"
          mkdir -p "$OPENCLAW_UI_E2E_ARTIFACT_DIR"
          printf 'candidate_sha=%s\nworkflow_sha=%s\n' "$CANDIDATE_SHA" "$PROOF_WORKFLOW_SHA" > "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"

      - name: Install pinned package manager and candidate dependencies
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (typeof p.packageManager !== "string" || p.packageManager.split("+")[0] !== "pnpm@12.5.1") throw new Error("Unexpected candidate package manager");'
          npm install --global pnpm@12.5.1
          test "$(pnpm --version)" = "12.5.1"
          printf 'node=%s\npnpm=%s\n' "$(node --version)" "$(pnpm --version)" >> "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"
          pnpm install --frozen-lockfile
          node --import tsx scripts/ensure-playwright-chromium.mts --require-playwright-chromium

      - name: Build exact candidate for incumbent prebuilt verification
        run: pnpm build

      - name: Run actual Gateway Profile composition test
        shell: bash
        run: |
          set -uo pipefail
          start_seconds=$SECONDS
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e-prebuilt.config.ts --configLoader runner --reporter verbose ui/src/e2e/profile-page.real-gateway.e2e.test.ts
          test_result=$?
          printf 'test_exit=%s\ntest_seconds=%s\n' "$test_result" "$((SECONDS-start_seconds))" >> "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"
          exit "$test_result"

      - name: Require actual captured Profile media
        shell: bash
        run: |
          set -euo pipefail
          captured=0
          for proof_directory in "$OPENCLAW_UI_E2E_ARTIFACT_DIR"/control-ui-profile-page-real-gateway-e2e-*; do
            if test -s "$proof_directory/01-real-gateway-authenticated-profile.png" && test -s "$proof_directory/02-real-gateway-cleared-profile.png"; then
              captured=1
              break
            fi
          done
          test "$captured" = 1
          printf 'required_profile_media=present\n' >> "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"

      - name: Upload only synthetic media and bounded receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: identity-profile-proof-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/profile-proof/**/*.png
            ${{ runner.temp }}/profile-proof/receipt.txt
            ${{ runner.temp }}/profile-diagnostics/failure-*/failure.public.json
          if-no-files-found: error
          retention-days: 7
  tailscale-current-main-verification:
    if: github.repository == 'TheAngryPit/openclaw' && inputs.proof_kind == 'tailscale-current'
    name: Current-main native identity verification (${{ matrix.label }})
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: current
            revision: 706c6fccf7596f67f0504664bb3a74d7833dad65
    env:
      DIAGNOSTIC_LABEL: ${{ matrix.label }}
      DIAGNOSTIC_REVISION: ${{ matrix.revision }}
      DIAGNOSTIC_WORKFLOW_SHA: ${{ github.workflow_sha }}
      EXPECTED_PACKAGE_MANAGER: pnpm@12.5.1+sha512.e3f305bc784a2bc89f5ad3b6138889470fae8d2af5f36b61216ec91c2c3d64089775f9de38aac331044ea40f245cb0d5666392dfdf65824e1907ef6a2c62de5f
      OPENCLAW_CAPTURE_UI_PROOF: "0"
      INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Validate the exact integrated candidate input
        shell: bash
        run: |
          set -euo pipefail
          test "$INPUT_CANDIDATE_SHA" = "$DIAGNOSTIC_REVISION"

      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false

      - name: Initialize external receipt and verify pristine checkout
        shell: bash
        run: |
          set -euo pipefail
          qa_root="$RUNNER_TEMP/tailscale-current-qa-20261005/$DIAGNOSTIC_LABEL"
          mkdir -p "$qa_root/receipt" "$qa_root/diagnostics" "$qa_root/artifacts"
          printf 'OPENCLAW_QA_ROOT=%s\n' "$qa_root" >> "$GITHUB_ENV"
          printf 'OPENCLAW_UI_E2E_ARTIFACT_DIR=%s\n' "$qa_root/artifacts" >> "$GITHUB_ENV"
          printf 'OPENCLAW_UI_E2E_DIAGNOSTIC_DIR=%s\n' "$qa_root/diagnostics" >> "$GITHUB_ENV"
          status="$(git status --porcelain --untracked-files=all)"
          {
            printf 'label=%s\nrevision_expected=%s\nrevision_actual=' "$DIAGNOSTIC_LABEL" "$DIAGNOSTIC_REVISION"
            git rev-parse HEAD
            printf 'workflow_sha=%s\nsource_status_before=<%s>\n' "$DIAGNOSTIC_WORKFLOW_SHA" "$status"
          } > "$qa_root/receipt/checkout.txt"
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_REVISION"
          test -z "$status"

      - name: Setup pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Activate exact packageManager and install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node -p "require('./package.json').packageManager")"
          test "$package_manager" = "$EXPECTED_PACKAGE_MANAGER"
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          corepack enable
          corepack prepare "$package_manager" --activate
          test "$(node --version)" = v24.19.0
          test "$(pnpm --version)" = 12.5.1
          pnpm install --frozen-lockfile

      - name: Write the pinned include inventory outside the product checkout
        shell: bash
        run: |
          set -euo pipefail
          cat > "$OPENCLAW_QA_ROOT/receipt/include.json" <<'JSON'
          [
            "ui/src/e2e/chat-flow.catalog-bootstrap.e2e.test.ts",
            "ui/src/e2e/worker-initial-setup.real-gateway.e2e.test.ts",
            "ui/src/e2e/agent-file-lifecycle.real-gateway.e2e.test.ts",
            "ui/src/e2e/chat-composer-websearch-kill-switch.real-gateway.e2e.test.ts",
            "ui/src/e2e/chat-agent-avatar.real-gateway.e2e.test.ts",
            "ui/src/e2e/chat-stop-finished-run.real-gateway.e2e.test.ts",
            "ui/src/e2e/chat-thinking-metadata.real-gateway.e2e.test.ts",
            "ui/src/e2e/control-ui-auth-transports.e2e.test.ts",
            "ui/src/e2e/device-alias-rename.real-gateway.e2e.test.ts",
            "ui/src/e2e/logs-lifecycle.e2e.test.ts",
            "ui/src/e2e/model-picker-search.real-gateway.e2e.test.ts",
            "ui/src/e2e/profile-page.real-gateway.e2e.test.ts",
            "ui/src/e2e/session-progress-hovercard.real-gateway.e2e.test.ts"
          ]
          JSON
          printf 'OPENCLAW_VITEST_INCLUDE_FILE=%s\n' "$OPENCLAW_QA_ROOT/receipt/include.json" >> "$GITHUB_ENV"
          sha256sum "$OPENCLAW_QA_ROOT/receipt/include.json" > "$OPENCLAW_QA_ROOT/receipt/include.sha256"

      - name: Install the revision-pinned Playwright Chromium
        shell: bash
        run: node --import tsx scripts/ensure-playwright-chromium.mts --require-playwright-chromium

      - name: Build runtime and Control UI from the exact revision
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
        run: pnpm build

      - name: Capture source, toolchain, lock, and runner receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          qa_root="${OPENCLAW_QA_ROOT:-$RUNNER_TEMP/tailscale-current-qa-20261005/$DIAGNOSTIC_LABEL}"
          mkdir -p "$qa_root/receipt"
          head_sha='<checkout-unavailable>'
          status='<checkout-unavailable>'
          if git rev-parse --git-dir >/dev/null 2>&1; then
            head_sha="$(git rev-parse HEAD)"
            status="$(git status --porcelain --untracked-files=all)"
          fi
          blob_of() {
            git rev-parse "HEAD:$1" 2>/dev/null || printf '<unavailable>\n'
          }
          package_manager='<unavailable>'
          if [[ -f package.json ]] && command -v node >/dev/null 2>&1; then
            package_manager="$(node -p "require('./package.json').packageManager" 2>/dev/null || printf '<unavailable>')"
          fi
          node_version='<unavailable>'
          if command -v node >/dev/null 2>&1; then node_version="$(node --version)"; fi
          pnpm_version='<unavailable>'
          if command -v pnpm >/dev/null 2>&1; then pnpm_version="$(pnpm --version 2>/dev/null || printf '<unavailable>')"; fi
          {
            printf 'label=%s\nrevision_expected=%s\nrevision_actual=%s\n' "$DIAGNOSTIC_LABEL" "$DIAGNOSTIC_REVISION" "$head_sha"
            printf 'workflow_sha=%s\nsource_status_before_test=<%s>\n' "$DIAGNOSTIC_WORKFLOW_SHA" "$status"
            printf 'workflow_blob=%s\n' "$(blob_of .github/workflows/ci.yml)"
            printf 'prebuilt_config_blob=%s\n' "$(blob_of test/vitest/vitest.ui-e2e-prebuilt.config.ts)"
            printf 'e2e_config_blob=%s\n' "$(blob_of test/vitest/vitest.ui-e2e.config.ts)"
            printf 'include_parser_blob=%s\n' "$(blob_of test/vitest/vitest.pattern-file.ts)"
            printf 'runner_script_blob=%s\n' "$(blob_of scripts/run-vitest.mjs)"
            printf 'chromium_installer_blob=%s\n' "$(blob_of scripts/ensure-playwright-chromium.mts)"
            printf 'lock_blob=%s\n' "$(blob_of pnpm-lock.yaml)"
            printf 'package_manager=%s\nnode=%s\npnpm=%s\n' "$package_manager" "$node_version" "$pnpm_version"
            printf 'playwright='; if command -v pnpm >/dev/null 2>&1 && pnpm --dir ui exec playwright --version; then :; else printf '<unavailable>\n'; fi
            printf 'os_release:\n'; cat /etc/os-release
            printf 'kernel='; uname -a
            printf 'logical_cpus='; getconf _NPROCESSORS_ONLN
            printf 'memory='; awk '/MemTotal/ {print $2 " kB"}' /proc/meminfo
            printf 'workspace_disk='; df -B1 --output=size,avail . | tail -n 1
            if [[ -f pnpm-lock.yaml ]]; then printf 'lock_sha256='; sha256sum pnpm-lock.yaml; else printf 'lock_sha256=<unavailable>\n'; fi
            include_file="${OPENCLAW_VITEST_INCLUDE_FILE:-$qa_root/receipt/include.json}"
            if [[ -f "$include_file" ]]; then
              printf 'include_sha256='; sha256sum "$include_file"
            else
              printf 'include_sha256=<not-created>\n'
            fi
          } > "$qa_root/receipt/pre-test.txt"
          if [[ "$head_sha" != '<checkout-unavailable>' ]]; then
            test "$head_sha" = "$DIAGNOSTIC_REVISION"
            test -z "$status"
          fi

      - name: Run the owning placement admission and reader regressions
        id: run_placement_owners
        env:
          OPENCLAW_VITEST_INCLUDE_FILE: ""
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.gateway.config.ts \
            --configLoader runner --reporter verbose --maxWorkers 2 \
            src/gateway/worker-environments/worker-turn-launcher-initial-setup.test.ts \
            src/gateway/worker-environments/placement-read-projection.worker.test.ts

      - name: Run the affected native browser authentication tests
        id: run_native_auth
        env:
          OPENCLAW_VITEST_INCLUDE_FILE: ""
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run \
            --config test/vitest/vitest.ui.config.ts \
            --configLoader runner --reporter verbose --maxWorkers 2 \
            ui/src/api/gateway-connect.node.test.ts \
            ui/src/app/native-gateway-auth.node.test.ts

      - name: Run the original inventory with the current strengthened fixture
        id: run_real_gateway
        shell: bash
        run: |
          set -euo pipefail
          config=test/vitest/vitest.ui-e2e-prebuilt.config.ts
          test -f "$config"
          node scripts/run-vitest.mjs run \
            --config "$config" \
            --configLoader runner \
            --reporter verbose \
            --reporter github-actions \
            --reporter default \
            --reporter ./scripts/lib/vitest-resource-reporter.mts \
            --maxWorkers 2 \
            --exclude ui/src/e2e/desktop-resize.real-gateway.e2e.test.ts

      - name: Record final source state and test outcome
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.run_real_gateway.outcome || 'not-run' }}
          PLACEMENT_OUTCOME: ${{ steps.run_placement_owners.outcome || 'not-run' }}
          NATIVE_AUTH_OUTCOME: ${{ steps.run_native_auth.outcome || 'not-run' }}
        shell: bash
        run: |
          set -euo pipefail
          qa_root="${OPENCLAW_QA_ROOT:-$RUNNER_TEMP/tailscale-current-qa-20261005/$DIAGNOSTIC_LABEL}"
          mkdir -p "$qa_root/receipt"
          head_sha='<checkout-unavailable>'
          status='<checkout-unavailable>'
          if git rev-parse --git-dir >/dev/null 2>&1; then
            head_sha="$(git rev-parse HEAD)"
            status="$(git status --porcelain --untracked-files=all)"
          fi
          {
            printf 'label=%s\nrevision_expected=%s\nrevision_actual=%s\n' "$DIAGNOSTIC_LABEL" "$DIAGNOSTIC_REVISION" "$head_sha"
            printf 'workflow_sha=%s\ntest_outcome=%s\nsource_status_after=<%s>\n' "$DIAGNOSTIC_WORKFLOW_SHA" "$TEST_OUTCOME" "$status"
            printf 'placement_regressions_outcome=%s\nnative_auth_tests_outcome=%s\n' "$PLACEMENT_OUTCOME" "$NATIVE_AUTH_OUTCOME"
          } > "$qa_root/receipt/final.txt"
          if [[ "$head_sha" != '<checkout-unavailable>' ]]; then
            test "$head_sha" = "$DIAGNOSTIC_REVISION"
            test -z "$status"
          fi

      - name: Upload bounded receipt and public failure summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tailscale-current-qa-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tailscale-current-qa-20261005/${{ matrix.label }}/receipt/**
            ${{ runner.temp }}/tailscale-current-qa-20261005/${{ matrix.label }}/diagnostics/failure-*/failure.public.json
          if-no-files-found: ignore
          retention-days: 7

  profile-comparison-proof:
    if: github.repository == 'TheAngryPit/openclaw' && inputs.proof_kind == 'profile-comparison'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      COMPARISON_VARIANT: ${{ inputs.operator_variant }}
      PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
      OPENCLAW_BUILD_PRIVATE_QA: "1"
      OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
      OPENCLAW_CAPTURE_UI_PROOF: "1"
    steps:
      - name: Validate exact matched source selection
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMPARISON_VARIANT" = baseline || "$COMPARISON_VARIANT" = candidate ]]
          if [[ "$COMPARISON_VARIANT" = baseline ]]; then
            test "$CANDIDATE_SHA" = e87ab44327c049ca6454550addb4a314048ee2fb
            printf 'OPENCLAW_PROFILE_COMPARISON_CHANNEL_STATE=absent\n' >> "$GITHUB_ENV"
          else
            test "$CANDIDATE_SHA" = ae51861738ec9a3095388a3ff64ba4a2a6220095
            printf 'OPENCLAW_PROFILE_COMPARISON_CHANNEL_STATE=empty\n' >> "$GITHUB_ENV"
          fi

      - name: Checkout exact product without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: ${{ inputs.candidate_sha }}
          path: product
          persist-credentials: false

      - name: Checkout reviewed capture fixture separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: ${{ github.workflow_sha }}
          path: qa-harness
          persist-credentials: false

      - name: Verify source and allocate bounded capture directories
        working-directory: product
        shell: bash
        env:
          OPENCLAW_UI_E2E_ARTIFACT_DIR: ${{ runner.temp }}/profile-comparison-proof
          OPENCLAW_UI_E2E_DIAGNOSTIC_DIR: ${{ runner.temp }}/profile-comparison-diagnostics
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C ../qa-harness rev-parse HEAD)" = "$PROOF_WORKFLOW_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'OPENCLAW_UI_E2E_ARTIFACT_DIR=%s\nOPENCLAW_UI_E2E_DIAGNOSTIC_DIR=%s\n' "$OPENCLAW_UI_E2E_ARTIFACT_DIR" "$OPENCLAW_UI_E2E_DIAGNOSTIC_DIR" >> "$GITHUB_ENV"
          mkdir "$OPENCLAW_UI_E2E_ARTIFACT_DIR"
          printf 'candidate_sha=%s\nworkflow_sha=%s\ncomparison_variant=%s\n' "$CANDIDATE_SHA" "$PROOF_WORKFLOW_SHA" "$COMPARISON_VARIANT" > "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"

      - name: Install exact product dependencies once
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (typeof p.packageManager !== "string" || p.packageManager.split("+")[0] !== "pnpm@12.5.1") throw new Error("Unexpected product package manager");'
          npm install --global pnpm@12.5.1
          test "$(pnpm --version)" = "12.5.1"
          pnpm install --frozen-lockfile
          node --import tsx scripts/ensure-playwright-chromium.mts --require-playwright-chromium
          printf 'node=%s\npnpm=%s\n' "$(node --version)" "$(pnpm --version)" >> "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"

      - name: Fresh build before staging any QA fixture
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          sha256sum dist/entry.js dist/control-ui/index.html dist/control-ui/asset-manifest.json dist/build-info.json > "$OPENCLAW_UI_E2E_ARTIFACT_DIR/build-digests.txt"
          test -d dist/control-ui/assets
          find dist/control-ui/assets -type f -name '*.js' -print0 | sort -z | xargs -0 -r sha256sum >> "$OPENCLAW_UI_E2E_ARTIFACT_DIR/build-digests.txt"
          test "$(find dist/control-ui/assets -type f -name '*.js' | wc -l)" -gt 0
          printf 'fresh_build_product_sha=%s\nfresh_build_workflow_sha=%s\n' "$CANDIDATE_SHA" "$PROOF_WORKFLOW_SHA" >> "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"

      - name: Stage only separately hashed QA fixture and config
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          qa_root=artifacts/profile-comparison-qa-20261005
          fixture=ui/src/e2e/profile-comparison.capture.real-gateway.e2e.test.ts
          config=.artifacts/profile-comparison-qa-20261005/vitest.profile-comparison.config.ts
          test ! -e "$fixture"
          test ! -e "$config"
          test -z "$(git ls-files -- "$fixture" "$config")"
          mkdir -p "$(dirname "$config")"
          cp "../qa-harness/$qa_root/profile-comparison.capture.real-gateway.e2e.test.ts" "$fixture"
          cp "../qa-harness/$qa_root/vitest.profile-comparison.config.ts" "$config"
          cmp "$fixture" "../qa-harness/$qa_root/profile-comparison.capture.real-gateway.e2e.test.ts"
          cmp "$config" "../qa-harness/$qa_root/vitest.profile-comparison.config.ts"
          sha256sum "$fixture" "$config" > "$OPENCLAW_UI_E2E_ARTIFACT_DIR/qa-digests.txt"
          test "$(git status --porcelain=v1 --untracked-files=all)" = "?? $fixture"
          printf 'tracked_product_source=unchanged\nqa_fixture=separately_hashed_untracked\nsetup=canonical_ordinary_bundled_e2e\n' >> "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"

      - name: Capture matched Profile through canonical ordinary bundled E2E lifecycle
        working-directory: product
        shell: bash
        run: |
          set -uo pipefail
          start_seconds=$SECONDS
          node scripts/run-vitest.mjs run --config .artifacts/profile-comparison-qa-20261005/vitest.profile-comparison.config.ts --configLoader runner --reporter verbose
          test_result=$?
          printf 'test_exit=%s\ntest_seconds=%s\n' "$test_result" "$((SECONDS-start_seconds))" >> "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"
          exit "$test_result"

      - name: Verify immutable source harness build and actual media
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git status --porcelain=v1 --untracked-files=all)" = '?? ui/src/e2e/profile-comparison.capture.real-gateway.e2e.test.ts'
          sha256sum --check "$OPENCLAW_UI_E2E_ARTIFACT_DIR/build-digests.txt"
          sha256sum --check "$OPENCLAW_UI_E2E_ARTIFACT_DIR/qa-digests.txt"
          captured=0
          for proof_directory in "$OPENCLAW_UI_E2E_ARTIFACT_DIR"/profile-comparison-real-gateway-capture-*; do
            if test -s "$proof_directory/01-profile-comparison-viewport.png" && test -s "$proof_directory/02-profile-comparison-fullpage.png" && test -s "$proof_directory/03-profile-comparison-identity.png"; then
              if [[ "$COMPARISON_VARIANT" = candidate ]]; then
                test -s "$proof_directory/04-profile-comparison-channel-links.png"
              fi
              captured=1
              break
            fi
          done
          test "$captured" = 1
          printf 'required_profile_comparison_media=present\nsource_harness_build_after=unchanged\n' >> "$OPENCLAW_UI_E2E_ARTIFACT_DIR/receipt.txt"

      - name: Upload only synthetic comparison media and bounded receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: identity-profile-comparison-${{ inputs.operator_variant }}-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/profile-comparison-proof/**/*.png
            ${{ runner.temp }}/profile-comparison-proof/receipt.txt
            ${{ runner.temp }}/profile-comparison-proof/build-digests.txt
            ${{ runner.temp }}/profile-comparison-proof/qa-digests.txt
          if-no-files-found: error
          retention-days: 7

  operator-proof:
    if: github.repository == 'TheAngryPit/openclaw' && inputs.proof_kind == 'operator'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      OPERATOR_VARIANT: ${{ inputs.operator_variant }}
      PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
      OPENCLAW_BUILD_PRIVATE_QA: "1"
      OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
    steps:
      - name: Validate exact source and explicit comparison variant
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPERATOR_VARIANT" = baseline || "$OPERATOR_VARIANT" = candidate ]]
          if [[ "$OPERATOR_VARIANT" = baseline ]]; then
            test "$CANDIDATE_SHA" = 2a4dacc224c56ba48c9e5353eb0907156a8b35d4
          else
            test "$CANDIDATE_SHA" = 409f7cf9b803e8c886c932ba6b4d72ab1de2f04a
          fi

      - name: Checkout exact product without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: ${{ inputs.candidate_sha }}
          path: product
          persist-credentials: false

      - name: Checkout reviewed QA harness separately from product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheAngryPit/openclaw
          ref: ${{ github.workflow_sha }}
          path: qa-harness
          persist-credentials: false

      - name: Allocate external proof directories and verify both source identities
        working-directory: product
        shell: bash
        env:
          OPERATOR_PROOF_ROOT: ${{ runner.temp }}/operator-proof
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C ../qa-harness rev-parse HEAD)" = "$PROOF_WORKFLOW_SHA"
          printf 'OPERATOR_PROOF_ROOT=%s\n' "$OPERATOR_PROOF_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$OPERATOR_PROOF_ROOT"
          printf 'candidate_sha=%s\nworkflow_sha=%s\noperator_variant=%s\n' "$CANDIDATE_SHA" "$PROOF_WORKFLOW_SHA" "$OPERATOR_VARIANT" > "$OPERATOR_PROOF_ROOT/receipt.txt"

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"

      - name: Reuse one exact product dependency installation
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (typeof p.packageManager !== "string" || p.packageManager.split("+")[0] !== "pnpm@12.5.1") throw new Error("Unexpected product package manager");'
          npm install --global pnpm@12.5.1
          test "$(pnpm --version)" = "12.5.1"
          pnpm install --frozen-lockfile
          node --import tsx scripts/ensure-playwright-chromium.mts --require-playwright-chromium
          printf 'node=%s\npnpm=%s\n' "$(node --version)" "$(pnpm --version)" >> "$OPERATOR_PROOF_ROOT/receipt.txt"

      - name: Build the exact UI and backend source for this comparison cell
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          entry_sha256="$(sha256sum dist/entry.js | cut -d ' ' -f 1)"
          [[ "$entry_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'OPENCLAW_QA_EXPECTED_GATEWAY_ENTRY_SHA256=%s\n' "$entry_sha256" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          const root = path.resolve('dist/control-ui');
          const index = fs.readFileSync(path.join(root, 'index.html'));
          const src = index.toString('utf8').match(/<script\b[^>]*\bsrc=["']([^"']+\.js(?:\?[^"']*)?)["']/i)?.[1];
          if (!src) throw new Error('Fresh UI build missing main script');
          const asset = path.resolve(root, decodeURIComponent(new URL(src, 'http://127.0.0.1/').pathname.replace(/^\/+/, '')));
          const rel = path.relative(root, asset);
          if (!rel || rel === '..' || rel.startsWith(`..${path.sep}`) || path.isAbsolute(rel)) throw new Error('UI main asset escaped build root');
          const hash = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const indexHash = hash(index), assetHash = hash(fs.readFileSync(asset));
          fs.appendFileSync(process.env.GITHUB_ENV, `OPENCLAW_QA_EXPECTED_UI_INDEX_SHA256=${indexHash}\nOPENCLAW_QA_EXPECTED_UI_MAIN_ASSET_SHA256=${assetHash}\n`);
          fs.appendFileSync(path.join(process.env.OPERATOR_PROOF_ROOT, 'receipt.txt'), `fresh_build_product_sha=${process.env.CANDIDATE_SHA}\nfresh_build_workflow_sha=${process.env.PROOF_WORKFLOW_SHA}\nui_index_sha256=${indexHash}\nui_main_asset_sha256=${assetHash}\n`);
          NODE
          printf 'gateway_entry_sha256=%s\n' "$entry_sha256" >> "$OPERATOR_PROOF_ROOT/receipt.txt"

      - name: Capture real-token named unnamed and changed-name behavior
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          for qa_case in named unnamed mutation; do
            cell="$OPERATOR_PROOF_ROOT/$OPERATOR_VARIANT-$qa_case"
            mkdir "$cell"
            OPENCLAW_QA_UI_VARIANT="$OPERATOR_VARIANT" \
            OPENCLAW_QA_CASE="$qa_case" \
            OPENCLAW_QA_UI_REPO_ROOT="$PWD" \
            OPENCLAW_QA_GATEWAY_REPO_ROOT="$PWD" \
            OPENCLAW_QA_EXPECTED_UI_COMMIT="$CANDIDATE_SHA" \
            OPENCLAW_QA_EXPECTED_GATEWAY_COMMIT="$CANDIDATE_SHA" \
            OPENCLAW_QA_ARTIFACT_DIR="$cell" \
            node ../qa-harness/artifacts/operator-token-capture-linux-20261005/run-operator-token-capture.mjs
          done

      - name: Require successful real-source receipts cleanup and desktop/mobile captures
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          for (const qaCase of ['named', 'unnamed', 'mutation']) {
            const variant = process.env.OPERATOR_VARIANT;
            const dir = path.join(process.env.OPERATOR_PROOF_ROOT, `${variant}-${qaCase}`);
            const r = JSON.parse(fs.readFileSync(path.join(dir, 'result.json'), 'utf8'));
            if (r.status !== 'passed' || r.uiVariant !== variant || r.qaCase !== qaCase ||
                r.sourceProvenance?.uiCommit !== process.env.CANDIDATE_SHA ||
                r.sourceProvenance?.gatewayCommit !== process.env.CANDIDATE_SHA ||
                r.sourceProvenance?.gatewayBuildIdentity?.entrySha256 !== process.env.OPENCLAW_QA_EXPECTED_GATEWAY_ENTRY_SHA256 ||
                r.sourceProvenance?.uiAssetDigests?.expected?.indexSha256 !== process.env.OPENCLAW_QA_EXPECTED_UI_INDEX_SHA256 ||
                r.sourceProvenance?.uiAssetDigests?.expected?.mainAssetSha256 !== process.env.OPENCLAW_QA_EXPECTED_UI_MAIN_ASSET_SHA256 ||
                r.cleanup?.browserClosed !== true || r.cleanup?.gatewayProcessGroupStopped !== true ||
                r.cleanup?.gatewayPortReleased !== true || r.tokenFragmentRemoved !== true ||
                r.communityInvitation?.cardAbsentInDesktopAndMobileScreenshots !== true) {
              throw new Error(`Incomplete actual operator proof: ${variant}-${qaCase}`);
            }
            for (const viewport of ['desktop', 'mobile']) {
              if (fs.statSync(path.join(dir, `${variant}-${qaCase}-owner-${viewport}.png`)).size === 0) {
                throw new Error('Empty owner screenshot');
              }
            }
          }
          NODE
          printf 'required_operator_receipts_and_media=present\n' >> "$OPERATOR_PROOF_ROOT/receipt.txt"

      - name: Upload only synthetic owner captures and bounded receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: identity-operator-proof-${{ inputs.operator_variant }}-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/operator-proof/*/*-owner-desktop.png
            ${{ runner.temp }}/operator-proof/*/*-owner-mobile.png
            ${{ runner.temp }}/operator-proof/*/result.json
            ${{ runner.temp }}/operator-proof/receipt.txt
          if-no-files-found: error
          retention-days: 7

  tailscale-paired-real-gateway-diagnostic:
    if: github.repository == 'TheAngryPit/openclaw' && inputs.proof_kind == 'tailscale-paired'
    name: Tailscale real-Gateway paired diagnostic (${{ matrix.label }})
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: base
            revision: 1e49231d063bad36e4b6b187727d957fbfc7fdfb
          - label: merge
            revision: 73cdbbc55705a90551a8342e3abfaf27f0672d7e
    env:
      DIAGNOSTIC_LABEL: ${{ matrix.label }}
      DIAGNOSTIC_REVISION: ${{ matrix.revision }}
      DIAGNOSTIC_WORKFLOW_SHA: ${{ github.workflow_sha }}
      EXPECTED_PACKAGE_MANAGER: pnpm@12.5.1+sha512.e3f305bc784a2bc89f5ad3b6138889470fae8d2af5f36b61216ec91c2c3d64089775f9de38aac331044ea40f245cb0d5666392dfdf65824e1907ef6a2c62de5f
      OPENCLAW_CAPTURE_UI_PROOF: "0"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false

      - name: Initialize external receipt and verify pristine checkout
        shell: bash
        run: |
          set -euo pipefail
          qa_root="$RUNNER_TEMP/tailscale-paired-qa-20261005/$DIAGNOSTIC_LABEL"
          mkdir -p "$qa_root/receipt" "$qa_root/diagnostics" "$qa_root/artifacts"
          printf 'OPENCLAW_QA_ROOT=%s\n' "$qa_root" >> "$GITHUB_ENV"
          printf 'OPENCLAW_UI_E2E_ARTIFACT_DIR=%s\n' "$qa_root/artifacts" >> "$GITHUB_ENV"
          printf 'OPENCLAW_UI_E2E_DIAGNOSTIC_DIR=%s\n' "$qa_root/diagnostics" >> "$GITHUB_ENV"
          status="$(git status --porcelain --untracked-files=all)"
          {
            printf 'label=%s\nrevision_expected=%s\nrevision_actual=' "$DIAGNOSTIC_LABEL" "$DIAGNOSTIC_REVISION"
            git rev-parse HEAD
            printf 'workflow_sha=%s\nsource_status_before=<%s>\n' "$DIAGNOSTIC_WORKFLOW_SHA" "$status"
          } > "$qa_root/receipt/checkout.txt"
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_REVISION"
          test -z "$status"

      - name: Setup pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Activate exact packageManager and install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node -p "require('./package.json').packageManager")"
          test "$package_manager" = "$EXPECTED_PACKAGE_MANAGER"
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          corepack enable
          corepack prepare "$package_manager" --activate
          test "$(node --version)" = v24.19.0
          test "$(pnpm --version)" = 12.5.1
          pnpm install --frozen-lockfile

      - name: Write the pinned include inventory outside the product checkout
        shell: bash
        run: |
          set -euo pipefail
          cat > "$OPENCLAW_QA_ROOT/receipt/include.json" <<'JSON'
          [
            "ui/src/e2e/chat-flow.catalog-bootstrap.e2e.test.ts",
            "ui/src/e2e/worker-initial-setup.real-gateway.e2e.test.ts",
            "ui/src/e2e/agent-file-lifecycle.real-gateway.e2e.test.ts",
            "ui/src/e2e/chat-composer-websearch-kill-switch.real-gateway.e2e.test.ts",
            "ui/src/e2e/chat-agent-avatar.real-gateway.e2e.test.ts",
            "ui/src/e2e/chat-stop-finished-run.real-gateway.e2e.test.ts",
            "ui/src/e2e/chat-thinking-metadata.real-gateway.e2e.test.ts",
            "ui/src/e2e/control-ui-auth-transports.e2e.test.ts",
            "ui/src/e2e/device-alias-rename.real-gateway.e2e.test.ts",
            "ui/src/e2e/logs-lifecycle.e2e.test.ts",
            "ui/src/e2e/model-picker-search.real-gateway.e2e.test.ts",
            "ui/src/e2e/profile-page.real-gateway.e2e.test.ts",
            "ui/src/e2e/session-progress-hovercard.real-gateway.e2e.test.ts"
          ]
          JSON
          printf 'OPENCLAW_VITEST_INCLUDE_FILE=%s\n' "$OPENCLAW_QA_ROOT/receipt/include.json" >> "$GITHUB_ENV"
          sha256sum "$OPENCLAW_QA_ROOT/receipt/include.json" > "$OPENCLAW_QA_ROOT/receipt/include.sha256"

      - name: Install the revision-pinned Playwright Chromium
        shell: bash
        run: node --import tsx scripts/ensure-playwright-chromium.mts --require-playwright-chromium

      - name: Build runtime and Control UI from the exact revision
        env:
          OPENCLAW_BUILD_PRIVATE_QA: "1"
          OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: "1"
        run: pnpm build

      - name: Capture source, toolchain, lock, and runner receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          qa_root="${OPENCLAW_QA_ROOT:-$RUNNER_TEMP/tailscale-paired-qa-20261005/$DIAGNOSTIC_LABEL}"
          mkdir -p "$qa_root/receipt"
          head_sha='<checkout-unavailable>'
          status='<checkout-unavailable>'
          if git rev-parse --git-dir >/dev/null 2>&1; then
            head_sha="$(git rev-parse HEAD)"
            status="$(git status --porcelain --untracked-files=all)"
          fi
          blob_of() {
            git rev-parse "HEAD:$1" 2>/dev/null || printf '<unavailable>\n'
          }
          package_manager='<unavailable>'
          if [[ -f package.json ]] && command -v node >/dev/null 2>&1; then
            package_manager="$(node -p "require('./package.json').packageManager" 2>/dev/null || printf '<unavailable>')"
          fi
          node_version='<unavailable>'
          if command -v node >/dev/null 2>&1; then node_version="$(node --version)"; fi
          pnpm_version='<unavailable>'
          if command -v pnpm >/dev/null 2>&1; then pnpm_version="$(pnpm --version 2>/dev/null || printf '<unavailable>')"; fi
          {
            printf 'label=%s\nrevision_expected=%s\nrevision_actual=%s\n' "$DIAGNOSTIC_LABEL" "$DIAGNOSTIC_REVISION" "$head_sha"
            printf 'workflow_sha=%s\nsource_status_before_test=<%s>\n' "$DIAGNOSTIC_WORKFLOW_SHA" "$status"
            printf 'workflow_blob=%s\n' "$(blob_of .github/workflows/ci.yml)"
            printf 'prebuilt_config_blob=%s\n' "$(blob_of test/vitest/vitest.ui-e2e-prebuilt.config.ts)"
            printf 'e2e_config_blob=%s\n' "$(blob_of test/vitest/vitest.ui-e2e.config.ts)"
            printf 'include_parser_blob=%s\n' "$(blob_of test/vitest/vitest.pattern-file.ts)"
            printf 'runner_script_blob=%s\n' "$(blob_of scripts/run-vitest.mjs)"
            printf 'chromium_installer_blob=%s\n' "$(blob_of scripts/ensure-playwright-chromium.mts)"
            printf 'lock_blob=%s\n' "$(blob_of pnpm-lock.yaml)"
            printf 'package_manager=%s\nnode=%s\npnpm=%s\n' "$package_manager" "$node_version" "$pnpm_version"
            printf 'playwright='; if command -v pnpm >/dev/null 2>&1 && pnpm --dir ui exec playwright --version; then :; else printf '<unavailable>\n'; fi
            printf 'os_release:\n'; cat /etc/os-release
            printf 'kernel='; uname -a
            printf 'logical_cpus='; getconf _NPROCESSORS_ONLN
            printf 'memory='; awk '/MemTotal/ {print $2 " kB"}' /proc/meminfo
            printf 'workspace_disk='; df -B1 --output=size,avail . | tail -n 1
            if [[ -f pnpm-lock.yaml ]]; then printf 'lock_sha256='; sha256sum pnpm-lock.yaml; else printf 'lock_sha256=<unavailable>\n'; fi
            include_file="${OPENCLAW_VITEST_INCLUDE_FILE:-$qa_root/receipt/include.json}"
            if [[ -f "$include_file" ]]; then
              printf 'include_sha256='; sha256sum "$include_file"
            else
              printf 'include_sha256=<not-created>\n'
            fi
          } > "$qa_root/receipt/pre-test.txt"
          if [[ "$head_sha" != '<checkout-unavailable>' ]]; then
            test "$head_sha" = "$DIAGNOSTIC_REVISION"
            test -z "$status"
          fi

      - name: Run the unchanged PREBUILT real-Gateway inventory
        id: run_real_gateway
        shell: bash
        run: |
          set -euo pipefail
          config=test/vitest/vitest.ui-e2e-prebuilt.config.ts
          test -f "$config"
          node scripts/run-vitest.mjs run \
            --config "$config" \
            --configLoader runner \
            --reporter verbose \
            --reporter github-actions \
            --reporter default \
            --reporter ./scripts/lib/vitest-resource-reporter.mts \
            --maxWorkers 2 \
            --exclude ui/src/e2e/desktop-resize.real-gateway.e2e.test.ts

      - name: Record final source state and test outcome
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.run_real_gateway.outcome || 'not-run' }}
        shell: bash
        run: |
          set -euo pipefail
          qa_root="${OPENCLAW_QA_ROOT:-$RUNNER_TEMP/tailscale-paired-qa-20261005/$DIAGNOSTIC_LABEL}"
          mkdir -p "$qa_root/receipt"
          head_sha='<checkout-unavailable>'
          status='<checkout-unavailable>'
          if git rev-parse --git-dir >/dev/null 2>&1; then
            head_sha="$(git rev-parse HEAD)"
            status="$(git status --porcelain --untracked-files=all)"
          fi
          {
            printf 'label=%s\nrevision_expected=%s\nrevision_actual=%s\n' "$DIAGNOSTIC_LABEL" "$DIAGNOSTIC_REVISION" "$head_sha"
            printf 'workflow_sha=%s\ntest_outcome=%s\nsource_status_after=<%s>\n' "$DIAGNOSTIC_WORKFLOW_SHA" "$TEST_OUTCOME" "$status"
          } > "$qa_root/receipt/final.txt"
          if [[ "$head_sha" != '<checkout-unavailable>' ]]; then
            test "$head_sha" = "$DIAGNOSTIC_REVISION"
            test -z "$status"
          fi

      - name: Upload bounded receipt and public failure summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tailscale-paired-qa-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tailscale-paired-qa-20261005/${{ matrix.label }}/receipt/**
            ${{ runner.temp }}/tailscale-paired-qa-20261005/${{ matrix.label }}/diagnostics/failure-*/failure.public.json
          if-no-files-found: ignore
          retention-days: 7
