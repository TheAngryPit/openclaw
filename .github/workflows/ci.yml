      - name: Checkout exact product without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.revision }}
          path: product
          persist-credentials: false
      - name: Set up pinned real Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Verify source and expose only the reviewed sidecar
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git -C ../harness rev-parse HEAD)" = "$HARNESS_SHA"
          qa_root="$RUNNER_TEMP/maccli-real-qa-20261005/$PROOF_LABEL"
          mkdir -p "$qa_root"
          printf 'MACCLI_QA_RECEIPT_DIR=%s\n' "$qa_root" >> "$GITHUB_ENV"
          {
            printf 'product_sha=%s\nharness_sha=%s\nlabel=%s\nrunner_environment=%s\n' "$PRODUCT_SHA" "$HARNESS_SHA" "$PROOF_LABEL" "$RUNNER_ENVIRONMENT"
            sw_vers
            xcodebuild -version
            swift --version
            node --version
            npm --version
            git status --porcelain --untracked-files=all
          } > "$qa_root/provenance.txt"
          test ! -e qa/maccli-real-distribution-qa-20261005
          test ! -e apps/macos/Tests/OpenClawIPCTests/CLIInstallerRealDistributionProofTests.swift
          mkdir -p qa
          cp -R ../harness/qa/maccli-real-distribution-qa-20261005 qa/
          cp qa/maccli-real-distribution-qa-20261005/CLIInstallerRealDistributionProofTests.swift apps/macos/Tests/OpenClawIPCTests/
          git diff --exit-code
