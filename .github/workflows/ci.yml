name: QA PR 128175 native Gateway credentials
on:
  push:
    branches: [qa/pr128175-native-auth-ids-20261012]
    paths: [.github/workflows/ci.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-pr128175-native-auth-${{ github.ref }}
  cancel-in-progress: false
env:
  BASELINE_SHA: c0d3a2427e219f9560d3b798fe3036b84cfcfda0
  SOURCE_SHA: ff41c754d9d4aa8a70bf2da9422ade5047d11c9c
  CANDIDATE_TREE: 960bb9cfcf3bfb3e65c2d5aeca05f706c1a5b733
  PRODUCTION_PATH: apps/macos/Sources/OpenClaw/GatewayEndpointStore.swift
  PRODUCTION_BLOB: b533ce149723f5b5b5c902c6e453c90785e12925
  TEST_PATH: apps/macos/Tests/OpenClawIPCTests/GatewayEndpointStoreTests.swift
  TEST_BLOB: 6864c8644851ba6cd928d8f7bcec90de404b25c3
  WORKFLOW_PATH: .github/workflows/ci.yml
  BASELINE_TEST: typed env secret ref prefers gateway service environment
  BASELINE_ID: 'OpenClawIPCTests.GatewayEndpointStoreTests/`typed env secret ref prefers gateway service environment`()'
  BASELINE_FILTER: '^OpenClawIPCTests[.]GatewayEndpointStoreTests/`typed env secret ref prefers gateway service environment`[(][)]$'
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
jobs:
  native-auth:
    if: github.repository == 'TheAngryPit/openclaw' && github.ref == 'refs/heads/qa/pr128175-native-auth-ids-20261012'
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Checkout the proof overlay for immutable provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Verify the direct child overlay and source parent
        id: provenance
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test "$(git rev-list --parents -n 1 HEAD | awk '{ print NF - 1 }')" = "1"
          source_sha="$(git rev-parse HEAD^)"
          test "$(git rev-parse "$source_sha^{tree}")" = "$CANDIDATE_TREE"
          test "$source_sha" = "$SOURCE_SHA"
          test "$(git rev-list --parents -n 1 "$source_sha" | awk '{ print NF - 1 }')" = "1"
          integration_sha="$(git rev-parse "$source_sha^1")"
          test "$integration_sha" = "df3479650085f1c3355211bfa26d70a25f2b60bd"
          test "$(git rev-list --parents -n 1 "$integration_sha" | awk '{ print NF - 1 }')" = "2"
          test "$(git rev-parse "$integration_sha^1")" = "570338e8dc72f36bc9de68600b95de69b522f0c8"
          test "$(git rev-parse "$integration_sha^2")" = "$BASELINE_SHA"
          git diff-tree --no-commit-id --name-only -r HEAD > "$RUNNER_TEMP/pr128175-overlay-paths.txt"
          test "$(wc -l < "$RUNNER_TEMP/pr128175-overlay-paths.txt" | tr -d ' ')" = "1"
          test "$(<"$RUNNER_TEMP/pr128175-overlay-paths.txt")" = "$WORKFLOW_PATH"
          test "$(git rev-parse "$source_sha:$PRODUCTION_PATH")" = "$PRODUCTION_BLOB"
          test "$(git rev-parse "$source_sha:$TEST_PATH")" = "$TEST_BLOB"
          git diff --exit-code "$BASELINE_SHA" "$source_sha" -- . \
            ":(exclude)$PRODUCTION_PATH" ":(exclude)$TEST_PATH"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          {
            echo "Overlay commit $EVENT_SHA"
            echo "Source candidate commit $source_sha"
            echo "Source tree $CANDIDATE_TREE"
            echo "Baseline $BASELINE_SHA"
            git diff --stat "$BASELINE_SHA" "$source_sha"
          } | tee "$RUNNER_TEMP/pr128175-source-receipt.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout the frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.provenance.outputs.source_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout the unchanged production baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false
          fetch-depth: 1
      - name: Overlay only the candidate test on baseline
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          cp "candidate/$TEST_PATH" "baseline/$TEST_PATH"
          cmp "candidate/$TEST_PATH" "baseline/$TEST_PATH"
          test "$(git -C baseline hash-object --no-filters "$TEST_PATH")" = "$TEST_BLOB"
          test "$(git -C baseline diff --name-only)" = "$TEST_PATH"
          git -C baseline diff --exit-code -- "$PRODUCTION_PATH" \
            src/gateway/startup-auth.ts src/gateway/auth-mode-policy.ts \
            src/gateway/auth-config-utils.ts src/gateway/auth-resolve.ts \
            src/gateway/credential-planner.ts
          {
            echo "Baseline production unchanged at $BASELINE_SHA"
            echo "Only test blob $TEST_BLOB overlaid"
            shasum -a 256 "candidate/$TEST_PATH" "baseline/$TEST_PATH"
          } | tee "$RUNNER_TEMP/pr128175-baseline-overlay.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Record the actual hosted Apple toolchain
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = "27.0"
          source scripts/lib/swift-toolchain.sh
          require_swift_toolchain
          swift test --help > "$RUNNER_TEMP/pr128175-swift-help.txt"
          swift test --help-hidden > "$RUNNER_TEMP/pr128175-swift-hidden-help.txt"
          for flag in --test-product --disable-xctest --enable-swift-testing --event-stream-output-path --event-stream-version --xunit-output; do
            grep -F -- "$flag" "$RUNNER_TEMP/pr128175-swift-hidden-help.txt"
          done
          {
            xcodebuild -version
            swift --version
            sw_vers
            echo "Test product OpenClawPackageTests"
            echo "Test module OpenClawIPCTests"
            echo "Selected suite GatewayEndpointStoreTests"
          } | tee "$RUNNER_TEMP/pr128175-toolchain.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare pinned native build resources in both source checkouts
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.9.0 --activate
          test "$(pnpm --version)" = "12.9.0"
          for source_kind in candidate baseline; do
            (
              cd "$source_kind"
              pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
              CI=true pnpm install --frozen-lockfile --prefer-offline --optional \
                --filter '@openclaw/mermaid-renderer...' \
                --filter '@openclaw/gateway-protocol...' \
                --config.ignore-scripts=false \
                --config.engine-strict=false \
                --config.enable-pre-post-scripts=true \
                --config.side-effects-cache=true
              node scripts/prepare-apple-mermaid.mjs
              node scripts/prepare-native-protocol.mjs --language swift
            )
          done
      - name: Lint both frozen Swift contribution files
        working-directory: candidate
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/pr128175-swift-tools"
          ./scripts/install-swift-tools.sh "$tools_dir"
          "$tools_dir/swiftformat" --lint --config config/swiftformat "$PRODUCTION_PATH" "$TEST_PATH"
      - name: Compile candidate native tests and record the exact selected pool
        working-directory: candidate
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/pr128175-candidate-build"
          swift build --package-path apps/macos --scratch-path "$scratch" \
            --build-system native --disable-index-store -Xswiftc -gline-tables-only \
            --build-tests > "$RUNNER_TEMP/pr128175-candidate-build.log" 2>&1
          tail -c 8192 "$RUNNER_TEMP/pr128175-candidate-build.log"
          swift test --package-path apps/macos --scratch-path "$scratch" \
            --build-system native --skip-build \
            --test-product OpenClawPackageTests --disable-xctest --enable-swift-testing \
            --list-tests > "$RUNNER_TEMP/pr128175-product-inventory.txt" 2>&1
          python3 - "$RUNNER_TEMP/pr128175-product-inventory.txt" "$RUNNER_TEMP/pr128175-selected-pool.json" <<'PY'
          import json
          import sys

          expected = set(json.loads(r'''["live local source uses canonical default and named profile ports","local conflict remains unavailable across refresh until cleared","stale local conflict cannot replace a healthy remote endpoint","local conflict does not claim an unconfigured endpoint","resolve gateway token prefers env and falls back to launchd","resolve gateway token skips unresolved env template before launchd fallback","resolve gateway token skips unresolved env shorthand before launchd fallback","resolve gateway token resolves env template from app environment","resolve gateway token resolves env template from gateway service environment","resolve gateway token resolves typed env secret ref from gateway service environment","typed env secret ref rejects absent provider without launchd fallback","typed env secret ref enforces provider source and allowlist","typed env secret ref prefers gateway service environment","typed env secret refs control final gateway handshake auth","inferred gateway auth selects one typed credential surface","inferred gateway auth follows service environment over app only fallback","inferred gateway auth masks ambient password behind unresolved local password ref","typed env secret ref stays authoritative over app environment","built in env default wins source alias collision","unsupported or malformed typed token refs suppress launchd fallback","resolve gateway token keeps invalid env template as plaintext","resolve gateway token omits unresolved env template without fallback","resolve gateway token ignores launchd in remote mode","resolve gateway token uses remote config token","remote password resolver trims remote config password","resolve gateway password falls back to launchd","resolve gateway password skips unresolved env template before launchd fallback","resolve gateway password skips unresolved env shorthand before launchd fallback","resolve gateway password resolves env template from gateway service environment","resolve gateway password resolves typed env secret ref from gateway service environment","unsupported typed password ref suppresses launchd fallback","connection mode resolver prefers config mode over defaults","connection mode resolver trims config mode","connection mode resolver falls back to defaults when missing config","connection mode resolver falls back to defaults on unknown config","connection mode resolver prefers remote URL when mode missing","intentional tailnet fallback replaces its captured loopback endpoint","ensuring an already running SSH route preserves compatibility ownership","non-ready route replacement retires the previous compatibility presentation","first readiness preserves the admitted mismatch and still refreshes the control connection","remote tunnel waits for primary app launch admission","concurrent endpoint reads for the same selection both succeed","routing generation avoids redundant source reads within each request","live source validation rejects tailnet address changes","remote TLS fingerprint changes advance endpoint revision","persisting active first use pin keeps endpoint revision stable","require endpoint rejects a source superseded by a different selection","require endpoint rejects a generation superseded after source read","newer source survives an older overlapping adoption","require endpoint rejects cancellation during endpoint resolution","tailnet fallback cannot overwrite a replacement remote selection","same URL owner replacement publishes a new route revision","remote recovery publishes its outcome after its only waiter cancels","completed remote ensure cannot publish over a replacement selection","older tunnel lookup cannot retire a concurrently completed endpoint","cancelling one remote waiter does not poison a shared tunnel ensure","concurrent remote waiters join one tunnel ensure and both succeed","resolve local gateway host uses loopback for auto even with tailnet","resolve local gateway host uses loopback for auto without tailnet","resolve local gateway host prefers tailnet for tailnet mode","resolve local gateway host falls back to loopback for tailnet mode","resolve local gateway host uses custom bind host","local config uses local gateway auth and host resolution","dashboard URL uses local base path in local mode","dashboard URL skips local base path in remote mode","dashboard URL prefers path from config URL","dashboard URL uses fragment token and omits password","dashboard URL can use native auth token override","normalize gateway url adds default port for loopback ws","normalize gateway url accepts private network ws","normalize gateway url accepts tailnet ws","gateway url validation guidance matches trusted plaintext policy","missing transport infers direct from private remote URL","legacy loopback URL keeps SSH even with trusted SSH target","explicit ssh keeps legacy tunnel even when target is direct capable","ssh restart backoff propagates cancellation","normalize gateway url rejects public host ws","normalize gateway url rejects private ipv4 suffix host bypasses","normalize gateway url rejects ipv6 prefix hostname bypasses","normalize gateway url rejects prefix bypass loopback host","resolve tls fingerprint trims remote config value","resolve tls fingerprint ignores blank or non string values"]'''))
          prefix = "OpenClawIPCTests.GatewayEndpointStoreTests/"
          parameter_labels = {
              "non-ready route replacement retires the previous compatibility presentation": "transport:",
              "first readiness preserves the admitted mismatch and still refreshes the control connection": "mode:",
              "newer source survives an older overlapping adoption": "obsoleteOlderSource:",
              "remote recovery publishes its outcome after its only waiter cancels": "fails:",
              "completed remote ensure cannot publish over a replacement selection": "fails:",
          }
          expected_identities = {
              prefix + "`" + name + "`(" + parameter_labels.get(name, "") + ")"
              for name in expected
          }
          selected = []
          with open(sys.argv[1], encoding="utf-8") as inventory_file:
              for raw_line in inventory_file:
                  identity = raw_line.rstrip("\r\n")
                  if "GatewayEndpointStoreTests/" in identity and not identity.startswith(prefix):
                      raise SystemExit("Malformed selected-suite identity in compiled inventory.")
                  if identity.startswith(prefix):
                      selected.append(identity)
          identities = sorted(set(selected))
          if len(selected) != 82 or len(identities) != 82 or set(identities) != expected_identities:
              raise SystemExit("Compiled product must contain the exact frozen 82-function identifier pool.")
          receipt = {"product": "OpenClawPackageTests", "module": "OpenClawIPCTests",
                     "suite": "GatewayEndpointStoreTests", "identities": identities}
          with open(sys.argv[2], "w", encoding="utf-8") as receipt_file:
              json.dump(receipt, receipt_file, indent=2)
          print(json.dumps(receipt))
          PY
      - name: Run the candidate endpoint suite through its canonical resource owner
        working-directory: candidate
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/pr128175-candidate-build"
          report="$RUNNER_TEMP/pr128175-candidate.xml"
          log="$RUNNER_TEMP/pr128175-candidate.log"
          node --import ./scripts/tsx.mjs scripts/test-macos-native.mts default \
            --package-path apps/macos --scratch-path "$scratch" --build-system native \
            --disable-index-store --skip-build --parallel \
            --test-product OpenClawPackageTests --disable-xctest --enable-swift-testing \
            --filter '^OpenClawIPCTests.GatewayEndpointStoreTests/' \
            --xunit-output "$report" > "$log" 2>&1
          tail -c 8192 "$log"
          if grep -E 'retained resources after incomplete|security delete-keychain failed' "$log"; then
            echo "Canonical native resource cleanup was incomplete." >&2
            exit 1
          fi
          python3 - "$report" "$RUNNER_TEMP/pr128175-selected-pool.json" "$RUNNER_TEMP/pr128175-candidate-receipt.json" <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET

          with open(sys.argv[2], encoding="utf-8") as inventory_file:
              expected = set(json.load(inventory_file)["identities"])
          root = ET.parse(sys.argv[1]).getroot()
          cases = list(root.iter("testcase"))
          identities = {case.get("classname", "") + "/" + case.get("name", "") for case in cases}
          failed = sum(case.find("failure") is not None or case.find("error") is not None for case in cases)
          skipped = sum(case.find("skipped") is not None for case in cases)
          incomplete = sum(case.get("time") is None for case in cases)
          receipt = {"reportedFunctions": len(cases), "uniqueFunctions": len(identities),
                     "failed": failed, "skipped": skipped, "incomplete": incomplete,
                     "identities": sorted(identities)}
          with open(sys.argv[3], "w", encoding="utf-8") as receipt_file:
              json.dump(receipt, receipt_file, indent=2)
          print(json.dumps(receipt))
          if len(cases) != 82 or identities != expected or failed or skipped or incomplete:
              raise SystemExit("Require exact compiled 82-function pool, positive completions, zero failures/skips.")
          PY
      - name: Compile unchanged baseline production with only the same test file
        working-directory: baseline
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/pr128175-baseline-build"
          swift build --package-path apps/macos --scratch-path "$scratch" \
            --build-system native --disable-index-store -Xswiftc -gline-tables-only \
            --build-tests > "$RUNNER_TEMP/pr128175-baseline-build.log" 2>&1
          tail -c 8192 "$RUNNER_TEMP/pr128175-baseline-build.log"
          swift test --package-path apps/macos --scratch-path "$scratch" \
            --build-system native --skip-build \
            --test-product OpenClawPackageTests --disable-xctest --enable-swift-testing \
            --list-tests > "$RUNNER_TEMP/pr128175-baseline-inventory.txt" 2>&1
          grep -Fx "$BASELINE_ID" "$RUNNER_TEMP/pr128175-baseline-inventory.txt"
      - name: Require the original typed env service-value failure on baseline
        working-directory: baseline
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/pr128175-baseline-build"
          report="$RUNNER_TEMP/pr128175-baseline.xml"
          log="$RUNNER_TEMP/pr128175-baseline.log"
          set +e
          node --import ./scripts/tsx.mjs scripts/test-macos-native.mts default \
            --package-path apps/macos --scratch-path "$scratch" --build-system native \
            --disable-index-store --skip-build --parallel \
            --test-product OpenClawPackageTests --disable-xctest --enable-swift-testing \
            --filter "$BASELINE_FILTER" \
            --xunit-output "$report" > "$log" 2>&1
          baseline_status=$?
          set -e
          tail -c 8192 "$log"
          test "$baseline_status" -ne 0
          if grep -E 'retained resources after incomplete|security delete-keychain failed' "$log"; then
            echo "Expected baseline failure does not waive resource cleanup." >&2
            exit 1
          fi
          python3 - "$report" "$BASELINE_TEST" "$RUNNER_TEMP/pr128175-baseline-receipt.json" <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          cases = list(root.iter("testcase"))
          if len(cases) != 1:
              raise SystemExit("Baseline must execute exactly the one existing regression.")
          case = cases[0]
          failures = list(case.iter("failure"))
          messages = " ".join(failure.get("message", "") for failure in failures)
          expected_identity = ("OpenClawIPCTests.GatewayEndpointStoreTests", "`" + sys.argv[2] + "`()")
          if (case.get("classname"), case.get("name")) != expected_identity:
              raise SystemExit("Baseline failed a different test.")
          if len(failures) != 1 or case.find("error") is not None or case.find("skipped") is not None or case.get("time") is None:
              raise SystemExit("Require one completed expectation failure without setup errors/skips.")
          if "Expectation failed" not in messages or "service-token" not in messages or "nil" not in messages:
              raise SystemExit("Failure must be the original missing typed service token.")
          receipt = {"identity": list(expected_identity), "passed": 0, "failed": 1, "skipped": 0,
                     "expectedFailure": "typed env service credential resolves to nil"}
          with open(sys.argv[3], "w", encoding="utf-8") as receipt_file:
              json.dump(receipt, receipt_file, indent=2)
          print(json.dumps(receipt))
          PY
      - name: Verify source and baseline overlays remain exact
        if: always()
        run: |
          set -euo pipefail
          git -C candidate diff --exit-code
          git -C candidate diff --cached --exit-code
          test -z "$(git -C candidate ls-files --others --exclude-standard)"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test "$(git -C baseline diff --name-only)" = "$TEST_PATH"
          test "$(git -C baseline hash-object --no-filters "$TEST_PATH")" = "$TEST_BLOB"
          git -C baseline diff --exit-code -- . ":(exclude)$TEST_PATH"
          git -C baseline diff --cached --exit-code
          test -z "$(git -C baseline ls-files --others --exclude-standard)"
      - name: Retain synthetic native proof diagnostics and receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr128175-native-auth-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr128175-*.txt
            ${{ runner.temp }}/pr128175-*.json
            ${{ runner.temp }}/pr128175-*.xml
            ${{ runner.temp }}/pr128175-*.log
          if-no-files-found: warn
          retention-days: 7
